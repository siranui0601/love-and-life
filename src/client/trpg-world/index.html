<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1b3025"><meta name="description" content="11の地域を歩き、生活する。あなたを待たずに進む10日間の3D Persistent World RPG。"><title>LOVE & LIFE — 世界は、あなたを待たない。</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/TRPG/world/world.css"></head>
<body>
<canvas id="game" tabindex="0" aria-label="3D世界。WASDで移動、Eで近くの人や物に働きかけます。"></canvas>
<section id="launch"><div class="launch-copy"><div class="eyebrow">LOVE & LIFE · A PERSISTENT WORLD</div><h1>世界は、<br>あなたを待たない。</h1><p>窓の外では、誰かが一日を始めている。<br>街道へ出よう。まだ知らない噂も、見知らぬ町も、そこにある。<br>十日間を、あなたはどう生きるだろう。</p><div class="launch-meta">11の土地 ／ 自律する人々 ／ 行動がつくる世界</div><form id="startForm"><input id="name" aria-label="旅人の名前" maxlength="32" placeholder="旅人の名前" autocomplete="nickname"><button class="primary" id="startButton">世界へ入る →</button></form><button class="secondary" id="resumeButton" hidden>旅を続ける</button><p><small id="resumeDetail">自動保存。会話中・不在中も時間は流れます。1日は実時間24分。</small></p></div></section>
<div id="hud" hidden>
 <div id="entityLabels" aria-hidden="true"></div>
 <div class="topbar"><div class="brand">LOVE & LIFE</div><div><div class="place" id="regionName">田園の村</div><div class="clock" id="dayClock"></div><div class="weather" id="weather"></div></div></div><div class="compass">W ─── N ─── E</div>
 <canvas id="minimap" width="180" height="180" aria-label="現在地の地図"></canvas><div class="minimap-note">◇ 街道の出口　M 世界地図</div>
 <div class="enemy" id="enemy" hidden><span id="enemyName"></span><div><div id="enemyHp"></div></div><small id="enemyIntent"></small></div>
 <button class="interact-prompt" id="interactPrompt" hidden><kbd>E</kbd><span id="interactName"></span><small>話す・調べる</small></button>
 <div class="stats"><div class="name-row"><span id="playerName"></span><span id="level"></span></div><div class="bar-row"><span>HP</span><div class="bar-track"><div class="bar-fill" id="hp"></div></div><small id="hpValue"></small></div><div class="bar-row"><span>MP</span><div class="bar-track"><div class="bar-fill" id="mp"></div></div><small id="mpValue"></small></div><div class="bar-row"><span>ST</span><div class="bar-track"><div class="bar-fill" id="stamina"></div></div><small id="staminaValue"></small></div><div class="gold" id="gold"></div></div>
 <div class="world-notice" id="worldNotice" aria-live="polite"></div><div class="controls">WASD 移動　SHIFT 走る　右ドラッグ 視点　1 攻撃　2 魔法　SPACE 回避</div>
 <nav class="toolbar" aria-label="旅のメニュー"><button id="journalButton">手帳 <kbd>J</kbd></button><button id="bagButton">持ち物 <kbd>I</kbd></button><button id="mapButton">地図 <kbd>M</kbd></button><button id="helpButton">操作 <kbd>?</kbd></button></nav>
 <div class="touch-controls" aria-label="タッチ移動"><span></span><button data-key="KeyW">↑</button><span></span><button data-key="KeyA">←</button><button data-key="KeyS">↓</button><button data-key="KeyD">→</button></div>
 <span class="connection" id="connection">接続中</span><span class="fps" id="fps"></span>
</div>
<aside id="panel" hidden role="dialog" aria-labelledby="panelTitle"><header><h2 id="panelTitle"></h2><button id="closePanel" aria-label="閉じる">×</button></header><div id="panelBody"></div></aside>
<div id="toast" role="status"></div><div id="loading" hidden>この土地へ、足を踏み入れる。</div>
<script type="module" src="/TRPG/world/dist/client.js"></script>
</body></html>
