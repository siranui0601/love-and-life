name: TRPG F Finn return focused patch

on:
  push:
    paths:
      - ".github/workflows/trpg-f-finn-return-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/trpg-virtue-route-main-143ar9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch common T01 escort return state
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/server/trpg/game/service.js')
          text = path.read_text()
          old = '''    escort.reunited = true;
              escort.reunionBeatAtMinute = runtime.playerState.absoluteMinute;
              runtime.playerState.history.push({
                type: "T01_FINN_ESCORTED_TO_SQUARE",'''
          new = '''    escort.reunited = true;
              escort.reunionBeatAtMinute = runtime.playerState.absoluteMinute;
              runtime.playerState.worldFlags ??= {};
              runtime.playerState.worldFlags.t01FinnReturned = true;
              runtime.playerState.history.push({
                type: "T01_FINN_ESCORTED_TO_SQUARE",'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one common escort return block, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Focused production regressions
        run: >-
          node --test
          tools/trpg-sim/test/checkpoint-f-production-certificate.test.mjs
          tools/trpg-sim/test/checkpoint-e-production-certificate.test.mjs
          tools/trpg-sim/test/game-service.test.mjs
      - name: Commit verified patch and remove runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/trpg-f-finn-return-fix.yml
          git add src/server/trpg/game/service.js
          git commit -m "fix(trpg): persist Finn return on common escort movement"
          git push origin HEAD:claude/trpg-virtue-route-main-143ar9
