name: now-coding-composable-expressions-once

on:
  push:
    branches:
      - fix/now-coding-composable-expressions
    paths:
      - "tools/now-coding/patch-composable-expressions.py"
      - ".github/workflows/now-coding-composable-expressions-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/now-coding-composable-expressions
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply composable expression patch
        run: python tools/now-coding/patch-composable-expressions.py
      - name: Harden Safari drop and tutorial completion
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('public/now-coding/app-v3.js')
          app = app_path.read_text()

          old_drag = 'e.dataTransfer.types.includes("application/x-now-expression")&&acceptsExpression(expected,presetKind(e.dataTransfer.getData("application/x-now-expression")||""))'
          if old_drag not in app:
              raise SystemExit('dragover compatibility anchor missing')
          app = app.replace(old_drag, 'e.dataTransfer.types.includes("application/x-now-expression")', 1)

          old_save = 'if(isTutorial())await tutorialProgress(8,true);'
          if old_save not in app:
              raise SystemExit('tutorial completion anchor missing')
          app = app.replace(old_save, 'if(isTutorial())await tutorialProgress(TUTORIAL_STEPS.length,true);', 1)
          app_path.write_text(app)

          contract_path = Path('tools/now-coding/client-contract.test.mjs')
          contract = contract_path.read_text()
          pattern = r'test\("initial tutorial teaches comparison from empty sockets", \(\) => \{.*?\n\}\);'
          replacement = '''test("initial tutorial teaches comparison from empty sockets", () => {
            assert.match(app, /『もし ○○ なら』を追加します。○○はまだ空欄/);
            assert.ok(app.includes('data-expression-preset="compare"'));
            assert.ok(app.includes('data-expression-preset="sensor"'));
            assert.ok(app.includes('data-expression-preset="cellState"'));
            assert.match(app, /step===10&&a\\.alive&&game\\.tick>=30/);
            assert.match(app, /tutorialProgress\\(TUTORIAL_STEPS\\.length,true\\)/);
          });'''
          contract, count = re.subn(pattern, replacement, contract, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('tutorial contract replacement failed')
          contract_path.write_text(contract)
          PY
      - name: Validate
        run: |
          node --check public/now-coding/app-v3.js
          node --check public/now-coding/tutorials.js
          node --check public/now-coding/vm.js
          node --test tools/now-coding/engine.test.mjs tools/now-coding/client-contract.test.mjs
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/now-coding/app-v3.js public/now-coding/index.html public/now-coding/tutorials.js public/now-coding/style-v6.css tools/now-coding/client-contract.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix(now-coding): compose expressions directly in the editor"
          git push origin HEAD:fix/now-coding-composable-expressions
