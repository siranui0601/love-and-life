name: now-coding-apply-polish-once

on:
  push:
    branches:
      - feat/now-coding-vm-editor-v2
    paths:
      - "tools/now-coding/patch-client-polish.mjs"
      - ".github/workflows/now-coding-apply-polish-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/now-coding-vm-editor-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply client polish
        run: node tools/now-coding/patch-client-polish.mjs
      - name: Validate
        run: |
          node --check public/now-coding/app-v3.js
          node --test tools/now-coding/engine.test.mjs tools/now-coding/client-contract.test.mjs
      - name: Commit product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/now-coding/app-v3.js
          git diff --cached --quiet && exit 0
          git commit -m "feat(now-coding): finish tutorial replay and help polish"
          git push origin HEAD:feat/now-coding-vm-editor-v2
