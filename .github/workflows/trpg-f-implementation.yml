name: TRPG Checkpoint F patch runner

on:
  push:
    branches: [claude/trpg-virtue-route-main-143ar9]
    paths: [.github/workflows/trpg-f-implementation.yml]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/trpg-virtue-route-main-143ar9
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Recover and run staged implementation script
        shell: bash
        run: |
          git show d1fa04b623968375a36cf9d864da342770320f39:.github/workflows/trpg-f-implementation.yml > /tmp/staged-f.yml
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/staged-f.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if "python3 <<'PY'" in line)
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          body = lines[start + 1:end]
          prefix = '          '
          body = [line[len(prefix):] if line.startswith(prefix) else line for line in body]
          Path('/tmp/apply-f.py').write_text('\n'.join(body) + '\n')
          PY
          python3 /tmp/apply-f.py
      - name: Syntax checks
        run: |
          node --check tools/trpg-sim/lib/npc-life-engine.mjs
          node --check src/server/trpg/content/authored-register-butterfly.js
          node --check src/server/trpg/game/service.js
      - name: Focused butterfly tests
        run: node --test tools/trpg-sim/test/authored-register-butterfly.test.mjs
        continue-on-error: true
      - name: Commit runtime implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/trpg-sim/lib/npc-life-engine.mjs src/server/trpg/content/authored-register-butterfly.js src/server/trpg/game/service.js
          git diff --cached --check
          git commit -m "feat(trpg): model common world conversations"
          git push origin HEAD:claude/trpg-virtue-route-main-143ar9
