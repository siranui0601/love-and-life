name: Apply TRPG equipment access v1

on:
  push:
    branches:
      - chatgpt/trpg-authored-content-refactor
    paths:
      - ".github/workflows/apply-trpg-equipment-access-v1.yml"
      - "tools/trpg-refactor/apply-equipment-access-v1.mjs"
      - "tools/trpg-refactor/fix-equipment-access-ui-test.mjs"
      - "tools/trpg-sim/lib/equipment-access.mjs"
      - "tools/trpg-sim/test/equipment-access.test.mjs"

permissions:
  contents: write

concurrency:
  group: trpg-equipment-access-v1
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/trpg-authored-content-refactor
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Integrate trials used purchases loans returns and rewards
        shell: bash
        run: |
          set +e
          mkdir -p tools/trpg-refactor
          node tools/trpg-refactor/apply-equipment-access-v1.mjs > tools/trpg-refactor/equipment-access-integration.log 2>&1
          status=$?
          cat tools/trpg-refactor/equipment-access-integration.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/trpg-refactor/equipment-access-integration.log
            git commit -m "test(trpg): record equipment access integration failure"
            git push origin HEAD:chatgpt/trpg-authored-content-refactor
            exit "$status"
          fi
      - name: Repair generated equipment UI contract
        run: node tools/trpg-refactor/fix-equipment-access-ui-test.mjs
      - run: npm ci
      - name: Run complete TRPG regression suite
        shell: bash
        run: |
          set +e
          npm run trpg:test > tools/trpg-equipment-access-regression.log 2>&1
          status=$?
          cat tools/trpg-equipment-access-regression.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/trpg-equipment-access-regression.log
            git commit -m "test(trpg): record equipment access regression failure"
            git push origin HEAD:chatgpt/trpg-authored-content-refactor
            exit "$status"
          fi
      - name: Commit integrated source
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/trpg-equipment-access-regression.log tools/trpg-refactor/equipment-access-integration.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(trpg): integrate equipment trials loans and rewards"
          git push origin HEAD:chatgpt/trpg-authored-content-refactor
