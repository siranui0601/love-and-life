name: apply-now-coding-pr314-paste

on:
  push:
    branches:
      - fix/now-coding-placement-mode-performance

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.head_commit.message == 'chore: run PR314 paste wording patch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/now-coding-placement-mode-performance
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply wording patch
        run: node tools/now-coding/apply-pr314-paste-wording.mjs
      - name: Syntax check
        run: node --check public/now-coding/app-v3.js
      - name: Focused Now Coding tests
        run: node --test tools/now-coding/client-contract.test.mjs tools/now-coding/tutorial-recovery.test.mjs tools/now-coding/engine.test.mjs tools/now-coding/board-spawn.test.mjs tools/now-coding/fall-timed-collapse.test.mjs
      - name: Commit implementation
        run: |
          git config user.name "siranui0601"
          git config user.email "41378727+siranui0601@users.noreply.github.com"
          git add public/now-coding/app-v3.js tools/now-coding/client-contract.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix(now-coding): use paste wording after copy"
          git push origin HEAD:fix/now-coding-placement-mode-performance
