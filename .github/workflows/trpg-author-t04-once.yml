name: TRPG author T04 once

on:
  push:
    branches:
      - agent/trpg-human-authored-choices
    paths:
      - .github/workflows/trpg-author-t04-once.yml

permissions:
  contents: write

jobs:
  author-t04:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TRPG_SPREADSHEET_ID: 15slftR2b-76VKaUqTisYolhN1iCpHeB7asUBoyMnmRk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/trpg-human-authored-choices
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify authoritative T04 sheet data and configured secrets
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { google } from 'googleapis';

          assert.ok(process.env.GEMINI_API_KEY, 'GEMINI_API_KEY must be configured');
          assert.ok(process.env.GOOGLE_SERVICE_ACCOUNT_KEY, 'GOOGLE_SERVICE_ACCOUNT_KEY must be configured');
          const credentials = JSON.parse(process.env.GOOGLE_SERVICE_ACCOUNT_KEY);
          const auth = new google.auth.GoogleAuth({
            credentials,
            scopes: ['https://www.googleapis.com/auth/spreadsheets.readonly'],
          });
          const sheets = google.sheets({ version: 'v4', auth });
          const response = await sheets.spreadsheets.values.batchGet({
            spreadsheetId: process.env.TRPG_SPREADSHEET_ID,
            ranges: [
              "'トラブル一覧'!A4:N25",
              "'古代神殿'!A16:H26",
              "'NPC一覧'!A4:X110",
            ],
          });
          const text = JSON.stringify(response.data.valueRanges ?? []);
          for (const required of [
            'T04',
            '古代神殿の巡礼者失踪',
            'LOC_TEMPLE_ADMIN',
            'LOC_TEMPLE_CORRIDOR',
            'LOC_TEMPLE_SEALED',
            'LOC_BORDER_SMALL_SHRINE',
            'NPC053',
            'ファルコ',
            'NPC055',
            'エイダ巡礼者',
          ]) assert.ok(text.includes(required), `authoritative sheet data is missing ${required}`);
          console.log('Authoritative T04 sheet rows and repository secrets verified.');
          NODE
