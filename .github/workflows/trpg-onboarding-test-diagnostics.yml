name: Finalize TRPG onboarding immersion redesign

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/trpg-onboarding-test-diagnostics.yml
      - tools/trpg-fix-onboarding-regressions.mjs
      - src/server/trpg/**
      - public/TRPG/**
      - tools/trpg-sim/test/**

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'chatgpt/trpg-onboarding-immersion-redesign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/trpg-onboarding-immersion-redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply compatibility fixes
        run: node tools/trpg-fix-onboarding-regressions.mjs
      - run: npm ci
      - name: Run tests and capture remaining failures
        run: |
          set +e
          npm run trpg:test > /tmp/trpg-test.log 2>&1
          status=$?
          {
            echo "exit_code=$status"
            echo
            grep -nE '^not ok ' /tmp/trpg-test.log || true
            echo
            grep -nE 'AssertionError|ERR_ASSERTION|TestContext\.<anonymous>|error:|operator:' /tmp/trpg-test.log || true
            echo
            grep -E '^# (tests|pass|fail|cancelled|skipped|duration_ms)' /tmp/trpg-test.log || true
          } > tools/trpg-sim/test-diagnostics.log
          exit 0
      - name: Commit applied redesign and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(trpg): align contextual onboarding with existing progression" || exit 0
          git push origin HEAD:chatgpt/trpg-onboarding-immersion-redesign
