name: Export mismatched Ten Freely patch chunk

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/ten-freely-infinite-lives'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ten-freely-infinite-lives
      - uses: actions/upload-artifact@v4
        with:
          name: ten-freely-part00-diagnostic
          path: .github/ten-freely-infinite-patch/part00
          retention-days: 1
