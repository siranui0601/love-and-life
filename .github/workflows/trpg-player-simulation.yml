name: TRPG refine unattended weapon-shop prose

on:
  pull_request:
    paths:
      - ".github/workflows/trpg-player-simulation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trpg-refine-unattended-weapon-shop-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/trpg-authored-content-refactor
          fetch-depth: 2
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Replace meta commentary with in-world prose
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const filePath = "src/server/trpg/content/authored/journeys/farm-to-capital.js";
          const before = "坂の上の武器屋へ着いたが、扉の掛け札は裏返され、店内に人の気配はない。窓越しには剣と槍、奥には弓と杖が用途ごとに並び、中央には試し振りのためらしい空間が見える。店主がいないのに、誰かが応対していることにはしない。";
          const after = "坂の上の武器屋へ着いたが、扉の掛け札は裏返され、店内に人の気配はない。窓越しには剣と槍、奥には弓と杖が用途ごとに並び、中央には試し振りのためらしい空間が見える。戸口脇の札には『戻り次第、試し持ち可』とだけあり、今は店主が戻る頃に改めるほかなさそうだ。";
          const source = fs.readFileSync(filePath, "utf8");
          if (!source.includes(before)) throw new Error("unattended prose anchor missing");
          fs.writeFileSync(filePath, source.replace(before, after), "utf8");
          NODE
      - name: Run authored journey tests
        run: node --test tools/trpg-sim/test/authored-journey-presentation.test.mjs
      - name: Run complete TRPG regression suite
        run: npm run trpg:test
      - name: Commit reviewed prose and restore ordinary CI
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD^ -- .github/workflows/trpg-player-simulation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/trpg-player-simulation.yml \
            src/server/trpg/content/authored/journeys/farm-to-capital.js
          git commit -m "refactor(trpg): keep unattended shop prose in-world"
          git push origin HEAD:chatgpt/trpg-authored-content-refactor
