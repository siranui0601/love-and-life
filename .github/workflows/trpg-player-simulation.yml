name: TRPG route dialogue choice diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/trpg-player-simulation.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/trpg-authored-content-refactor
          fetch-depth: 10
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply candidate patch and print dialogue choices
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          workflow = subprocess.check_output(
              ["git", "show", "HEAD^^^^:.github/workflows/trpg-player-simulation.yml"],
              text=True,
          )
          marker = "          node --input-type=module <<'NODE'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          NODE", start)
          body = workflow[start:end]
          body = "\n".join(line[10:] if line.startswith("          ") else line for line in body.splitlines())
          Path("/tmp/public-route-patch.mjs").write_text(body + "\n", encoding="utf-8")
          PY
          node /tmp/public-route-patch.mjs
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const servicePath = "src/server/trpg/game/service.js";
          let service = fs.readFileSync(servicePath, "utf8");
          service = service.replace(
            `  if (runtime.tutorial && runtime.tutorial.stage !== "free") return current;\n  if (capitalWeaponShopFirstInteractionActive(runtime)) return current;`,
            `  if (runtime.tutorial && runtime.tutorial.stage !== "free") return current;\n  if (runtime.dialogueSession) return current;\n  if (capitalWeaponShopFirstInteractionActive(runtime)) return current;`,
          );
          service = service.replace(
            `    .find(({ action }) => !action.missionId\n      && action.capitalArrivalGuidance !== true\n      && !["eat", "rest"].includes(action.type)\n      && action.workOffer !== true)?.index;`,
            `    .find(({ action }) => !action.missionId\n      && action.capitalArrivalGuidance !== true\n      && (["wait", "plan", "observe"].includes(action.type) || action.movementScope === "local"))?.index;`,
          );
          fs.writeFileSync(servicePath, service, "utf8");

          const testPath = "tools/trpg-sim/test/game-service.test.mjs";
          let tests = fs.readFileSync(testPath, "utf8");
          const anchor = `  assert.equal(runner.save.choices.length, 3);\n  assert.ok(runner.save.choices.every((choice) => choice.actionId.startsWith(\`DIALOGUE:${'${talk.targetNpcId}'}:\`)));`;
          const replacement = `  assert.equal(runner.save.choices.length, 3);\n  console.log("DIALOGUE_CHOICES", JSON.stringify({ talk, choices: runner.save.choices }, null, 2));\n  assert.ok(runner.save.choices.every((choice) => choice.actionId.startsWith(\`DIALOGUE:${'${talk.targetNpcId}'}:\`)));`;
          if (!tests.includes(anchor)) throw new Error("dialogue assertion anchor missing");
          fs.writeFileSync(testPath, tests.replace(anchor, replacement), "utf8");
          NODE
          node --test --test-name-pattern="ordinary NPC conversation supports" tools/trpg-sim/test/game-service.test.mjs
