name: TRPG T17 combined regression diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/trpg-player-simulation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/trpg-authored-content-refactor
          fetch-depth: 8
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reapply the candidate service patch
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          workflow = subprocess.check_output(
              ["git", "show", "05ed81eed0460715ffa63d44dc474757132fec3a:.github/workflows/trpg-player-simulation.yml"],
              text=True,
          )
          marker = "          cat > /tmp/patch-t17-service.py <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          body = "\n".join(line[10:] if line.startswith("          ") else line for line in workflow[start:end].splitlines())
          Path("/tmp/patch-t17-service.py").write_text(body + "\n", encoding="utf-8")
          PY
          python /tmp/patch-t17-service.py
      - name: Run combined focused regression with captured output
        shell: bash
        run: |
          set +e
          node --test \
            tools/trpg-sim/test/t17-second-summoning.test.mjs \
            tools/trpg-sim/test/authored-journey-presentation.test.mjs \
            tools/trpg-sim/test/game-service.test.mjs \
            > /tmp/t17-combined.log 2>&1
          status=$?
          echo "$status" > /tmp/t17-combined.status
          tail -n 240 /tmp/t17-combined.log
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trpg-t17-combined-diagnostics
          path: |
            /tmp/t17-combined.log
            /tmp/t17-combined.status
      - name: Enforce combined result
        shell: bash
        run: exit "$(cat /tmp/t17-combined.status)"
