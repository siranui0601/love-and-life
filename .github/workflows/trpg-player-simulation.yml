name: TRPG public route focused diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/trpg-player-simulation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trpg-public-route-freedom-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/trpg-authored-content-refactor
          fetch-depth: 6
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply reviewed route patch and dialogue guard
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          workflow = subprocess.check_output(
              ["git", "show", "HEAD^^:.github/workflows/trpg-player-simulation.yml"],
              text=True,
          )
          marker = "          node --input-type=module <<'NODE'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          NODE", start)
          body = workflow[start:end]
          body = "\n".join(line[10:] if line.startswith("          ") else line for line in body.splitlines())
          Path("/tmp/public-route-patch.mjs").write_text(body + "\n", encoding="utf-8")
          PY
          node /tmp/public-route-patch.mjs
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = "src/server/trpg/game/service.js";
          const before = `  if (runtime.tutorial && runtime.tutorial.stage !== "free") return current;\n  if (capitalWeaponShopFirstInteractionActive(runtime)) return current;`;
          const after = `  if (runtime.tutorial && runtime.tutorial.stage !== "free") return current;\n  if (runtime.dialogueSession) return current;\n  if (capitalWeaponShopFirstInteractionActive(runtime)) return current;`;
          const source = fs.readFileSync(path, "utf8");
          if (!source.includes(before)) throw new Error("dialogue guard anchor missing");
          fs.writeFileSync(path, source.replace(before, after), "utf8");
          NODE
      - name: Run focused tests with diagnostics
        shell: bash
        run: |
          mkdir -p tools/trpg-sim/reports
          set +e
          node --test \
            tools/trpg-sim/test/capital-arrival-guidance.test.mjs \
            tools/trpg-sim/test/authored-journey-presentation.test.mjs \
            tools/trpg-sim/test/game-service.test.mjs \
            > tools/trpg-sim/reports/public-route-focused.log 2>&1
          status=$?
          cat tools/trpg-sim/reports/public-route-focused.log
          echo "$status" > tools/trpg-sim/reports/public-route-focused.status
          exit 0
      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trpg-public-route-focused
          path: tools/trpg-sim/reports/public-route-focused.*
          retention-days: 7
      - name: Enforce focused tests
        run: test "$(cat tools/trpg-sim/reports/public-route-focused.status)" = "0"
