name: TRPG public route freedom integration

on:
  pull_request:
    paths:
      - ".github/workflows/trpg-player-simulation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trpg-public-route-freedom-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/trpg-authored-content-refactor
          fetch-depth: 8
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply reviewed route patch
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          workflow = subprocess.check_output(
              ["git", "show", "HEAD^^^:.github/workflows/trpg-player-simulation.yml"],
              text=True,
          )
          marker = "          node --input-type=module <<'NODE'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          NODE", start)
          body = workflow[start:end]
          body = "\n".join(line[10:] if line.startswith("          ") else line for line in body.splitlines())
          Path("/tmp/public-route-patch.mjs").write_text(body + "\n", encoding="utf-8")
          PY
          node /tmp/public-route-patch.mjs
      - name: Preserve conversations and meaningful local choices
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = "src/server/trpg/game/service.js";
          let source = fs.readFileSync(path, "utf8");
          const dialogueBefore = `  if (runtime.tutorial && runtime.tutorial.stage !== "free") return current;\n  if (capitalWeaponShopFirstInteractionActive(runtime)) return current;`;
          const dialogueAfter = `  if (runtime.tutorial && runtime.tutorial.stage !== "free") return current;\n  if (runtime.dialogueSession) return current;\n  if (capitalWeaponShopFirstInteractionActive(runtime)) return current;`;
          if (!source.includes(dialogueBefore)) throw new Error("dialogue guard anchor missing");
          source = source.replace(dialogueBefore, dialogueAfter);

          const replacementBefore = `    .find(({ action }) => !action.missionId\n      && action.capitalArrivalGuidance !== true\n      && !["eat", "rest"].includes(action.type)\n      && action.workOffer !== true)?.index;`;
          const replacementAfter = `    .find(({ action }) => !action.missionId\n      && action.capitalArrivalGuidance !== true\n      && (["wait", "plan", "observe"].includes(action.type) || action.movementScope === "local"))?.index;`;
          if (!source.includes(replacementBefore)) throw new Error("regional replacement anchor missing");
          source = source.replace(replacementBefore, replacementAfter);
          fs.writeFileSync(path, source, "utf8");
          NODE
      - name: Run focused freedom and dialogue tests
        run: |
          node --test \
            tools/trpg-sim/test/capital-arrival-guidance.test.mjs \
            tools/trpg-sim/test/authored-journey-presentation.test.mjs \
            tools/trpg-sim/test/game-service.test.mjs
      - name: Run complete TRPG regression suite
        run: npm run trpg:test
      - name: Commit reviewed route freedom and restore ordinary CI
        shell: bash
        run: |
          set -euo pipefail
          git checkout d43ce68877c9fd6c7e81d1488b9a766313ae1e42 -- .github/workflows/trpg-player-simulation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/trpg-player-simulation.yml \
            src/server/trpg/resolvers/capital-arrival-guidance.js \
            src/server/trpg/game/service.js \
            src/server/trpg/content/authored/journeys/farm-to-capital.js \
            tools/trpg-sim/test/capital-arrival-guidance.test.mjs \
            tools/trpg-sim/test/authored-journey-presentation.test.mjs
          git commit -m "feat(trpg): open public routes after reaching the capital"
          git push origin HEAD:chatgpt/trpg-authored-content-refactor
