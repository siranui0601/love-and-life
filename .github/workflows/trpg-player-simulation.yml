name: TRPG integrated player simulation

on:
  pull_request:
    paths:
      - "tools/trpg-sim/**"
      - "public/TRPG/**"
      - "src/server/trpg/**"
      - "src/server/app.js"
      - "package.json"
      - ".github/workflows/trpg-player-simulation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply one-time generic clue fixture patch
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/trpg-human-authored-choices'
        shell: bash
        run: |
          script=.github/scripts/apply-t19-generic-clue-fixture.py
          if [ ! -f "$script" ]; then
            echo "One-time patch already applied."
            exit 0
          fi
          python "$script"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/trpg-sim/test/game-service.test.mjs "$script"
          git commit -m "TRPG: 全事件手書き化後も汎用会話契約を独立検証"
          git push origin "HEAD:${{ github.head_ref }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run TRPG tests
        shell: bash
        run: |
          mkdir -p tools/trpg-sim/reports
          set -o pipefail
          npm run trpg:test 2>&1 | tee tools/trpg-sim/reports/test-v4.log
      - name: Run integrated player, GOAP and Gemini journeys v4
        env:
          TRPG_PLAYER_V4_SEEDS: 2
          TRPG_GOAP_V4_SEEDS: 2
        run: node tools/trpg-sim/cli-player-v4.mjs --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trpg-player-simulation-v4
          path: |
            tools/trpg-sim/reports/test-v4.log
            tools/trpg-sim/reports/player-v4-latest.json
            tools/trpg-sim/reports/player-v4-latest.md
            tools/trpg-sim/reports/player-latest.json
            tools/trpg-sim/reports/player-latest.md
            public/TRPG/player-simulation-report.json
            public/TRPG/player-simulation-v4-report.json
