name: TRPG public route final focused diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/trpg-player-simulation.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/trpg-authored-content-refactor
          fetch-depth: 12
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply final candidate patch
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          workflow = subprocess.check_output(
              ["git", "show", "HEAD^^^^^:.github/workflows/trpg-player-simulation.yml"],
              text=True,
          )
          marker = "          node --input-type=module <<'NODE'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          NODE", start)
          body = workflow[start:end]
          body = "\n".join(line[10:] if line.startswith("          ") else line for line in body.splitlines())
          Path("/tmp/public-route-patch.mjs").write_text(body + "\n", encoding="utf-8")
          PY
          node /tmp/public-route-patch.mjs
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = "src/server/trpg/game/service.js";
          let source = fs.readFileSync(path, "utf8");
          source = source.replace(
            `  if (runtime.tutorial && runtime.tutorial.stage !== "free") return current;\n  if (capitalWeaponShopFirstInteractionActive(runtime)) return current;`,
            `  if (runtime.tutorial && runtime.tutorial.stage !== "free") return current;\n  if (runtime.dialogueSession) return current;\n  if (capitalWeaponShopFirstInteractionActive(runtime)) return current;`,
          );
          source = source.replace(
            `    .find(({ action }) => !action.missionId\n      && action.capitalArrivalGuidance !== true\n      && !["eat", "rest"].includes(action.type)\n      && action.workOffer !== true)?.index;`,
            `    .find(({ action }) => !action.missionId\n      && action.capitalArrivalGuidance !== true\n      && (["wait", "plan", "observe"].includes(action.type) || action.movementScope === "local"))?.index;`,
          );
          fs.writeFileSync(path, source, "utf8");
          NODE
      - name: Run focused suite with diagnostics
        shell: bash
        run: |
          mkdir -p tools/trpg-sim/reports
          set +e
          node --test \
            tools/trpg-sim/test/capital-arrival-guidance.test.mjs \
            tools/trpg-sim/test/authored-journey-presentation.test.mjs \
            tools/trpg-sim/test/game-service.test.mjs \
            > tools/trpg-sim/reports/public-route-final-focused.log 2>&1
          status=$?
          cat tools/trpg-sim/reports/public-route-final-focused.log
          echo "$status" > tools/trpg-sim/reports/public-route-final-focused.status
          exit 0
      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trpg-public-route-final-focused
          path: tools/trpg-sim/reports/public-route-final-focused.*
          retention-days: 7
      - name: Enforce focused suite
        run: test "$(cat tools/trpg-sim/reports/public-route-final-focused.status)" = "0"
