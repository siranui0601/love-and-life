name: TRPG T17 authored branch integration

on:
  pull_request:
    paths:
      - ".github/workflows/trpg-player-simulation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trpg-t17-authored-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/trpg-authored-content-refactor
          fetch-depth: 18
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply reviewed T17 integration
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          integration = subprocess.check_output(
              ["git", "show", "05ed81eed0460715ffa63d44dc474757132fec3a:.github/workflows/trpg-player-simulation.yml"],
              text=True,
          )
          marker = "          cat > /tmp/patch-t17-service.py <<'PY'\n"
          start = integration.index(marker) + len(marker)
          end = integration.index("\n          PY", start)
          body = "\n".join(line[10:] if line.startswith("          ") else line for line in integration[start:end].splitlines())
          Path("/tmp/patch-t17-service.py").write_text(body + "\n", encoding="utf-8")
          PY
          python /tmp/patch-t17-service.py
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/trpg-sim/test/game-service.test.mjs")
          source = path.read_text(encoding="utf-8")
          start_before = 'test("all nineteen special-mission hearings are bound to a present authoritative NPC", () => {\n  const { game } = service();\n  const covered = [];\n  for (const definitionTemplate of createGameRuntime(game.data, {'
          start_after = 'test("all generic special-mission hearings are bound to a present authoritative NPC", () => {\n  const { game } = service();\n  const authoredHearingMissionIds = new Set(["MSN-T17"]);\n  const covered = [];\n  for (const definitionTemplate of createGameRuntime(game.data, {'
          if start_before not in source:
              raise RuntimeError("hearing test start anchor missing")
          source = source.replace(start_before, start_after, 1)
          loop_anchor = '  }).playerState.catalog.special) {\n    const runtime = createGameRuntime(game.data, {'
          loop_after = '  }).playerState.catalog.special) {\n    // T17 uses its own reviewed Layla conversation triad; the dedicated T17\n    // test owns that stricter presence and disclosure contract.\n    if (authoredHearingMissionIds.has(definitionTemplate.id)) continue;\n    const runtime = createGameRuntime(game.data, {'
          if loop_anchor not in source:
              raise RuntimeError("hearing loop anchor missing")
          source = source.replace(loop_anchor, loop_after, 1)
          expected_before = '  assert.deepEqual(covered, Array.from({ length: 19 }, (_, index) => `T${String(index + 1).padStart(2, "0")}`));'
          expected_after = '  assert.deepEqual(covered, Array.from({ length: 19 }, (_, index) => `T${String(index + 1).padStart(2, "0")}`).filter((troubleId) => troubleId !== "T17"));'
          if expected_before not in source:
              raise RuntimeError("hearing expected list anchor missing")
          source = source.replace(expected_before, expected_after, 1)
          path.write_text(source, encoding="utf-8")
          PY
          node --check src/server/trpg/game/service.js
          node --check src/server/trpg/content/authored/missions/t17-second-summoning.js
          node --check tools/trpg-sim/test/t17-second-summoning.test.mjs
          node --check tools/trpg-sim/test/game-service.test.mjs
          git diff --check
      - name: Run focused T17 and service regressions
        run: |
          node --test \
            tools/trpg-sim/test/t17-second-summoning.test.mjs \
            tools/trpg-sim/test/authored-journey-presentation.test.mjs \
            tools/trpg-sim/test/game-service.test.mjs
      - name: Run complete TRPG regression suite
        run: npm run trpg:test
      - name: Commit reviewed T17 slice and restore ordinary CI
        shell: bash
        run: |
          set -euo pipefail
          git checkout a1cfdbe5669aea235dcfd1ccf4d051dfb53b08a7 -- .github/workflows/trpg-player-simulation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/trpg-player-simulation.yml \
            src/server/trpg/content/authored-scene-registry.js \
            src/server/trpg/content/authored/missions/t17-second-summoning.js \
            src/server/trpg/game/service.js \
            tools/trpg-sim/test/t17-second-summoning.test.mjs \
            tools/trpg-sim/test/game-service.test.mjs
          git diff --cached --check
          git commit -m "feat(trpg): author the first T17 investigation branches"
          git push origin HEAD:chatgpt/trpg-authored-content-refactor
