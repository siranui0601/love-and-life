name: Apply Ten Freely online flow update

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/ten-freely-online-flow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ten-freely-online-flow
          fetch-depth: 0

      - name: Restore and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          echo 'c6fa5dbe7d179f78d70f517a0b63af1c62f85906813aef34906cc20970ceccc8  .github/ten-freely-online-patch/part00' | sha256sum -c -
          echo 'da74ea8b835a795b9fc44774c99243ed3887409cb55be122b5a04fb2ad7de949  .github/ten-freely-online-patch/part01' | sha256sum -c -
          echo '0a696ed2deb575809ce6fc3105b14b05e400c3d93b9110d923ecdfe4cea7c5df  .github/ten-freely-online-patch/part02' | sha256sum -c -
          cat .github/ten-freely-online-patch/part* | tr -d '\r\n' | base64 --decode | gzip --decompress > /tmp/ten-freely-online.patch
          echo '8ff2b11364fcacaa5c1a4a05896113da138a9c25e5f7ef9b0014deb502ffd04f  /tmp/ten-freely-online.patch' | sha256sum -c -
          git apply --check /tmp/ten-freely-online.patch
          git apply /tmp/ten-freely-online.patch

      - name: Verify synchronized match flow
        shell: bash
        run: |
          set -euo pipefail
          node --check 'public/10を自由に/online.js'
          node --check 'src/10を自由に/online.js'
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          class Parser(HTMLParser):
              pass

          html = Path('public/10を自由に/index.html').read_text()
          Parser().feed(html)
          css = Path('public/10を自由に/style.css').read_text()
          client = Path('public/10を自由に/online.js').read_text()
          server = Path('src/10を自由に/online.js').read_text()

          assert css.count('{') == css.count('}')
          for element_id in (
              'onlineCountdownLayer', 'onlineCountdownKicker', 'onlineCountdownTitle',
              'onlineCountdownProblem', 'onlineCountdownRules', 'onlineCountdownNumber',
              'onlineCountdownHint',
          ):
              assert f'id="{element_id}"' in html
              assert f'getElementById("{element_id}")' in client

          for token in (
              'MATCH_COUNTDOWN_MS = 5 * 1000',
              'NEXT_ROUND_COUNTDOWN_MS = 3 * 1000',
              'ROUND_RESULT_AUTO_ADVANCE_MS = 10 * 1000',
              'room.status = "countdown"',
              'nextRoundAt',
              'readyForNext',
              'scheduleRoundResultAutoAdvance',
          ):
              assert token in server, token

          assert 'queueMicrotask(() => initializeOnline())' in client
          assert '["countdown", "playing", "round_result"]' in client
          assert 'あと ${(remainingMs / 1000).toFixed(1)}秒で自動的に次へ進みます' in client
          assert '今回の数字' in html
          print('online flow verification passed')
          PY

      - name: Remove staging helpers and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/ten-freely-online-patch
          rm -f .github/workflows/ten-freely-online-export.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: synchronize online match countdowns and round transitions'
          git push origin HEAD:fix/ten-freely-online-flow
