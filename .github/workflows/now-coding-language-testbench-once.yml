name: now-coding-language-testbench-once

on:
  push:
    branches:
      - feat/now-coding-language-testbench-tutorials
    paths:
      - "tools/now-coding/patch-language-testbench.mjs"
      - ".github/workflows/now-coding-language-testbench-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/now-coding-language-testbench-tutorials
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preserve generated client template expressions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/now-coding/patch-language-testbench.mjs')
          s=p.read_text()
          for token in [
            '${c.npc?', '${c.spawnMode', '${MODE_LABELS[c.mode]}',
            '${content[0]}', '${content[1]}', '${title}', '${text}',
            '${testNpcLabel(c.npcType)}', '${reason}', '${game.tick}'
          ]:
            s=s.replace(token, '\\'+token)
          p.write_text(s)
          PY
      - name: Apply language and testbench patch
        run: node tools/now-coding/patch-language-testbench.mjs
      - name: Fix generated client contract blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/now-coding/client-contract.test.mjs')
          s=p.read_text()
          marker='\ntest("language palette exposes nested boolean and numeric reporters"'
          s=s.split(marker)[0]
          s += r'''

test("language palette exposes nested boolean and numeric reporters", () => {
  for (const key of ["cell","compare","logic","not","enemyDistance","number","var","random","math"]) {
    assert.ok(html.includes(`data-expression-preset="${key}"`));
  }
  assert.match(app, /最も近い敵との距離/);
  assert.match(app, /literalLabel/);
  assert.match(app, /application\/x-now-expression/);
});

test("test bench exposes modes optional NPC archetypes and fixed spawn", () => {
  for (const mode of ["territory","fall","cobra","splat"]) assert.ok(html.includes(`data-test-mode="${mode}"`));
  for (const type of ["straight","wall","explore","evade","chase","random","beginner","intermediate","advanced"]) assert.ok(html.includes(`value="${type}"`));
  assert.match(app, /allowSolo/);
  assert.match(app, /makeTestNpcProgram/);
  assert.match(app, /testSpawnMode/);
});
'''
          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check public/now-coding/app-v3.js
          node --check public/now-coding/engine.js
          node --check public/now-coding/modes.js
          node --check public/now-coding/tutorials.js
          node --test tools/now-coding/engine.test.mjs tools/now-coding/client-contract.test.mjs
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/now-coding/app-v3.js public/now-coding/index.html public/now-coding/engine.js public/now-coding/modes.js public/now-coding/tutorials.js public/now-coding/style-v5.css tools/now-coding/client-contract.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "feat(now-coding): expand language and testbench"
          git push origin HEAD:feat/now-coding-language-testbench-tutorials
