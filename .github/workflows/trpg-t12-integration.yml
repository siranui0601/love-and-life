name: Temporary T12 integration and validation
on:
  push:
    branches:
      - agent/trpg-human-authored-choices
    paths:
      - ".github/workflows/trpg-t12-integration.yml"
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/trpg-human-authored-choices
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconstruct verified T12 sources and patch
        shell: bash
        run: |
          mkdir -p src/server/trpg/content/authored/missions /tmp/trpg-t12
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          assets = [
              (
                  '.github/t12-assets/pack.b64',
                  'cc21b2bf7a188df94e6700251c606c748545c11576aec76d0bc956bda8370633',
                  '463c4e950e3ad8890c7c445f9241ad3df6ef1e2141ee6ec4f4ad9115e0b39f8d',
                  'src/server/trpg/content/authored/missions/t12-northern-fortress-false-flag.js',
              ),
              (
                  '.github/t12-assets/patch.b64',
                  'f9952d4dd32a6768c252a41f20014b3c5a9dce356323ec218b555f3f8ed15164',
                  '80865e9415259a50e3e401c7b49f5d34f7a4ab357128ea16d10500a2bf214a11',
                  '/tmp/trpg-t12/patch_t12.py',
              ),
          ]
          for source, encoded_sha, decoded_sha, target in assets:
              encoded = Path(source).read_text().strip()
              assert hashlib.sha256(encoded.encode('ascii')).hexdigest() == encoded_sha
              data = gzip.decompress(base64.b64decode(encoded, validate=True))
              assert hashlib.sha256(data).hexdigest() == decoded_sha
              Path(target).write_bytes(data)
          pack = Path('src/server/trpg/content/authored/missions/t12-northern-fortress-false-flag.js').read_text('utf-8')
          assert 'title: "北陵要塞の偽装襲撃"' in pack
          assert 'minimumRouteShapesBeforePriorState: 262440' in pack
          assert 'persistentBranchSignature: true' in pack
          PY
          python /tmp/trpg-t12/patch_t12.py
      - run: npm ci
      - name: Focused T12 contracts
        shell: bash
        run: |
          test "$(sha256sum src/server/trpg/content/authored/missions/t12-northern-fortress-false-flag.js | cut -d' ' -f1)" = "463c4e950e3ad8890c7c445f9241ad3df6ef1e2141ee6ec4f4ad9115e0b39f8d"
          grep -F 'AUTHORED_MISSION_FLOW_VERSION = "authored-mission-flow-v12"' src/server/trpg/content/authored-mission-flow-registry.js
          grep -F 'AUTHORED_CONTENT_VERSION = "authored-content-v18"' src/server/trpg/content/authored-scene-registry.js
          grep -F 'minimumRouteShapesBeforePriorState: 262440' src/server/trpg/content/authored/missions/t12-northern-fortress-false-flag.js
          grep -F 'ENC-0056' src/server/trpg/content/authored/missions/t12-northern-fortress-false-flag.js
          node --check src/server/trpg/content/authored/missions/t12-northern-fortress-false-flag.js
          node --check src/server/trpg/content/authored-mission-flow-registry.js
          node --check src/server/trpg/content/authored-scene-registry.js
          node --check tools/trpg-sim/test/authored-mission-aftermath.test.mjs
          node --check tools/trpg-sim/test/mission-step-timeline.test.mjs
          node --test tools/trpg-sim/test/mission-step-timeline.test.mjs
          node --test tools/trpg-sim/test/authored-mission-aftermath.test.mjs
          node --test tools/trpg-sim/test/authored-mission-aftermath-isolation.test.mjs
          git diff --check
      - name: Full TRPG regression
        run: npm run trpg:test
      - name: Strict integrated player and GOAP journeys
        env:
          TRPG_PLAYER_V4_SEEDS: 2
          TRPG_GOAP_V4_SEEDS: 2
        run: node tools/trpg-sim/cli-player-v4.mjs --strict
      - name: Publish clean implementation
        shell: bash
        run: |
          test "$(sha256sum src/server/trpg/content/authored/missions/t12-northern-fortress-false-flag.js | cut -d' ' -f1)" = "463c4e950e3ad8890c7c445f9241ad3df6ef1e2141ee6ec4f4ad9115e0b39f8d"
          git checkout HEAD -- public/TRPG/player-simulation-report.json tools/trpg-sim/reports/player-latest.md || true
          rm -f public/TRPG/player-simulation-v4-report.json \
            tools/trpg-sim/reports/player-latest.json \
            tools/trpg-sim/reports/player-v4-latest.json \
            tools/trpg-sim/reports/player-v4-latest.md
          rm -rf .github/t12-assets .github/workflows/trpg-t12-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "TRPG: T12北陵要塞の偽装襲撃を多層分岐で実装"
          test "$(git show HEAD:src/server/trpg/content/authored/missions/t12-northern-fortress-false-flag.js | sha256sum | cut -d' ' -f1)" = "463c4e950e3ad8890c7c445f9241ad3df6ef1e2141ee6ec4f4ad9115e0b39f8d"
          git push origin HEAD:agent/trpg-human-authored-choices
