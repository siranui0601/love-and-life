name: TRPG T12 integration verification

on:
  push:
    branches:
      - agent/trpg-human-authored-choices
    paths:
      - "src/server/trpg/**"
      - "tools/trpg-sim/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/trpg-t12-integration.yml"

jobs:
  verify-t12:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TRPG_GEMINI_NARRATIVE_ENABLED: "false"
      TRPG_GEMINI_ASSET_GENERATION_ENABLED: "false"
      TRPG_PLAYER_V4_SEEDS: 2
      TRPG_GOAP_V4_SEEDS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify T12 source and focused contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f src/server/trpg/content/authored/missions/t12-northern-fortress-false-flag.js
          grep -q 'minimumRouteShapesBeforePriorState: 262440' src/server/trpg/content/authored/missions/t12-northern-fortress-false-flag.js
          grep -q 'AUTHORED_MISSION_FLOW_VERSION = "authored-mission-flow-v12"' src/server/trpg/content/authored-mission-flow-registry.js
          grep -q 'AUTHORED_CONTENT_VERSION = "authored-content-v18"' src/server/trpg/content/authored-scene-registry.js
          node --test \
            tools/trpg-sim/test/authored-mission-aftermath.test.mjs \
            tools/trpg-sim/test/authored-mission-aftermath-isolation.test.mjs \
            tools/trpg-sim/test/mission-step-timeline.test.mjs
      - name: Run all TRPG tests
        run: npm run trpg:test
      - name: Run strict integrated player and GOAP journeys
        run: node tools/trpg-sim/cli-player-v4.mjs --strict
      - name: Confirm paid Gemini paths stayed disabled
        shell: bash
        run: |
          test "${TRPG_GEMINI_NARRATIVE_ENABLED}" = "false"
          test "${TRPG_GEMINI_ASSET_GENERATION_ENABLED}" = "false"
