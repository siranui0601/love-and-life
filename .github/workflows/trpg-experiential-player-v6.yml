name: TRPG experiential player simulation v6

on:
  pull_request:
    branches:
      - main
    paths:
      - "public/TRPG/**"
      - "src/server/trpg/**"
      - "tools/trpg-sim/**"
      - "package.json"
      - ".github/workflows/trpg-experiential-player-v6.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiential:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
      TRPG_SPREADSHEET_ID: 15slftR2b-76VKaUqTisYolhN1iCpHeB7asUBoyMnmRk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/trpg-director-v52-refinement
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed Director v5.2 source
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G 'tools/director-v52/chunk-*' > /dev/null; then
            cat tools/director-v52/chunk-* > /tmp/director-v52.patch.gz.b64
            echo '7520f77da0c17d8fc76227f141002eebdffb40fd6fdb32b42c300ba13c97bbb7  /tmp/director-v52.patch.gz.b64' | sha256sum -c -
            base64 -d /tmp/director-v52.patch.gz.b64 > /tmp/director-v52.patch.gz
            echo '58f54581c3be7b8ac96efa6a34ed425249d4fdddb03c1138bfe5605b11ffdcf5  /tmp/director-v52.patch.gz' | sha256sum -c -
            gzip -dc /tmp/director-v52.patch.gz > /tmp/director-v52.patch
            echo 'a0c4ad21f8a85747b59cbb1c40e354f439a34ec39f4dd2e09a90949064aafa95  /tmp/director-v52.patch' | sha256sum -c -
            git apply --check /tmp/director-v52.patch
            git apply /tmp/director-v52.patch
            rm -rf tools/director-v52
            rm -f tools/trpg-director-v52.patch.gz.b64 .github/workflows/apply-director-v52.yml
          fi
      - run: npm ci
      - name: Run TRPG regression tests
        shell: bash
        run: |
          mkdir -p tools/trpg-sim/reports
          set -o pipefail
          npm run trpg:test 2>&1 | tee tools/trpg-sim/reports/experiential-regression.log
      - name: Commit finalized source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "Source already finalized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "feat(trpg): refine director context and partial recovery"
            git push origin HEAD:chatgpt/trpg-director-v52-refinement
          fi
      - name: Run rescue, work-first, and capital-first journeys
        run: npm run trpg:experiential:v6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trpg-experiential-player-v6
          path: |
            tools/trpg-sim/reports/experiential-regression.log
            tools/trpg-sim/reports/experiential-player-v6-latest.json
            tools/trpg-sim/reports/experiential-player-v6-latest.md
            tools/trpg-sim/reports/experiential-v6-*-narrative-audit.jsonl
          if-no-files-found: warn
          retention-days: 14
