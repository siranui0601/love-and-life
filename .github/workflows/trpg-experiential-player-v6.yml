name: Apply and verify TRPG generative world v7

on:
  pull_request:
    branches:
      - main
    paths:
      - "public/TRPG/**"
      - "src/server/trpg/**"
      - "tools/**"
      - ".github/workflows/trpg-experiential-player-v6.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/trpg-generative-actions-world-needs
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore exact main baseline and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/trpg-experiential-player-v6.yml > .github/workflows/trpg-experiential-player-v6.yml
          cat tools/trpg-world-v7/chunk-* > /tmp/trpg-world-v7.patch.gz.b64
          echo 'e66610dd5a6bdb3f1cc901eca59267448c14c13222e04814886203810f13169b  /tmp/trpg-world-v7.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/trpg-world-v7.patch.gz.b64 > /tmp/trpg-world-v7.patch.gz
          echo '18d6bfac83e158eaab42040cc73ccd7791bf8bde3fa87a7d9d2be39abcaeb1d6  /tmp/trpg-world-v7.patch.gz' | sha256sum -c -
          gzip -dc /tmp/trpg-world-v7.patch.gz > /tmp/trpg-world-v7.patch
          echo 'e75ba575ef4a6ab29e720fd775b6044795b3964ef3910a07773383f8985987f3  /tmp/trpg-world-v7.patch' | sha256sum -c -
          git apply --check /tmp/trpg-world-v7.patch
          git apply /tmp/trpg-world-v7.patch
          rm -rf tools/trpg-world-v7
          rm -f tools/trpg-world-v7.patch.gz.b64 .github/workflows/apply-trpg-world-v7.yml
      - run: npm ci
      - name: Run full TRPG regression suite
        run: npm run trpg:test
      - name: Commit normal source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(trpg): generate actions and add living world needs"
          git push origin HEAD:chatgpt/trpg-generative-actions-world-needs
