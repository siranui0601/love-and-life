name: TRPG experiential player simulation v6

on:
  pull_request:
    branches:
      - main
    paths:
      - "public/TRPG/**"
      - "src/server/trpg/**"
      - "tools/trpg-sim/**"
      - "package.json"
      - ".github/workflows/trpg-experiential-player-v6.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiential:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
      TRPG_SPREADSHEET_ID: 15slftR2b-76VKaUqTisYolhN1iCpHeB7asUBoyMnmRk
    steps:
      - uses: actions/checkout@v4
      - name: Prepare experiential mission contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          service = Path("src/server/trpg/game/service.js")
          source = service.read_text()
          before = '''export function applyGameplayCatalogOverrides(catalog) {
            const t01 = catalog.special.find((mission) => mission.id === "MSN-T01");
            if (!t01) return catalog;
            for (const step of t01.steps) {
          '''
          after = '''export function applyGameplayCatalogOverrides(catalog) {
            const t01 = catalog.special.find((mission) => mission.id === "MSN-T01");
            if (!t01) return catalog;
            if (!t01.steps.some((step) => step.id === "escort")) {
              const decideIndex = t01.steps.findIndex((step) => step.id === "decide");
              const escortStep = {
                id: "escort",
                type: "conversation",
                targetLocation: "田園の村",
                targetFacilityId: "LOC_FARM_EDGE",
                required: 1,
                label: "負傷したフィンに声をかけ、村の広場まで同行する",
              };
              if (decideIndex >= 0) t01.steps.splice(decideIndex, 0, escortStep);
              else t01.steps.push(escortStep);
            }
            for (const step of t01.steps) {
          '''
          if before not in source:
              raise SystemExit("T01 catalog insertion point was not found")
          service.write_text(source.replace(before, after, 1))

          contract = Path("src/server/trpg/narrative-contract.js")
          source = contract.read_text()
          old = 'export const TRPG_NARRATIVE_PROMPT_VERSION = "trpg-narrative-v4.9";'
          new = 'export const TRPG_NARRATIVE_PROMPT_VERSION = "trpg-narrative-v5.0-experiential";'
          if old not in source:
              raise SystemExit("narrative prompt version insertion point was not found")
          contract.write_text(source.replace(old, new, 1))
          PY
          rm -f src/server/trpg/game/service.js.orig
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run TRPG regression tests
        run: npm run trpg:test
      - name: Run rescue, work-first, and capital-first journeys
        run: npm run trpg:experiential:v6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trpg-experiential-player-v6
          path: |
            tools/trpg-sim/reports/experiential-player-v6-latest.json
            tools/trpg-sim/reports/experiential-player-v6-latest.md
            tools/trpg-sim/reports/experiential-v6-*-narrative-audit.jsonl
          if-no-files-found: warn
          retention-days: 14
