name: Apply and verify TRPG world actions

on:
  push:
    branches:
      - chatgpt/trpg-world-actions-survival-weather
    paths:
      - ".github/workflows/trpg-experiential-player-v6.yml"
      - "tools/world-actions/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
      TRPG_SPREADSHEET_ID: 15slftR2b-76VKaUqTisYolhN1iCpHeB7asUBoyMnmRk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/trpg-world-actions-survival-weather
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed world-actions source
        shell: bash
        run: |
          set -euo pipefail
          cat tools/world-actions/chunk-* > /tmp/world-actions-source.patch.gz.b64
          echo '97f5284658e8a520106463236e8997f25ff9c81c896e916fd11e10ba405b7c81  /tmp/world-actions-source.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/world-actions-source.patch.gz.b64 > /tmp/world-actions-source.patch.gz
          echo '63c028f8f478b01bcb036c157882b07f069816cff8f55b598fbbed0d64d03305  /tmp/world-actions-source.patch.gz' | sha256sum -c -
          gzip -dc /tmp/world-actions-source.patch.gz > /tmp/world-actions-source.patch
          echo '20904391054f48a2b94122b9be27eafbff2c430750b9733ecdd5c277c823628c  /tmp/world-actions-source.patch' | sha256sum -c -
          git apply --check /tmp/world-actions-source.patch
          git apply /tmp/world-actions-source.patch
          rm -rf tools/world-actions
          cat > .github/workflows/trpg-experiential-player-v6.yml <<'YAML'
          name: TRPG experiential player simulation v6

          on:
            pull_request:
              branches:
                - main
              paths:
                - "public/TRPG/**"
                - "src/server/trpg/**"
                - "tools/trpg-sim/**"
                - "package.json"
                - ".github/workflows/trpg-experiential-player-v6.yml"
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            experiential:
              runs-on: ubuntu-latest
              timeout-minutes: 90
              env:
                GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
                TRPG_SPREADSHEET_ID: 15slftR2b-76VKaUqTisYolhN1iCpHeB7asUBoyMnmRk
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 1
                    show-progress: false
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                - run: npm ci
                - name: Run TRPG regression tests
                  shell: bash
                  run: |
                    mkdir -p tools/trpg-sim/reports
                    set -o pipefail
                    npm run trpg:test 2>&1 | tee tools/trpg-sim/reports/experiential-regression.log
                - name: Run real Gemini player journeys
                  run: npm run trpg:experiential:v6
                - uses: actions/upload-artifact@v4
                  if: always()
                  with:
                    name: trpg-experiential-player-v6
                    path: |
                      tools/trpg-sim/reports/experiential-regression.log
                      tools/trpg-sim/reports/experiential-player-v6-latest.json
                      tools/trpg-sim/reports/experiential-player-v6-latest.md
                      tools/trpg-sim/reports/experiential-v6-*-narrative-audit.jsonl
                    if-no-files-found: warn
                    retention-days: 14
          YAML
      - run: npm ci
      - name: Run all TRPG regression tests
        shell: bash
        run: |
          mkdir -p tools/trpg-sim/reports
          set -o pipefail
          npm run trpg:test 2>&1 | tee tools/trpg-sim/reports/experiential-regression.log
      - name: Commit normal source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(trpg): integrate generated world actions survival and weather"
          git push origin HEAD:chatgpt/trpg-world-actions-survival-weather
      - name: Run real Gemini player journeys
        run: npm run trpg:experiential:v6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trpg-world-actions-first-run
          path: |
            tools/trpg-sim/reports/experiential-regression.log
            tools/trpg-sim/reports/experiential-player-v6-latest.json
            tools/trpg-sim/reports/experiential-player-v6-latest.md
            tools/trpg-sim/reports/experiential-v6-*-narrative-audit.jsonl
          if-no-files-found: warn
          retention-days: 14
