name: TRPG experiential player simulation v6

on:
  pull_request:
    branches:
      - main
    paths:
      - "public/TRPG/**"
      - "src/server/trpg/**"
      - "tools/trpg-sim/**"
      - "package.json"
      - ".github/workflows/trpg-experiential-player-v6.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiential:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
      TRPG_SPREADSHEET_ID: 15slftR2b-76VKaUqTisYolhN1iCpHeB7asUBoyMnmRk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/trpg-director-v52-refinement
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed Director v5.2 source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tools/trpg-director-v52.patch.gz.b64 ]; then
            base64 -d tools/trpg-director-v52.patch.gz.b64 > /tmp/director-v52.patch.gz
            gzip -dc /tmp/director-v52.patch.gz > /tmp/director-v52.patch
            git apply --check /tmp/director-v52.patch
            git apply /tmp/director-v52.patch
            rm -f tools/trpg-director-v52.patch.gz.b64 .github/workflows/apply-director-v52.yml
            cat > .github/workflows/trpg-experiential-player-v6.yml <<'YAML'
          name: TRPG experiential player simulation v6

          on:
            pull_request:
              branches:
                - main
              paths:
                - "public/TRPG/**"
                - "src/server/trpg/**"
                - "tools/trpg-sim/**"
                - "package.json"
                - ".github/workflows/trpg-experiential-player-v6.yml"
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            experiential:
              runs-on: ubuntu-latest
              timeout-minutes: 90
              env:
                GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
                TRPG_SPREADSHEET_ID: 15slftR2b-76VKaUqTisYolhN1iCpHeB7asUBoyMnmRk
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 1
                    show-progress: false
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                - run: npm ci
                - name: Run TRPG regression tests
                  shell: bash
                  run: |
                    mkdir -p tools/trpg-sim/reports
                    set -o pipefail
                    npm run trpg:test 2>&1 | tee tools/trpg-sim/reports/experiential-regression.log
                - name: Run rescue, work-first, and capital-first journeys
                  run: npm run trpg:experiential:v6
                - uses: actions/upload-artifact@v4
                  if: always()
                  with:
                    name: trpg-experiential-player-v6
                    path: |
                      tools/trpg-sim/reports/experiential-regression.log
                      tools/trpg-sim/reports/experiential-player-v6-latest.json
                      tools/trpg-sim/reports/experiential-player-v6-latest.md
                      tools/trpg-sim/reports/experiential-v6-*-narrative-audit.jsonl
                    if-no-files-found: warn
                    retention-days: 14
          YAML
          fi
      - run: npm ci
      - name: Run TRPG regression tests
        shell: bash
        run: |
          mkdir -p tools/trpg-sim/reports
          set -o pipefail
          npm run trpg:test 2>&1 | tee tools/trpg-sim/reports/experiential-regression.log
      - name: Commit finalized source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "Source already finalized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "feat(trpg): refine director context and partial recovery"
            git push origin HEAD:chatgpt/trpg-director-v52-refinement
          fi
      - name: Run rescue, work-first, and capital-first journeys
        run: npm run trpg:experiential:v6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trpg-experiential-player-v6
          path: |
            tools/trpg-sim/reports/experiential-regression.log
            tools/trpg-sim/reports/experiential-player-v6-latest.json
            tools/trpg-sim/reports/experiential-player-v6-latest.md
            tools/trpg-sim/reports/experiential-v6-*-narrative-audit.jsonl
          if-no-files-found: warn
          retention-days: 14
