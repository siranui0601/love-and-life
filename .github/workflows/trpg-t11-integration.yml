name: Temporary T11 integration and validation
on:
  push:
    branches:
      - agent/trpg-human-authored-choices
    paths:
      - ".github/workflows/trpg-t11-integration.yml"
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/trpg-human-authored-choices
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconstruct verified T11 sources and patch
        shell: bash
        run: |
          mkdir -p src/server/trpg/content/authored/missions /tmp/trpg-t11
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          assets = [
              (
                  '.github/t11-assets/pack.b64',
                  'e8b7e4b4b55685141f94d56b09d03f48a46d7e1fc1103bdb45e68bd3dc668ce5',
                  '114118d7f688eb48cc5b3af16aaa6b11ffd7f6ed4b7f51f9c82fcf4abeb588b7',
                  'src/server/trpg/content/authored/missions/t11-capital-assassination-plot.js',
              ),
              (
                  '.github/t11-assets/patch.b64',
                  '4468999e926fab0bc5ee7815efe3b806e8ccadfc274b89c4d14bfc99c5134508',
                  'ce0c6986403f3b60f0ea30e35287a66f59c17db69908a6fc6453d8291e741552',
                  '/tmp/trpg-t11/patch_t11.py',
              ),
          ]
          for source, encoded_sha, decoded_sha, target in assets:
              encoded = Path(source).read_text().strip()
              assert hashlib.sha256(encoded.encode('ascii')).hexdigest() == encoded_sha
              data = gzip.decompress(base64.b64decode(encoded, validate=True))
              assert hashlib.sha256(data).hexdigest() == decoded_sha
              Path(target).write_bytes(data)
          pack = Path('src/server/trpg/content/authored/missions/t11-capital-assassination-plot.js').read_text('utf-8')
          assert 'title: "王都の暗殺計画"' in pack
          assert 'minimumRouteShapesBeforePriorState: 5832' in pack
          assert 'persistentBranchSignature: true' in pack
          PY
          python /tmp/trpg-t11/patch_t11.py
      - run: npm ci
      - name: Focused T11 contracts
        shell: bash
        run: |
          test "$(sha256sum src/server/trpg/content/authored/missions/t11-capital-assassination-plot.js | cut -d' ' -f1)" = "114118d7f688eb48cc5b3af16aaa6b11ffd7f6ed4b7f51f9c82fcf4abeb588b7"
          grep -F 'title: "王都の暗殺計画"' src/server/trpg/content/authored/missions/t11-capital-assassination-plot.js
          grep -F 'minimumRouteShapesBeforePriorState: 5832' src/server/trpg/content/authored/missions/t11-capital-assassination-plot.js
          grep -F 'AUTHORED_MISSION_FLOW_VERSION = "authored-mission-flow-v11"' src/server/trpg/content/authored-mission-flow-registry.js
          grep -F 'AUTHORED_CONTENT_VERSION = "authored-content-v17"' src/server/trpg/content/authored-scene-registry.js
          ! grep -F 'resolveMissionStepVariant(rawStep, state.day)' tools/trpg-sim/lib/player-journey.mjs
          node --check src/server/trpg/content/authored/missions/t11-capital-assassination-plot.js
          node --check src/server/trpg/content/authored-mission-flow-registry.js
          node --check src/server/trpg/content/mission-step-variant.js
          node --check src/server/trpg/content/authored-scene-registry.js
          node --check tools/trpg-sim/lib/player-journey.mjs
          node --test tools/trpg-sim/test/mission-step-timeline.test.mjs
          node --test tools/trpg-sim/test/authored-mission-aftermath.test.mjs
          node --test tools/trpg-sim/test/authored-mission-aftermath-isolation.test.mjs
          git diff --check
      - name: Full TRPG regression
        run: npm run trpg:test
      - name: Strict integrated player and GOAP journeys
        env:
          TRPG_PLAYER_V4_SEEDS: 2
          TRPG_GOAP_V4_SEEDS: 2
        run: node tools/trpg-sim/cli-player-v4.mjs --strict
      - name: Publish clean implementation
        shell: bash
        run: |
          test "$(sha256sum src/server/trpg/content/authored/missions/t11-capital-assassination-plot.js | cut -d' ' -f1)" = "114118d7f688eb48cc5b3af16aaa6b11ffd7f6ed4b7f51f9c82fcf4abeb588b7"
          git checkout HEAD -- public/TRPG/player-simulation-report.json tools/trpg-sim/reports/player-latest.md || true
          rm -f public/TRPG/player-simulation-v4-report.json \
            tools/trpg-sim/reports/player-latest.json \
            tools/trpg-sim/reports/player-v4-latest.json \
            tools/trpg-sim/reports/player-v4-latest.md
          rm -rf .github/t11-assets .github/workflows/trpg-t11-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "TRPG: T11王都の暗殺計画を多層分岐で実装"
          test "$(git show HEAD:src/server/trpg/content/authored/missions/t11-capital-assassination-plot.js | sha256sum | cut -d' ' -f1)" = "114118d7f688eb48cc5b3af16aaa6b11ffd7f6ed4b7f51f9c82fcf4abeb588b7"
          git push origin HEAD:agent/trpg-human-authored-choices
