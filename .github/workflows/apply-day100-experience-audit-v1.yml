name: Apply TRPG Day100 experience audit v1

on:
  push:
    branches:
      - chatgpt/trpg-authored-content-refactor
    paths:
      - ".github/workflows/apply-day100-experience-audit-v1.yml"
      - "tools/trpg-refactor/apply-day100-experience-audit-v1.mjs"

concurrency:
  group: trpg-day100-experience-audit-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/trpg-authored-content-refactor
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply strict Day100 simulation contract
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/trpg-refactor/apply-day100-experience-audit-v1.mjs")
          source = path.read_text(encoding="utf-8")
          replacements = {
              '&& /battle|戦|討伐|護衛/u.test(`${mission.currentStep?.type ?? ""} ${mission.currentStep?.label ?? ""}`));':
                  '&& /battle|戦|討伐|護衛/u.test(String(mission.currentStep?.type ?? "") + " " + String(mission.currentStep?.label ?? "")));',
              r'key: \`${type}:\${identity}\`,': 'key: String(type) + ":" + String(identity),',
              r'actionId: \`${type}:\${identity}\`,': 'actionId: String(type) + ":" + String(identity),',
          }
          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"normalization anchor count {count}: {old}")
              source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")
          PY
          node tools/trpg-refactor/apply-day100-experience-audit-v1.mjs > tools/trpg-day100-experience-integration.log 2>&1
          status=$?
          cat tools/trpg-day100-experience-integration.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/trpg-day100-experience-integration.log
            git commit -m "test(trpg): record Day100 experience integration failure"
            git push origin HEAD:chatgpt/trpg-authored-content-refactor
            exit "$status"
          fi
          git diff --check
      - run: npm ci
      - name: Run complete TRPG regression suite
        shell: bash
        run: |
          set +e
          npm run trpg:test > tools/trpg-day100-experience-regression.log 2>&1
          status=$?
          cat tools/trpg-day100-experience-regression.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/trpg-day100-experience-regression.log
            git commit -m "test(trpg): record Day100 experience-audit failure"
            git push origin HEAD:chatgpt/trpg-authored-content-refactor
            exit "$status"
          fi
      - name: Commit verified modular simulation
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/trpg-day100-experience-integration.log tools/trpg-day100-experience-regression.log
          rm -f .github/workflows/apply-day100-experience-audit-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(trpg): audit Day100 conversation skills and weapon breadth"
          git push origin HEAD:chatgpt/trpg-authored-content-refactor
