name: now-coding-editor-placement-ux-once

on:
  push:
    branches:
      - feat/now-coding-editor-placement-ux
    paths:
      - ".github/workflows/now-coding-editor-placement-ux-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/now-coding-editor-placement-ux
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply editor placement UX
        run: |
          python tools/now-coding/patch-editor-placement-ux.py
          python tools/now-coding/patch-editor-placement-contracts.py
      - name: Syntax check
        run: node --check public/now-coding/app-v3.js
      - name: Focused tests
        run: node --test tools/now-coding/engine.test.mjs tools/now-coding/client-contract.test.mjs
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/now-coding/app-v3.js public/now-coding/style-v7.css tools/now-coding/client-contract.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "feat(now-coding): improve nested block editing UX"
          git push origin HEAD:feat/now-coding-editor-placement-ux
