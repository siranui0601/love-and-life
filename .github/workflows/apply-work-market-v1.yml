name: Apply TRPG bounded work market v1

on:
  push:
    branches:
      - chatgpt/trpg-authored-content-refactor

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/trpg-authored-content-refactor
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply bounded work-market integration
        shell: bash
        run: |
          set +e
          node tools/trpg-refactor/apply-work-market-v1.mjs > tools/trpg-work-market-integration.log 2>&1
          status=$?
          cat tools/trpg-work-market-integration.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/trpg-work-market-integration.log
            git commit -m "test(trpg): record work-market integration failure"
            git push origin HEAD:chatgpt/trpg-authored-content-refactor
            exit "$status"
          fi
      - run: npm ci
      - name: Run complete TRPG regression suite
        shell: bash
        run: |
          set +e
          npm run trpg:test > tools/trpg-work-market-regression.log 2>&1
          status=$?
          cat tools/trpg-work-market-regression.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/trpg-work-market-regression.log
            git commit -m "test(trpg): record work-market regression failure"
            git push origin HEAD:chatgpt/trpg-authored-content-refactor
            exit "$status"
          fi
      - name: Commit integrated source
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/trpg-work-market-integration.log tools/trpg-work-market-regression.log
          rm -f .github/workflows/apply-work-market-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(trpg): bound ordinary work by hours and daily supply"
          git push origin HEAD:chatgpt/trpg-authored-content-refactor
