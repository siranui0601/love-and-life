name: Export current Ten Freely sources

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'fix/ten-freely-ux-polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: ten-freely-current-sources
          path: |
            public/10を自由に
            src/10を自由に
          retention-days: 1
