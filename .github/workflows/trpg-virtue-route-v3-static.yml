name: trpg-virtue-route-v3-static

on:
  pull_request:
    paths:
      - ".github/workflows/trpg-virtue-route-v3-static.yml"
  workflow_dispatch:

jobs:
  static-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch callback workspace only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/trpg-sim/test/checkpoint-f-callback-save-restore.test.mjs')
          text = path.read_text()
          needle = "      || entry.actionId?.startsWith('OBSERVE:')\n      || entry.actionId === 'TUTORIAL:PAUSE:PLAN')"
          replacement = "      || entry.actionId?.startsWith('OBSERVE:')\n      || entry.actionId?.startsWith('REST_OUTDOOR:')\n      || entry.actionId === 'TUTORIAL:PAUSE:PLAN')"
          if needle not in text:
              raise SystemExit('callback REST_OUTDOOR patch target missing')
          path.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Run focused F callback certificate
        run: |
          set -o pipefail
          node --test tools/trpg-sim/test/checkpoint-f-callback-save-restore.test.mjs 2>&1 | tee f-callback-focused.log
      - name: Upload focused callback log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-callback-focused-${{ github.sha }}
          if-no-files-found: error
          path: f-callback-focused.log
