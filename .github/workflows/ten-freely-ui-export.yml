name: Ten Freely UI export

on:
  push:
    branches:
      - feature/ten-freely-foundation

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: ten-freely-ui-source
          path: |
            public/10を自由に
            src/10を自由に/online.js
          if-no-files-found: error
          retention-days: 1
