name: now-coding-territory-no-moves-once

on:
  push:
    branches:
      - feat/now-coding-language-testbench-tutorials
    paths:
      - "tools/now-coding/patch-territory-no-moves.mjs"
      - ".github/workflows/now-coding-territory-no-moves-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/now-coding-language-testbench-tutorials
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply no-moves rule
        run: node tools/now-coding/patch-territory-no-moves.mjs
      - name: Validate
        run: |
          node --check public/now-coding/engine.js
          node --test tools/now-coding/engine.test.mjs tools/now-coding/client-contract.test.mjs
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/now-coding/engine.js tools/now-coding/engine.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "feat(now-coding): end territory when all pieces are boxed in"
          git push origin HEAD:feat/now-coding-language-testbench-tutorials
