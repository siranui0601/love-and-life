name: Temporary T07 UTF-8 repair and validation
on:
  pull_request:
    paths:
      - ".github/workflows/trpg-t07-encoding-audit.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/trpg-human-authored-choices
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconstruct and verify exact UTF-8 source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          parts = [Path(f'.github/t07-fix/source.{index:02d}.b64').read_text() for index in range(1, 5)]
          encoded = ''.join(parts)
          assert hashlib.sha256(encoded.encode('ascii')).hexdigest() == '4654a656b5de50e938bbf7fececcceb26ef2420a9f3a776bd7bb2eb806d03a3c'
          data = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(data).hexdigest() == '729f65012289fcfd9da49ad49a6f6bf3b908cfcf7eb7f339b5f137cc5c339297'
          text = data.decode('utf-8')
          assert '家出エルフの人身売買ルート' in text
          assert '螳ｶ蜃ｺ' not in text
          target = Path('src/server/trpg/content/authored/missions/t07-runaway-elf-trafficking.js')
          target.write_bytes(data)
          print('reconstructed_sha256=', hashlib.sha256(target.read_bytes()).hexdigest())
          print('title_line=', next(line for line in text.splitlines() if 'title:' in line))
          PY
      - run: npm ci
      - name: Validate repaired source and contracts
        shell: bash
        run: |
          test "$(sha256sum src/server/trpg/content/authored/missions/t07-runaway-elf-trafficking.js | cut -d' ' -f1)" = "729f65012289fcfd9da49ad49a6f6bf3b908cfcf7eb7f339b5f137cc5c339297"
          grep -F 'title: "家出エルフの人身売買ルート"' src/server/trpg/content/authored/missions/t07-runaway-elf-trafficking.js
          node --check src/server/trpg/content/authored/missions/t07-runaway-elf-trafficking.js
          node --test tools/trpg-sim/test/mission-step-timeline.test.mjs
          node --test tools/trpg-sim/test/authored-mission-aftermath.test.mjs
          node --test tools/trpg-sim/test/authored-mission-aftermath-isolation.test.mjs
          git diff --check
      - name: Full TRPG regression
        run: npm run trpg:test
      - name: Strict integrated player and GOAP journeys
        env:
          TRPG_PLAYER_V4_SEEDS: 2
          TRPG_GOAP_V4_SEEDS: 2
        run: node tools/trpg-sim/cli-player-v4.mjs --strict
      - name: Publish verified UTF-8 repair
        shell: bash
        run: |
          test "$(sha256sum src/server/trpg/content/authored/missions/t07-runaway-elf-trafficking.js | cut -d' ' -f1)" = "729f65012289fcfd9da49ad49a6f6bf3b908cfcf7eb7f339b5f137cc5c339297"
          git checkout HEAD -- public/TRPG/player-simulation-report.json tools/trpg-sim/reports/player-latest.md || true
          rm -f public/TRPG/player-simulation-v4-report.json \
            tools/trpg-sim/reports/player-latest.json \
            tools/trpg-sim/reports/player-v4-latest.json \
            tools/trpg-sim/reports/player-v4-latest.md
          rm -rf .github/t07-fix .github/workflows/trpg-t07-encoding-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/trpg/content/authored/missions/t07-runaway-elf-trafficking.js
          git add -A .github/t07-fix .github/workflows/trpg-t07-encoding-audit.yml
          git commit -m "fix: restore T07 authored content UTF-8"
          test "$(git show HEAD:src/server/trpg/content/authored/missions/t07-runaway-elf-trafficking.js | sha256sum | cut -d' ' -f1)" = "729f65012289fcfd9da49ad49a6f6bf3b908cfcf7eb7f339b5f137cc5c339297"
          git push origin HEAD:agent/trpg-human-authored-choices
