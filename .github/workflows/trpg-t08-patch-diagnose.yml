name: Temporary T08 patch diagnosis
on:
  pull_request:
    paths:
      - ".github/workflows/trpg-t08-patch-diagnose.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/trpg-human-authored-choices
          fetch-depth: 0
      - name: Diagnose reconstruction and patch
        shell: bash
        run: |
          mkdir -p src/server/trpg/content/authored/missions /tmp/trpg-t08
          python - <<'PY' > .github/t08-assets/patch-diagnose.log 2>&1
          from pathlib import Path
          import base64, gzip, hashlib
          for name, pattern, target in [
              ('pack', '.github/t08-assets/pack.*.b64', 'src/server/trpg/content/authored/missions/t08-forest-sealing-order.js'),
              ('patch', '.github/t08-assets/patch.01.b64', '/tmp/trpg-t08/patch_t08.py'),
          ]:
              parts = sorted(Path('.').glob(pattern))
              encoded = ''.join(part.read_text() for part in parts)
              raw = gzip.decompress(base64.b64decode(encoded, validate=True))
              Path(target).write_bytes(raw)
              print(name, 'parts=', [str(part) for part in parts])
              print(name, 'encoded_sha=', hashlib.sha256(encoded.encode()).hexdigest())
              print(name, 'raw_sha=', hashlib.sha256(raw).hexdigest())
          PY
          set +e
          python /tmp/trpg-t08/patch_t08.py >> .github/t08-assets/patch-diagnose.log 2>&1
          status=$?
          set -e
          echo "patch_status=$status" >> .github/t08-assets/patch-diagnose.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/t08-assets/patch-diagnose.log
          git commit -m "chore: record T08 patch diagnosis"
          git push origin HEAD:agent/trpg-human-authored-choices
          cat .github/t08-assets/patch-diagnose.log
