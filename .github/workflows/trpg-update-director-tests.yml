name: TRPG update director tests

on:
  push:
    branches:
      - chatgpt/trpg-experiential-simulation-v6
    paths:
      - .github/workflows/trpg-update-director-tests.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/trpg-experiential-simulation-v6
          fetch-depth: 1
          show-progress: false
      - name: Update service regression expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/trpg-sim/test/game-service.test.mjs')
          s = p.read_text()
          old = '''  assert.equal(battleNarrativeInput, undefined, "the decisive battle tap must not wait for live narrative generation");
            assert.equal(battleRecord.presentation.source, "deterministic_fallback");'''
          new = '''  assert.ok(battleNarrativeInput, "the decisive result now receives a scene-specific Gemini aftermath request");
            assert.equal(battleNarrativeInput.action.dialogueTopic, "t01_rescue_aftermath");
            assert.equal(battleNarrativeInput.action.targetNpcId, "NPC001");
            assert.equal(battleRecord.presentation.source, "test");'''
          if old not in s:
              raise SystemExit('battle expectation block not found')
          s = s.replace(old, new, 1)
          s = s.replace('choices: input.authoritativeState.allowedActionCandidates.map((choice) => ({', 'choices: input.authoritativeState.availableActionCandidates.slice(0, 3).map((choice) => ({', 1)
          s = s.replace('assert.equal(record.presentation.source, "deterministic_disclosure_guard");', 'assert.equal(record.presentation.source, "mock_gemini");\n  assert.ok(record.presentation.speeches.some((speech) => /肝心の具体的な事実/u.test(speech.text)));', 1)
          p.write_text(s)
          PY
          rm -f tools/v51-test-battle.patch .github/workflows/trpg-update-director-tests.yml
      - name: Commit test updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(trpg): align service expectations with director v5.1'
          git push origin HEAD:chatgpt/trpg-experiential-simulation-v6
