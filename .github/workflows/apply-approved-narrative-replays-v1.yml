name: Apply approved TRPG narrative replays v1

on:
  push:
    branches:
      - chatgpt/trpg-authored-content-refactor
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: trpg-approved-narrative-replays-v1
  cancel-in-progress: true

jobs:
  integrate:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'chatgpt/trpg-authored-content-refactor'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/trpg-authored-content-refactor
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply approved replay integration
        shell: bash
        run: |
          set -euo pipefail
          node tools/trpg-refactor/apply-approved-narrative-replays-v1.mjs
      - run: npm ci
      - name: Run complete TRPG regression suite
        shell: bash
        run: |
          set +e
          npm run trpg:test > tools/trpg-approved-replay-regression.log 2>&1
          status=$?
          cat tools/trpg-approved-replay-regression.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/trpg-approved-replay-regression.log
            git commit -m "test(trpg): record approved replay regression failure"
            git push origin HEAD:chatgpt/trpg-authored-content-refactor
            exit "$status"
          fi
      - name: Commit integrated source
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/trpg-approved-replay-regression.log
          rm -f .github/workflows/apply-approved-narrative-replays-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(trpg): prioritize approved narrative replays"
          git push origin HEAD:chatgpt/trpg-authored-content-refactor
