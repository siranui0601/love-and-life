name: now-coding

on:
  pull_request:
    paths:
      - "public/index.html"
      - "public/now-coding/**"
      - "public/nail-shogi/**"
      - "src/server/now-coding/**"
      - "src/server/nail-shogi/**"
      - "src/server/shared/index.js"
      - "test/nail-shogi-engine.mjs"
      - "tools/now-coding/**"
      - ".github/workflows/now-coding.yml"
  workflow_dispatch:

jobs:
  focused-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          node --check public/now-coding/vm.js
          node --check public/now-coding/boards.js
          node --check public/now-coding/engine.js
          node --check public/now-coding/modes.js
          node --check public/now-coding/app.js
          node --check public/now-coding/app-v3.js
          node --check public/now-coding/tutorials.js
          node --check public/now-coding/tutorial-recovery.js
          node --check src/server/now-coding/store.js
          node --check src/server/now-coding/online.js
          node --check src/server/now-coding/index.js
          node --check public/nail-shogi/engine.js
          node --check public/nail-shogi/view.js
          node --check public/nail-shogi/fx.js
          node --check public/nail-shogi/app.js
          node --check public/nail-shogi/ux-v2.js
          node --check public/nail-shogi/online.js
          node --check src/server/nail-shogi/index.js
          node --check src/server/shared/index.js
      - name: Engine, VM and client contract tests
        run: |
          node --test tools/now-coding/engine.test.mjs tools/now-coding/client-contract.test.mjs tools/now-coding/board-spawn.test.mjs tools/now-coding/fall-timed-collapse.test.mjs tools/now-coding/tutorial-recovery.test.mjs
          node --test test/nail-shogi-engine.mjs
      - name: Entry and UX contract smoke checks
        run: |
          grep -q 'data-game="now-coding"' public/index.html
          grep -q 'afterAuthRedirect.*now-coding' public/index.html
          grep -q 'data-go="home"' public/now-coding/index.html
          grep -q 'data-go="editor"' public/now-coding/index.html
          grep -q 'data-go="battle"' public/now-coding/index.html
          grep -q 'id="editAfterResultButton"' public/now-coding/index.html
          grep -q 'data-add-block="turn"' public/now-coding/index.html
          grep -q 'data-add-block="forever"' public/now-coding/index.html
          grep -q 'data-add-block="while"' public/now-coding/index.html
          grep -q 'data-add-block="break"' public/now-coding/index.html
          grep -q 'data-add-block="if"' public/now-coding/index.html
          grep -q 'id="modeRail"' public/now-coding/index.html
          grep -q 'id="onlineModeRail"' public/now-coding/index.html
          grep -q 'id="allowRoundProgramChange"' public/now-coding/index.html
          grep -q 'id="privateRoom"' public/now-coding/index.html
          grep -q 'id="fillWithNpc"' public/now-coding/index.html
          grep -q '/socket.io/socket.io.js' public/now-coding/index.html
          grep -q 'style-v3.css' public/now-coding/index.html
          grep -q 'style-v7.css' public/now-coding/index.html
          grep -q 'app-v3.js' public/now-coding/app.js
          grep -q 'enemyDistance' public/now-coding/vm.js
          grep -q 'now:round-finished' src/server/now-coding/online.js
          grep -q 'now:set-round-program' src/server/now-coding/online.js
          grep -q 'ROUND_SELECT_MS = 30_000' src/server/now-coding/online.js
          ! grep -q '90°旋回' public/now-coding/index.html
          grep -q 'id="boardSvg"' public/nail-shogi/index.html
          grep -q 'id="directionPad"' public/nail-shogi/index.html
          grep -q 'id="careGrid"' public/nail-shogi/index.html
          grep -q 'class="care-icon icon-hook"' public/nail-shogi/index.html
          grep -q 'quick-care' public/nail-shogi/ux-v2.js
          grep -q 'nail-group.is-hidden' public/nail-shogi/ux-v2.css
          grep -q 'hook-tip-body' public/nail-shogi/view.js
          grep -q 'fx-hook-claw' public/nail-shogi/fx.js
          ! grep -Eq '>[^<]*(P[0-9]|D[0-9]|P\+|D\+)[^<]*<' public/nail-shogi/index.html
