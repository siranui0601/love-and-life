name: Temporary T07 integration and validation
on:
  pull_request:
    paths:
      - ".github/workflows/trpg-t07-integration.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/trpg-human-authored-choices
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconstruct T07 sources and patch
        shell: bash
        run: |
          mkdir -p src/server/trpg/content/authored/missions tools/trpg-sim/test /tmp/trpg-t07
          cat .github/t07-assets/mission-step-variant.b64 | base64 -d > src/server/trpg/content/mission-step-variant.js
          cat .github/t07-assets/pack.*.b64 | base64 -d > src/server/trpg/content/authored/missions/t07-runaway-elf-trafficking.js
          cat .github/t07-assets/patch.*.b64 | base64 -d > /tmp/trpg-t07/patch_t07.py
          cat .github/t07-assets/mission-step-timeline-test.b64 | base64 -d > tools/trpg-sim/test/mission-step-timeline.test.mjs
          python /tmp/trpg-t07/patch_t07.py
      - run: npm ci
      - name: Focused T07 contracts
        shell: bash
        run: |
          node --check src/server/trpg/content/mission-step-variant.js
          node --check src/server/trpg/content/authored/missions/t07-runaway-elf-trafficking.js
          node --check src/server/trpg/content/authored-mission-flow-registry.js
          node --check tools/trpg-sim/lib/player-journey.mjs
          node --test tools/trpg-sim/test/mission-step-timeline.test.mjs
          node --test tools/trpg-sim/test/authored-mission-aftermath.test.mjs
          node --test tools/trpg-sim/test/authored-mission-aftermath-isolation.test.mjs
          git diff --check
      - name: Full TRPG regression
        run: npm run trpg:test
      - name: Strict integrated player and GOAP journeys
        env:
          TRPG_PLAYER_V4_SEEDS: 2
          TRPG_GOAP_V4_SEEDS: 2
        run: node tools/trpg-sim/cli-player-v4.mjs --strict
      - name: Publish clean implementation
        shell: bash
        run: |
          rm -rf .github/t07-assets .github/workflows/trpg-t07-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "TRPG: T07家出エルフ人身売買ルートを実装"
          git push origin HEAD:agent/trpg-human-authored-choices
