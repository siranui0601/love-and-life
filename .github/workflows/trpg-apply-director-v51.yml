name: TRPG apply director v5.1

on:
  push:
    branches:
      - chatgpt/trpg-experiential-simulation-v6
    paths:
      - .github/workflows/trpg-apply-director-v51.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/trpg-experiential-simulation-v6
          fetch-depth: 1
          show-progress: false
      - name: Materialize reviewed director implementation
        shell: bash
        run: |
          set -euo pipefail
          cat \
            tools/service-v51.patch.part-00 \
            tools/service-v51.patch.part-01 \
            tools/service-v51.patch.part-02 \
            tools/service-v51.patch.part-03a \
            tools/service-v51.patch.part-03b \
            tools/service-v51.patch.part-04 \
            tools/service-v51.patch.part-05 \
            tools/service-v51.patch.part-06 \
            > /tmp/service-v51.patch
          git apply --check /tmp/service-v51.patch
          git apply /tmp/service-v51.patch

          cat \
            tools/v51-source/narrative-contract.part-00 \
            tools/v51-source/narrative-contract.part-01 \
            tools/v51-source/narrative-contract.part-02a \
            tools/v51-source/narrative-contract.part-02b \
            tools/v51-source/narrative-contract.part-03 \
            tools/v51-source/narrative-contract.part-04 \
            tools/v51-source/narrative-contract.part-05 \
            tools/v51-source/narrative-contract.part-06 \
            tools/v51-source/narrative-contract.part-07 \
            tools/v51-source/narrative-contract.part-08 \
            tools/v51-source/narrative-contract.part-09 \
            > src/server/trpg/narrative-contract.js

          git apply --check tools/v51-patches/player-journey.patch
          git apply tools/v51-patches/player-journey.patch
          git apply --check tools/v51-patches/contract-tests.patch
          git apply tools/v51-patches/contract-tests.patch

          python - <<'PY'
          from pathlib import Path

          cli = Path('tools/trpg-sim/cli-experiential-player-v6.mjs')
          text = cli.read_text()
          replacements = {
              'destinationHub: move.destinationHub ?? null': 'destinationHub: move.destination ?? null',
              'entry.destinationHub === hub': 'entry.destination === hub',
              'move.destinationHub === "王都"': 'move.destination === "王都"',
              'move.destinationFacilityId && move.destinationHub !== "田園の村"': 'move.destinationFacilityId && move.destination !== "田園の村"',
              'environment.sheetsConfigured && sheetSync.ok === true && Number(sheetSync.synced ?? 0) > 0': '!environment.sheetsConfigured || (sheetSync.ok === true && Number(sheetSync.synced ?? 0) > 0)',
          }
          for before, after in replacements.items():
              if before not in text:
                  raise SystemExit(f'CLI insertion point not found: {before}')
              text = text.replace(before, after)
          cli.write_text(text)
          PY

          rm -rf \
            tools/director-v51.patch* \
            tools/service-v51.patch.part-* \
            tools/v51-source \
            tools/v51-patches \
            .github/workflows/trpg-apply-director-v51.yml
      - name: Validate syntax
        run: |
          node --check src/server/trpg/game/service.js
          node --check src/server/trpg/narrative-contract.js
          node --check src/server/trpg/gemini-narrator.js
          node --check src/server/trpg/narrative-audit.js
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(trpg): introduce Gemini scene director v5.1'
          git push origin HEAD:chatgpt/trpg-experiential-simulation-v6
