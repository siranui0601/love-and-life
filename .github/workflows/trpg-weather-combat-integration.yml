name: TRPG weather combat integration

on:
  push:
    branches:
      - agent/trpg-human-authored-choices
    paths:
      - ".github/workflows/trpg-weather-combat-integration.yml"

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/trpg-human-authored-choices
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Connect canonical weather to battle skills
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          battle_path = Path('tools/trpg-sim/lib/battle-simulator.mjs')
          text = battle_path.read_text()

          start = text.index('function inferPlayerUtility(')
          end = text.index('\n\nexport function selectPlayerAction', start)
          utility = r'''function additionalEffectBonuses(skill, state, actor, target, diagnostics) {
            const resolved = {
              active: false,
              damageMultiplier: 1,
              accuracyMod: 0,
              criticalMod: 0,
              durationBonusTurns: 0,
              initiativeMod: 0,
              labels: [],
            };
            const context = battleContext(state, actor, target);
            for (const entry of skill.additionalEffectConditions ?? []) {
              const when = entry?.when ?? entry?.condition;
              if (!when || !evaluateStructuredConditions([when], context, diagnostics)) continue;
              const bonus = entry?.bonus ?? {};
              resolved.active = true;
              const damageMultiplier = Number(bonus.damageMultiplier ?? 1);
              if (Number.isFinite(damageMultiplier) && damageMultiplier > 0) {
                resolved.damageMultiplier *= damageMultiplier;
                if (damageMultiplier !== 1) resolved.labels.push(`威力×${damageMultiplier.toFixed(2)}`);
              }
              const accuracyMod = Number(bonus.accuracyMod ?? bonus.accuracyModifier ?? 0);
              if (Number.isFinite(accuracyMod) && accuracyMod !== 0) {
                resolved.accuracyMod += accuracyMod;
                resolved.labels.push(`命中${accuracyMod > 0 ? "+" : ""}${accuracyMod}`);
              }
              const criticalMod = Number(bonus.criticalMod ?? bonus.criticalModifier ?? 0);
              if (Number.isFinite(criticalMod) && criticalMod !== 0) {
                resolved.criticalMod += criticalMod;
                resolved.labels.push(`会心${criticalMod > 0 ? "+" : ""}${criticalMod}`);
              }
              const durationBonusTurns = Number(bonus.durationBonusTurns ?? 0);
              if (Number.isFinite(durationBonusTurns) && durationBonusTurns !== 0) {
                resolved.durationBonusTurns += durationBonusTurns;
                resolved.labels.push(`持続${durationBonusTurns > 0 ? "+" : ""}${durationBonusTurns}T`);
              }
              const initiativeMod = Number(bonus.initiativeMod ?? 0);
              if (Number.isFinite(initiativeMod) && initiativeMod !== 0) {
                resolved.initiativeMod += initiativeMod;
                resolved.labels.push(`行動順${initiativeMod > 0 ? "+" : ""}${initiativeMod}`);
              }
            }
            resolved.label = resolved.labels.length ? `環境補正：${[...new Set(resolved.labels)].join("・")}` : null;
            return resolved;
          }

          function inferPlayerUtility(skill, actor, state, target, diagnostics) {
            const enemies = state.enemies;
            const bonuses = additionalEffectBonuses(skill, state, actor, target, diagnostics);
            const damage = Number(skill.damage?.totalMultiplier || 0) * bonuses.damageMultiplier;
            const targetFactor = skill.target === 'all_enemies' ? Math.min(3, living(enemies).length) : 1;
            let utility = damage * (inferPlayerDamageType(skill) === 'magic' ? actor.magicPower : actor.physicalPower) * targetFactor;
            for (const specialState of skill.specialStates ?? []) {
              if (specialState.type === 'healHp') utility += (1 - ratio(actor, 'hp')) * actor.maxHp * 1.6;
              if (specialState.type === 'barrier' || specialState.type === 'damageReduction') utility += (1 - ratio(actor, 'hp')) * actor.maxHp * 0.6;
            }
            utility += (skill.buffs?.length ?? 0) * 8 + (skill.debuffs?.length ?? 0) * 10;
            utility -= Number(skill.costs?.mp || 0) * 0.35;
            if ((actor.uses.get(skill.id) ?? 0) === 0) utility *= 1.08;
            if (actor.lastSkillId === skill.id) utility *= 0.82;
            if (bonuses.active) utility *= 1.06;
            return utility;
          }'''
          text = text[:start] + utility + text[end:]
          text = text.replace(
          ".map((skill) => ({ skill, utility: inferPlayerUtility(skill, actor, state.enemies) }))",
          ".map((skill) => ({ skill, utility: inferPlayerUtility(skill, actor, state, target, diagnostics) }))")

          text = text.replace(
          "  const targets = targetSet(targetSpec, actor, opponents, allies, target, rng);\n  const totals = { damage: 0, hits: 0, criticals: 0, healing: 0 };",
          "  const targets = targetSet(targetSpec, actor, opponents, allies, target, rng);\n  const effectBonuses = additionalEffectBonuses(skill, state, actor, target, diagnostics);\n  const totals = { damage: 0, hits: 0, criticals: 0, healing: 0 };")
          text = text.replace(
          "    let multiplier = Number(skill.damage.totalMultiplier);",
          "    let multiplier = Number(skill.damage.totalMultiplier) * effectBonuses.damageMultiplier;")
          text = text.replace(
          "fixed: 0, hits: Math.max(1, Number(skill.damage.hits || 1)), accuracy: Number(skill.damage.accuracyModifier || 0),",
          "fixed: 0, hits: Math.max(1, Number(skill.damage.hits || 1)), accuracy: Number(skill.damage.accuracyModifier || 0) + effectBonuses.accuracyMod,")
          text = text.replace(
          "skill: { accuracy: 0 }, actor, targets, rng, criticalBonus: Number(skill.damage.criticalModifier || 0),",
          "skill: { accuracy: 0 }, actor, targets, rng, criticalBonus: Number(skill.damage.criticalModifier || 0) + effectBonuses.criticalMod,")
          text = text.replace(
          "applyModifier(actor, { modifier: buff.stat, stage: buff.stage, durationTurns: buff.durationTurns });",
          "applyModifier(actor, { modifier: buff.stat, stage: buff.stage, durationTurns: Number(buff.durationTurns ?? 1) + effectBonuses.durationBonusTurns });")
          text = text.replace(
          "applyModifier(debuffTarget, { modifier: debuff.stat, stage: debuff.stage, durationTurns: debuff.durationTurns });",
          "applyModifier(debuffTarget, { modifier: debuff.stat, stage: debuff.stage, durationTurns: Number(debuff.durationTurns ?? 1) + effectBonuses.durationBonusTurns });")
          text = text.replace(
          "else applyDebuff(actor, debuffTarget, { ...debuff, debuffId: debuff.type, baseChance: debuff.chancePct ?? 100 }, rng);",
          "else applyDebuff(actor, debuffTarget, { ...debuff, durationTurns: Number(debuff.durationTurns ?? 1) + effectBonuses.durationBonusTurns, debuffId: debuff.type, baseChance: debuff.chancePct ?? 100 }, rng);")
          text = text.replace(
          "const result = executePlayerSpecialState(stateEffect, actor, allies[0], diagnostics);",
          "const result = executePlayerSpecialState({ ...stateEffect, durationTurns: Number(stateEffect.durationTurns ?? stateEffect.duration ?? 1) + effectBonuses.durationBonusTurns }, actor, allies[0], diagnostics);")

          text = text.replace(
          "  if (/洞窟|坑道/.test(text)) tags.add('cave');\n  return tags;",
          "  if (/洞窟|坑道/.test(text)) tags.add('cave');\n  else tags.add('outdoor');\n  return tags;")
          old_return = """  return {
    turn: 0,
    players: builds.map((build, index) => createPlayerActor(build, index + 1)),
    enemies,
    encounter,
    monsterIds,
    fieldTags: new Set(options.fieldTags ?? fieldTagsForEncounter(encounter)),
    fieldEffects: new Map(),
    world: options.world ?? {},
    history: { playerLastSkillRepeatable: false },
  };"""
          new_return = """  const terrainTags = fieldTagsForEncounter(encounter);
  const weatherTags = new Set(options.weatherTags ?? []);
  const fieldTags = new Set([...terrainTags, ...(options.fieldTags ?? [])]);
  if (terrainTags.has('outdoor')) for (const tag of weatherTags) fieldTags.add(tag);
  const world = {
    ...(options.world ?? {}),
    weatherTags: terrainTags.has('outdoor') ? [...weatherTags] : [],
  };
  return {
    turn: 0,
    players: builds.map((build, index) => createPlayerActor(build, index + 1)),
    enemies,
    encounter,
    monsterIds,
    fieldTags,
    fieldEffects: new Map(),
    world,
    history: { playerLastSkillRepeatable: false },
  };"""
          if old_return not in text:
              raise SystemExit('initializeState return marker missing')
          text = text.replace(old_return, new_return)

          text = text.replace(
          "    const availability = interactiveSkillAvailability(data, state, actor, skill, diagnostics);\n    const targetSpec = skill.target === 'contextual' ? 'single_enemy' : skill.target;",
          "    const availability = interactiveSkillAvailability(data, state, actor, skill, diagnostics);\n    const effectBonuses = additionalEffectBonuses(skill, state, actor, living(state.enemies)[0], diagnostics);\n    const targetSpec = skill.target === 'contextual' ? 'single_enemy' : skill.target;")
          text = text.replace(
          "      hpCost: Number(skill.costs?.hp ?? 0),\n      target: targetSpec,",
          "      hpCost: Number(skill.costs?.hp ?? 0),\n      activeBonusLabel: effectBonuses.label,\n      activeBonuses: effectBonuses.active ? { damageMultiplier: effectBonuses.damageMultiplier, accuracyMod: effectBonuses.accuracyMod, criticalMod: effectBonuses.criticalMod, durationBonusTurns: effectBonuses.durationBonusTurns, initiativeMod: effectBonuses.initiativeMod } : null,\n      target: targetSpec,")
          battle_path.write_text(text)

          service_path = Path('src/server/trpg/game/service.js')
          service = service_path.read_text()
          marker = """function canonicalWeatherForState(state) {
  return resolveCanonicalWeather({ day: state.day, regionId: state.player.location, daypart: state.daypart });
}"""
          helper = marker + """

export function battleWeatherContextForState(state) {
  const weather = canonicalWeatherForState(state);
  return {
    weatherTags: [...weather.tags],
    world: {
      day: Number(state.day),
      daypart: state.daypart,
      weatherId: weather.id,
      weatherLabel: weather.label,
      weatherTags: [...weather.tags],
    },
  };
}"""
          if marker not in service:
              raise SystemExit('canonical weather marker missing')
          service = service.replace(marker, helper)
          service = service.replace(
          "          seed: opening.continuation.key,\n          maxTurns: 100,",
          "          seed: opening.continuation.key,\n          maxTurns: 100,\n          ...battleWeatherContextForState(runtime.playerState),")
          service = service.replace(
          "    hpCost: battleNumber(command.hpCost),\n    currentMp: battleNumber(command.currentMp),",
          "    hpCost: battleNumber(command.hpCost),\n    activeBonusLabel: cleanText(command.activeBonusLabel, 120) || null,\n    currentMp: battleNumber(command.currentMp),")
          service_path.write_text(service)

          resolver_path = Path('src/server/trpg/resolvers/weather-resolver.js')
          resolver = resolver_path.read_text()
          resolver = resolver.replace(
          'tags: Object.freeze(["rain", "storm", "lightning", "wind", "outdoor"]),',
          'tags: Object.freeze(["rain", "storm", "thunderstorm", "lightning", "wind", "outdoor"]),')
          resolver_path.write_text(resolver)

          app_path = Path('public/TRPG/app.js')
          app = app_path.read_text()
          app = app.replace(
          '        : [cost, escapeText(command.description, "")].filter(Boolean).join("・");',
          '        : [cost, escapeText(command.activeBonusLabel, ""), escapeText(command.description, "")].filter(Boolean).join("・");')
          app_path.write_text(app)

          weather_test_path = Path('tools/trpg-sim/test/weather-game-view.test.mjs')
          weather_test = weather_test_path.read_text()
          weather_test = weather_test.replace(
          "  buildGameView,\n  createGameRuntime,",
          "  battleWeatherContextForState,\n  buildGameView,\n  createGameRuntime,")
          weather_test += r'''

test("canonical weather is passed to battles as field and world skill context", () => {
  const { runtime } = viewFor("battle-weather-context");
  runtime.playerState.day = 27;
  runtime.playerState.daypart = "night";
  runtime.playerState.player.location = "森";
  const weather = resolveCanonicalWeather({ day: 27, regionId: "森", daypart: "night" });
  const context = battleWeatherContextForState(runtime.playerState);
  assert.deepEqual(context.weatherTags, weather.tags);
  assert.equal(context.world.weatherId, weather.id);
  assert.equal(context.world.daypart, "night");
  assert.deepEqual(context.world.weatherTags, weather.tags);
});
'''
          weather_test_path.write_text(weather_test)

          battle_test_path = Path('tools/trpg-sim/test/battle.test.mjs')
          battle_test = battle_test_path.read_text()
          battle_test += r'''

function weatherMagicBuild() {
  return createPlayerBuild(data, {
    id: "weather-mage",
    name: "Weather mage",
    level: 20,
    equipmentIds: ["EQP-W-0009"],
    skillIds: ["SKL-0688"],
    baseStats: {
      maxHp: 10_000,
      maxMp: 200,
      attack: 20,
      defense: 100,
      agility: 10_000,
      luck: 0,
      physicalPower: 10,
      magicPower: 90,
      magicResistance: 100,
      accuracy: 10_000,
      evasion: 0,
      critical: 0,
      debuffSuccess: 0,
      debuffResistance: 100,
    },
  });
}

function playerRoundDamage(round) {
  return round.frames
    .filter((frame) => frame.phase === "action" && frame.actorSide === "player")
    .reduce((sum, frame) => sum + Number(frame.damage ?? 0), 0);
}

test("rain and thunderstorm conditions visibly strengthen matching battle skills", () => {
  let comparison = null;
  for (let attempt = 0; attempt < 40 && !comparison; attempt += 1) {
    const common = {
      data,
      seed: `weather-skill:${attempt}`,
      monsterIds: ["MON-0005"],
      playerBuild: weatherMagicBuild(),
      maxTurns: 5,
    };
    const clear = beginInteractiveBattle({
      ...common,
      weatherTags: ["clear", "outdoor"],
      world: { day: 20, daypart: "night", weatherId: "clear", weatherTags: ["clear", "outdoor"] },
    });
    const storm = beginInteractiveBattle({
      ...common,
      weatherTags: ["rain", "storm", "thunderstorm", "lightning", "wind", "outdoor"],
      world: { day: 20, daypart: "night", weatherId: "storm", weatherTags: ["rain", "storm", "thunderstorm", "lightning", "wind", "outdoor"] },
    });
    const clearCommands = listInteractiveBattleCommands({ data, session: clear });
    const stormCommands = listInteractiveBattleCommands({ data, session: storm });
    const actionId = "SKILL:SKL-0688";
    const clearCommand = clearCommands.find((entry) => entry.actionId === actionId);
    const stormCommand = stormCommands.find((entry) => entry.actionId === actionId);
    assert.equal(clearCommand.activeBonusLabel, null);
    assert.match(stormCommand.activeBonusLabel, /環境補正/u);
    assert.ok(stormCommand.activeBonuses.damageMultiplier > 1.7);
    const clearResult = resolveInteractiveBattleRound({
      data,
      session: clear,
      command: { actionId, targetInstanceId: firstTarget(clearCommands, actionId) },
    });
    const stormResult = resolveInteractiveBattleRound({
      data,
      session: storm,
      command: { actionId, targetInstanceId: firstTarget(stormCommands, actionId) },
    });
    const clearDamage = playerRoundDamage(clearResult.round);
    const stormDamage = playerRoundDamage(stormResult.round);
    if (clearDamage > 0 && stormDamage > clearDamage) comparison = { clearDamage, stormDamage };
  }
  assert.ok(comparison, "matching weather must produce greater deterministic damage within the bounded seed search");
});

test("cave encounters keep outside weather out of field and world weather tags", () => {
  const caveEncounter = data.encounters.find((encounter) => /洞窟|坑道/u.test(`${encounter.region} ${encounter.route} ${encounter.name}`));
  assert.ok(caveEncounter, "the battle fixture must contain a cave encounter");
  const session = beginInteractiveBattle({
    data,
    seed: "cave-weather-shield",
    encounterId: caveEncounter.id,
    playerBuild: weatherMagicBuild(),
    weatherTags: ["rain", "storm", "thunderstorm", "outdoor"],
    world: { weatherId: "storm", weatherTags: ["rain", "storm", "thunderstorm", "outdoor"] },
  });
  assert.equal(session.state.fieldTags.has("cave"), true);
  assert.equal(session.state.fieldTags.has("rain"), false);
  assert.deepEqual(session.state.world.weatherTags, []);
});
'''
          battle_test_path.write_text(battle_test)

          ambient_path = Path('src/server/trpg/content/authored-weather-ambient-continuity.js')
          ambient = ambient_path.read_text()
          ambient = ambient.replace(
          '    branchCounts: {},\n  };',
          '    branchCounts: {},\n    pendingSceneKey: null,\n    pendingFacilityId: null,\n    promptedSceneKeys: [],\n  };')
          ambient_path.write_text(ambient)
          PY
      - run: npm ci
      - name: Run complete TRPG regression
        run: npm run trpg:test
      - name: Commit verified weather combat integration and retire workflow
        shell: bash
        run: |
          rm .github/workflows/trpg-weather-combat-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/trpg-sim/lib/battle-simulator.mjs \
                  src/server/trpg/game/service.js \
                  src/server/trpg/resolvers/weather-resolver.js \
                  public/TRPG/app.js \
                  tools/trpg-sim/test/weather-game-view.test.mjs \
                  tools/trpg-sim/test/battle.test.mjs \
                  src/server/trpg/content/authored-weather-ambient-continuity.js \
                  .github/workflows/trpg-weather-combat-integration.yml
          git commit -m "feat(trpg): apply canonical weather to battle skills"
          git push origin HEAD:agent/trpg-human-authored-choices
