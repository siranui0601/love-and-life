name: Apply TRPG onboarding immersion redesign

on:
  push:
    branches:
      - chatgpt/trpg-onboarding-immersion-redesign
    paths:
      - tools/trpg-apply-onboarding-immersion-redesign.mjs
      - .github/workflows/trpg-onboarding-immersion-redesign.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/trpg-apply-onboarding-immersion-redesign.mjs
      - .github/workflows/trpg-onboarding-immersion-redesign.yml
      - public/TRPG/p0-ux.js
      - public/TRPG/p0-ux.css

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == '' || github.head_ref == 'chatgpt/trpg-onboarding-immersion-redesign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/trpg-onboarding-immersion-redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply redesign
        run: |
          if [ ! -f tools/trpg-apply-onboarding-immersion-redesign.mjs ]; then
            echo "Patch helper already removed; nothing to apply."
            exit 0
          fi
          node tools/trpg-apply-onboarding-immersion-redesign.mjs
      - name: Install dependencies
        run: npm ci
      - name: Run TRPG tests
        run: npm run test:trpg
      - name: Commit generated changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(trpg): redesign onboarding and restore immersion"
          git push origin HEAD:chatgpt/trpg-onboarding-immersion-redesign
