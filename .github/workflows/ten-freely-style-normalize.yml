name: Normalize Ten Freely style diff

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalize:
    if: github.head_ref == 'feature/ten-freely-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Restore original style bytes and append game entry styles
        run: |
          git show 6e88ae469c0737aafbe09a4a06f5981bc7ed5d0b:public/style.css > public/style.css
          printf '\n\n/* 10を自由に：トップカードとゲスト案内 */\n' >> public/style.css
          git show f425d9b570d27994a7b34a391a9309d2fb3db819:public/ten-freely-entry.css >> public/style.css
          rm .github/workflows/ten-freely-style-normalize.yml
      - name: Commit normalized diff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(ten-freely): minimize shared style diff'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
