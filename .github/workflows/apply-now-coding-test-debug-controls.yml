name: Apply Now Coding test debugger

on:
  push:
    branches:
      - feat/now-coding-test-debug-controls
    paths:
      - .github/workflows/apply-now-coding-test-debug-controls.yml
      - tools/now-coding/apply-test-debug-controls.mjs
      - tools/now-coding/run-test-debug-controls-patch.mjs

permissions:
  contents: write

jobs:
  apply:
    if: "github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply implementation
        run: node tools/now-coding/run-test-debug-controls-patch.mjs
      - name: Syntax check
        run: node --check public/now-coding/app-v3.js && node --check public/now-coding/vm.js
      - name: Focused Now Coding tests
        shell: bash
        run: |
          set -o pipefail
          node --test tools/now-coding/engine.test.mjs tools/now-coding/client-contract.test.mjs 2>&1 | tee /tmp/now-coding-focused-tests.log
      - name: Upload focused-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: now-coding-focused-test-diagnostics
          path: /tmp/now-coding-focused-tests.log
          if-no-files-found: ignore
      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/now-coding/index.html public/now-coding/app-v3.js public/now-coding/vm.js public/now-coding/style-v7.css tools/now-coding/client-contract.test.mjs tools/now-coding/engine.test.mjs
          git commit -m "feat: add Now Coding test playback debugger"
          git push origin HEAD:feat/now-coding-test-debug-controls
