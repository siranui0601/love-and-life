name: TRPG sheet sync

# 正本（TRPGスプレッドシート）へ、リポジトリ内の追記CSVを反映する。
#   docs/trpg/handover-append-*.csv        → 開発引き継ぎシート（同一性は日時と項目）
#   docs/trpg/canon-facility-append-*.csv  → 各拠点タブの施設一覧（同一性は施設ID）
# どちらも追記のみで、既存行の書き換えと削除は行わない。何度実行しても重複しない。
#
# workflow_dispatch は既定ブランチにこのファイルが入るまで使えないので、
# 当面は追記CSVを push した時に走らせる。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "書き込まずに追記候補だけを表示する"
        type: boolean
        default: false
  push:
    paths:
      - "docs/trpg/handover-append-*.csv"
      - "docs/trpg/canon-facility-append-*.csv"
      - "tools/trpg-sim/cli-handover-append.mjs"
      - "tools/trpg-sim/cli-canon-facility-append.mjs"
      - ".github/workflows/trpg-handover-sync.yml"
  pull_request:
    paths:
      - "docs/trpg/handover-append-*.csv"
      - "docs/trpg/canon-facility-append-*.csv"
      - "tools/trpg-sim/cli-handover-append.mjs"
      - "tools/trpg-sim/cli-canon-facility-append.mjs"
      - ".github/workflows/trpg-handover-sync.yml"

env:
  # dry-run で候補を確認済みのため、通常は実反映する。
  # 候補だけ見たい時は workflow_dispatch の dry_run を true にする。
  HANDOVER_DRY_RUN: "false"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
      TRPG_SPREADSHEET_ID: 15slftR2b-76VKaUqTisYolhN1iCpHeB7asUBoyMnmRk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Append handover rows
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ] || [ "$HANDOVER_DRY_RUN" = "true" ]; then
            node tools/trpg-sim/cli-handover-append.mjs --dry-run
          else
            node tools/trpg-sim/cli-handover-append.mjs
          fi
      # 実装が先行して使っている施設を、正本の拠点タブへ揃える。
      - name: Append canonical facility rows
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ] || [ "$HANDOVER_DRY_RUN" = "true" ]; then
            node tools/trpg-sim/cli-canon-facility-append.mjs --dry-run
          else
            node tools/trpg-sim/cli-canon-facility-append.mjs
          fi
