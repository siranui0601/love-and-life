name: TRPG handover sheet sync

# 開発引き継ぎシートへ docs/trpg/handover-append-*.csv を反映する。
# 追記のみで、既存行の書き換えと削除は行わない。同じ日時と項目の行は飛ばすので
# 何度実行しても重複しない。手動実行のみ。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "書き込まずに追記候補だけを表示する"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
      TRPG_SPREADSHEET_ID: 15slftR2b-76VKaUqTisYolhN1iCpHeB7asUBoyMnmRk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Append handover rows
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node tools/trpg-sim/cli-handover-append.mjs --dry-run
          else
            node tools/trpg-sim/cli-handover-append.mjs
          fi
