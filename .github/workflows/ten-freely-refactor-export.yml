name: Ten Freely structure refactor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refactor:
    if: github.head_ref == 'feature/ten-freely-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Consolidate directories and redesign tutorial
        run: |
          cat .github/scripts/refactor_ten.py.part-* > /tmp/refactor_ten.py
          python /tmp/refactor_ten.py
      - name: Verify JavaScript and markup
        run: |
          node --check 'public/10を自由に/app.js'
          node --check 'public/10を自由に/calculator.js'
          node --check 'public/10を自由に/expression-engine.js'
          node --check 'public/10を自由に/online.js'
          node --check 'src/10を自由に/index.js'
          node --check 'src/10を自由に/online.js'
          node --check 'src/10を自由に/problems.js'
          node --check 'src/10を自由に/solver.js'
          node --check 'src/10を自由に/storage.js'
          node --check public/menu-auth.js
          node --check src/server/app.js
          node --check src/server/shared/index.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Parser(HTMLParser): pass
          for filename in ['public/index.html', 'public/10を自由に/index.html']:
              parser = Parser(); parser.feed(Path(filename).read_text()); parser.close()
          for filename in ['public/style.css', 'public/10を自由に/style.css']:
              text = Path(filename).read_text()
              assert text.count('{') == text.count('}'), filename
          PY
      - name: Verify tutorial examples and solver
        run: |
          node --input-type=module <<'JS'
          import { evaluateExpression, validateDigitUsage, isTen } from './public/10を自由に/expression-engine.js';
          const tests = [
            ['46','4+6'], ['831','8+3-1'], ['25','2*5'], ['821','8+2/1'], ['223','2*(3+2)'],
            ['48','√4+8'], ['5','5!!!'], ['321','3^2+1'], ['52','5C2'], ['522','5P2/2'],
          ];
          for (const [problem, expression] of tests) {
            const evaluated = evaluateExpression(expression);
            if (!validateDigitUsage(evaluated.ast, problem).valid || !isTen(evaluated.value)) throw new Error(`${problem}: ${expression}`);
          }
          const { solveTenProblem } = await import('./src/10を自由に/solver.js');
          for (const problem of ['0067', '7777', '002']) if (!solveTenProblem(problem)) throw new Error(`no solution: ${problem}`);
          JS
      - name: Commit consolidated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(ten-freely): consolidate files and redesign tutorials'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
