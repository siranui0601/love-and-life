name: Apply TRPG player needs v2

on:
  push:
    branches:
      - chatgpt/trpg-authored-content-refactor
    paths:
      - ".github/workflows/apply-trpg-player-needs-v2.yml"
      - "tools/trpg-refactor/apply-player-needs-v2.mjs"

permissions:
  contents: write

concurrency:
  group: trpg-player-needs-v2
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/trpg-authored-content-refactor
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Integrate formal hunger fatigue meals and sleep
        shell: bash
        run: |
          set +e
          mkdir -p tools/trpg-refactor
          node tools/trpg-refactor/apply-player-needs-v2.mjs > tools/trpg-refactor/player-needs-integration.log 2>&1
          status=$?
          cat tools/trpg-refactor/player-needs-integration.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/trpg-refactor/player-needs-integration.log
            git commit -m "test(trpg): record player needs integration failure"
            git push origin HEAD:chatgpt/trpg-authored-content-refactor
            exit "$status"
          fi
      - run: npm ci
      - name: Run complete TRPG regression suite
        shell: bash
        run: |
          set +e
          npm run trpg:test > tools/trpg-player-needs-regression.log 2>&1
          status=$?
          cat tools/trpg-player-needs-regression.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/trpg-player-needs-regression.log
            git commit -m "test(trpg): record player needs regression failure"
            git push origin HEAD:chatgpt/trpg-authored-content-refactor
            exit "$status"
          fi
      - name: Commit integrated source
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/trpg-player-needs-regression.log tools/trpg-refactor/player-needs-integration.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(trpg): integrate meals fatigue and sleep"
          git push origin HEAD:chatgpt/trpg-authored-content-refactor
