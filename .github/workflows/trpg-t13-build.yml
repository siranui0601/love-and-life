name: TRPG T13 publish verified source

on:
  push:
    branches:
      - agent/trpg-human-authored-choices
    paths:
      - ".github/workflows/trpg-t13-build.yml"

permissions:
  contents: write

jobs:
  publish-t13:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRPG_GEMINI_NARRATIVE_ENABLED: "false"
      TRPG_GEMINI_ASSET_GENERATION_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/trpg-human-authored-choices
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct, verify and apply reviewed T13 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/t13-patch/part-*.b64 | tr -d '\n' | base64 --decode | gzip --decompress > /tmp/t13_patch.py
          echo "c29093c23d5c06e5e928af6fbe6b1bf37a535fc1f6605eccf4141440b2fbb941  /tmp/t13_patch.py" | sha256sum --check
          python /tmp/t13_patch.py
          echo "46bea5a64c3fabe21a4d3184f57f600b69e16f46b9b4ea31e2f7d6f2dfaea780  src/server/trpg/content/authored/missions/t13-forest-king-slime-world-tree-collapse.js" | sha256sum --check
          node --check src/server/trpg/content/authored/missions/t13-forest-king-slime-world-tree-collapse.js
          node --check src/server/trpg/content/authored-mission-flow-registry.js
          node --check src/server/trpg/content/authored-scene-registry.js
          git diff --check
          test "$TRPG_GEMINI_NARRATIVE_ENABLED" = "false"
          test "$TRPG_GEMINI_ASSET_GENERATION_ENABLED" = "false"
      - name: Commit and push T13 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/server/trpg/content/README.md \
            src/server/trpg/content/authored-mission-flow-registry.js \
            src/server/trpg/content/authored-scene-registry.js \
            src/server/trpg/content/authored/missions/t13-forest-king-slime-world-tree-collapse.js \
            tools/trpg-sim/test/authored-mission-aftermath.test.mjs \
            tools/trpg-sim/test/authored-mission-aftermath-isolation.test.mjs \
            tools/trpg-sim/test/mission-step-timeline.test.mjs
          if git diff --cached --quiet; then
            echo "No T13 source changes to commit"
            exit 0
          fi
          git commit -m "TRPG: T13世界樹倒壊事件を多層分岐で実装"
          git push origin HEAD:agent/trpg-human-authored-choices
