name: TRPG T13 build verification

on:
  push:
    branches:
      - agent/trpg-human-authored-choices
    paths:
      - ".github/workflows/trpg-t13-build.yml"

permissions:
  contents: write

jobs:
  build-t13:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TRPG_GEMINI_NARRATIVE_ENABLED: "false"
      TRPG_GEMINI_ASSET_GENERATION_ENABLED: "false"
      TRPG_PLAYER_V4_SEEDS: "2"
      TRPG_GOAP_V4_SEEDS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/trpg-human-authored-choices
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed T13 patch
        shell: bash
        run: |
          cat > /tmp/t13_patch.py <<'PY'
          import base64
          from pathlib import Path
          
          ROOT = Path(".")
          def read(path):
              return (ROOT / path).read_text(encoding="utf-8")
          def write(path, text):
              p = ROOT / path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding="utf-8")
          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f"missing patch anchor: {label}")
              return text.replace(old, new, 1)
          
          write("src/server/trpg/content/authored/missions/t13-forest-king-slime-world-tree-collapse.js",
                base64.b64decode("...