name: TRPG T13 integration verification

on:
  push:
    branches:
      - agent/trpg-human-authored-choices
    paths:
      - ".github/workflows/trpg-t13-build.yml"

jobs:
  verify-t13:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TRPG_GEMINI_NARRATIVE_ENABLED: "false"
      TRPG_GEMINI_ASSET_GENERATION_ENABLED: "false"
      TRPG_PLAYER_V4_SEEDS: "2"
      TRPG_GOAP_V4_SEEDS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/trpg-human-authored-choices
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify T13 source and focused contracts
        shell: bash
        run: |
          set -euo pipefail
          echo "46bea5a64c3fabe21a4d3184f57f600b69e16f46b9b4ea31e2f7d6f2dfaea780  src/server/trpg/content/authored/missions/t13-forest-king-slime-world-tree-collapse.js" | sha256sum --check
          node --check src/server/trpg/content/authored/missions/t13-forest-king-slime-world-tree-collapse.js
          grep -q 'minimumRouteShapesBeforePriorState: 4723920' src/server/trpg/content/authored/missions/t13-forest-king-slime-world-tree-collapse.js
          grep -q 'AUTHORED_MISSION_FLOW_VERSION = "authored-mission-flow-v13"' src/server/trpg/content/authored-mission-flow-registry.js
          grep -q 'AUTHORED_CONTENT_VERSION = "authored-content-v19"' src/server/trpg/content/authored-scene-registry.js
          node --test \
            tools/trpg-sim/test/authored-mission-aftermath.test.mjs \
            tools/trpg-sim/test/authored-mission-aftermath-isolation.test.mjs \
            tools/trpg-sim/test/mission-step-timeline.test.mjs
      - name: Run all TRPG tests
        run: npm run trpg:test
      - name: Run strict integrated player and GOAP journeys
        run: node tools/trpg-sim/cli-player-v4.mjs --strict
      - name: Confirm paid Gemini paths stayed disabled
        shell: bash
        run: |
          test "$TRPG_GEMINI_NARRATIVE_ENABLED" = "false"
          test "$TRPG_GEMINI_ASSET_GENERATION_ENABLED" = "false"
