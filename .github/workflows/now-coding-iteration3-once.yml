name: now-coding-iteration3-once

on:
  push:
    branches:
      - feat/now-coding-foundation
    paths:
      - ".github/workflows/now-coding-iteration3-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/now-coding-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fix optional tutorial focus cleanup
        run: node tools/now-coding/fix-tutorial-focus-final.mjs
      - name: Verify tutorial and game files
        run: |
          node --check public/now-coding/app.js
          node --check public/now-coding/tutorials.js
          node --check public/now-coding/modes.js
          node --test tools/now-coding/engine.test.mjs
          node - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('public/now-coding/app.js', 'utf8');
          if (!source.includes('document.querySelectorAll(".lesson-target")')) throw new Error('focus cleanup fix missing');
          console.log('tutorial focus assertion passed');
          NODE
      - name: Commit verified tutorial fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/now-coding/app.js
          git diff --cached --check
          git commit -m "fix(now-coding): clear optional tutorial highlights safely"
          git push origin HEAD:feat/now-coding-foundation
