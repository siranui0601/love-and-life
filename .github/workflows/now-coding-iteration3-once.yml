name: now-coding-iteration3-once

on:
  push:
    branches:
      - feat/now-coding-foundation
    paths:
      - ".github/workflows/now-coding-iteration3-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/now-coding-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Polish tutorial entry
        run: node tools/now-coding/polish-tutorial-intro.mjs
      - name: Verify tutorial and game files
        run: |
          node --check public/now-coding/app.js
          node --check public/now-coding/tutorials.js
          node --check public/now-coding/modes.js
          node --test tools/now-coding/engine.test.mjs
          node - <<'NODE'
          const fs = require('node:fs');
          const checks = [
            ['public/now-coding/index.html', 'コードを組んで、1位を目指せ。'],
            ['public/now-coding/index.html', 'id="tutorialIntroDemo"'],
            ['public/now-coding/tutorials.js', 'id: "overview"'],
            ['public/now-coding/app.js', '$$(".lesson-target")'],
          ];
          for (const [path, needle] of checks) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(needle)) throw new Error(`${path} missing ${needle}`);
          }
          console.log('tutorial smoke assertions passed');
          NODE
      - name: Commit verified tutorial polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/now-coding/app.js public/now-coding/index.html public/now-coding/style-v2.css public/now-coding/tutorials.js
          git diff --cached --check
          git commit -m "feat(now-coding): make tutorial goal visual and immediate"
          git push origin HEAD:feat/now-coding-foundation
