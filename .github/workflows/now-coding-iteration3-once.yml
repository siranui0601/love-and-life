name: now-coding-iteration3-once

on:
  push:
    branches:
      - feat/now-coding-foundation
    paths:
      - ".github/workflows/now-coding-iteration3-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/now-coding-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fix invalid attack semantics
        run: node tools/now-coding/fix-splat-no-tick.mjs
      - name: Verify all modes
        run: |
          node --check public/now-coding/engine.js
          node --check public/now-coding/modes.js
          node --check public/now-coding/tutorials.js
          node --check public/now-coding/app.js
          node --check src/server/now-coding/online.js
          node --test tools/now-coding/engine.test.mjs
      - name: Commit verified product fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/now-coding/modes.js tools/now-coding/engine.test.mjs
          git diff --cached --check
          git commit -m "fix(now-coding): keep invalid splat attacks zero-tick"
          git push origin HEAD:feat/now-coding-foundation
