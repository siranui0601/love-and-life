name: Apply Now Coding editor test mobile UX

on:
  push:
    branches:
      - fix/now-coding-editor-test-mobile-ux
    paths:
      - .github/workflows/apply-now-coding-editor-test-mobile-ux.yml
      - tools/now-coding/apply-editor-test-mobile-ux.mjs

permissions:
  contents: write

jobs:
  apply:
    if: "github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply implementation
        run: node tools/now-coding/apply-editor-test-mobile-ux.mjs
      - name: Syntax check
        run: |
          node --check public/now-coding/app-v3.js
          node --check public/now-coding/vm.js
      - name: Focused Now Coding tests
        run: node --test tools/now-coding/engine.test.mjs tools/now-coding/client-contract.test.mjs tools/now-coding/board-spawn.test.mjs tools/now-coding/fall-timed-collapse.test.mjs tools/now-coding/tutorial-recovery.test.mjs
      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/now-coding/index.html public/now-coding/app-v3.js public/now-coding/style-v7.css tools/now-coding/client-contract.test.mjs
          git commit -m "fix: improve Now Coding editor and test controls"
          git push origin HEAD:fix/now-coding-editor-test-mobile-ux
