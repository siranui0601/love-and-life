name: Apply TRPG v2 EXP balance fix

on:
  push:
    branches:
      - agent/trpg-player-simulation-v2-20260717
    paths:
      - ".github/workflows/apply-trpg-v2-expfix.yml"
      - "tools/trpg-sim/.v2-expfix/**"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/trpg-player-simulation-v2-20260717
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python tools/trpg-sim/.v2-expfix/apply.py
      - run: node --check tools/trpg-sim/lib/player-journey.mjs
      - run: npm ci
      - run: npm run trpg:test
      - name: Commit EXP fix
        run: |
          rm -rf tools/trpg-sim/.v2-expfix
          rm -f .github/workflows/apply-trpg-v2-expfix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "TRPG v2: rebalance battle and mission experience sources" || exit 0
          git push origin HEAD:agent/trpg-player-simulation-v2-20260717
