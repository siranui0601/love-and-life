name: now-coding-entry-once

on:
  push:
    branches:
      - feat/now-coding-foundation
    paths:
      - ".github/workflows/now-coding-entry-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/now-coding-foundation
          fetch-depth: 0
      - name: Insert Now Coding card without rewriting unrelated menu content
        shell: python
        run: |
          from pathlib import Path

          path = Path("public/index.html")
          source = path.read_text(encoding="utf-8")
          if 'data-game="now-coding"' not in source:
              marker = '''    <div class="game-card" data-game="trpg" onclick="window.location.href='/TRPG/'" role="link" tabindex="0" aria-label="TRPG(仮題)を開く">
                <div class="game-icon">⚔️</div>
                <h2>TRPG(仮題)</h2>
                <p>時間が止まらない異世界ゲームブック</p>
              </div>'''
              # The live file uses six-space indentation inside this block.
              marker = '''    <div class="game-card" data-game="trpg" onclick="window.location.href='/TRPG/'" role="link" tabindex="0" aria-label="TRPG(仮題)を開く">
              <div class="game-icon">⚔️</div>
              <h2>TRPG(仮題)</h2>
              <p>時間が止まらない異世界ゲームブック</p>
            </div>'''
              if marker not in source:
                  raise SystemExit("TRPG card marker not found; refusing broad rewrite")
              card = r'''

            <div class="game-card" data-game="now-coding" role="button" tabindex="0" aria-label="Now Codingを開く"
              onclick="event.stopPropagation();(()=>{let u=null;try{u=JSON.parse(localStorage.getItem('currentUser')||'null')}catch(e){}if(u&&u.userTrackingId){window.location.href='/now-coding/';return;}sessionStorage.setItem('afterAuthRedirect','/now-coding/');document.getElementById('openLoginBtn')?.click();})()">
              <div class="game-icon" aria-hidden="true">
                <svg viewBox="0 0 64 64" width="58" height="58" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:auto;">
                  <path d="M8 8H56V56H8V8Z" stroke="currentColor" stroke-width="2"/>
                  <path d="M24 8V56M40 8V56M8 24H56M8 40H56" stroke="currentColor" stroke-opacity=".35"/>
                  <path d="M19 33L27 25M19 33L27 41M45 23L35 43" stroke="currentColor" stroke-width="3" stroke-linecap="square"/>
                </svg>
              </div>
              <h2>Now Coding</h2>
              <p>コードを組んで、駒を戦わせろ。</p>
            </div>'''
              path.write_text(source.replace(marker, marker + card, 1), encoding="utf-8")

          # This workflow is intentionally one-shot and must not remain in the product branch.
          Path(".github/workflows/now-coding-entry-once.yml").unlink(missing_ok=True)
      - name: Commit only the targeted entry change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html .github/workflows/now-coding-entry-once.yml
          git diff --cached --check
          git commit -m "feat(now-coding): add authenticated top-page entry"
          git push origin HEAD:feat/now-coding-foundation
