name: now-coding-entry-once

on:
  push:
    branches:
      - feat/now-coding-foundation
    paths:
      - ".github/workflows/now-coding-entry-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/now-coding-foundation
          fetch-depth: 0
      - run: node tools/now-coding/inject-menu-entry.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/index.html .github/workflows/now-coding-entry-once.yml tools/now-coding/inject-menu-entry.mjs
          git diff --cached --check
          git commit -m "feat(now-coding): add authenticated top-page entry"
          git push origin HEAD:feat/now-coding-foundation
