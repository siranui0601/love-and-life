name: Temporary T09 integration and validation
on:
  pull_request:
    paths:
      - ".github/workflows/trpg-t09-integration.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/trpg-human-authored-choices
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconstruct verified T09 sources and patch
        shell: bash
        run: |
          mkdir -p src/server/trpg/content/authored/missions /tmp/trpg-t09
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          assets = [
              (
                  '.github/t09-assets/pack.00.b64',
                  'a4651a1b87ff2da39fec651daa61f33c304b30e1683748035ef07197a120bef4',
                  'f2d2253c9484bdc15f43623626bc3cc97197c938b14119a5e18fec90f5709062',
                  'src/server/trpg/content/authored/missions/t09-dwarf-mine-collapse.js',
              ),
              (
                  '.github/t09-assets/patch.00.b64',
                  '70a342a1ff5325d16051442f665de2dd439a035cd02c42fce0e6ee16c6a2afe2',
                  '4457cd71090d3cd77a68bbbd6f79ed39bc7839cc1fee5233be4fabd91d2b839f',
                  '/tmp/trpg-t09/patch_t09.py',
              ),
          ]
          for source, encoded_sha, decoded_sha, target in assets:
              encoded = Path(source).read_text().strip()
              assert hashlib.sha256(encoded.encode('ascii')).hexdigest() == encoded_sha
              data = gzip.decompress(base64.b64decode(encoded, validate=True))
              assert hashlib.sha256(data).hexdigest() == decoded_sha
              Path(target).write_bytes(data)
          pack = Path('src/server/trpg/content/authored/missions/t09-dwarf-mine-collapse.js').read_text('utf-8')
          assert 'ドワーフ洞窟の崩落事故' in pack
          assert 'T09_DWARF_MINE_COLLAPSE_PACK' in pack
          PY
          python /tmp/trpg-t09/patch_t09.py
      - run: npm ci
      - name: Focused T09 contracts
        shell: bash
        run: |
          test "$(sha256sum src/server/trpg/content/authored/missions/t09-dwarf-mine-collapse.js | cut -d' ' -f1)" = "f2d2253c9484bdc15f43623626bc3cc97197c938b14119a5e18fec90f5709062"
          grep -F 'title: "ドワーフ洞窟の崩落事故"' src/server/trpg/content/authored/missions/t09-dwarf-mine-collapse.js
          node --check src/server/trpg/content/authored/missions/t09-dwarf-mine-collapse.js
          node --check src/server/trpg/content/authored-mission-flow-registry.js
          node --check src/server/trpg/content/authored-scene-registry.js
          node --test tools/trpg-sim/test/mission-step-timeline.test.mjs
          node --test tools/trpg-sim/test/authored-mission-aftermath.test.mjs
          node --test tools/trpg-sim/test/authored-mission-aftermath-isolation.test.mjs
          git diff --check
      - name: Full TRPG regression
        run: npm run trpg:test
      - name: Strict integrated player and GOAP journeys
        env:
          TRPG_PLAYER_V4_SEEDS: 2
          TRPG_GOAP_V4_SEEDS: 2
        run: node tools/trpg-sim/cli-player-v4.mjs --strict
      - name: Publish clean implementation
        shell: bash
        run: |
          test "$(sha256sum src/server/trpg/content/authored/missions/t09-dwarf-mine-collapse.js | cut -d' ' -f1)" = "f2d2253c9484bdc15f43623626bc3cc97197c938b14119a5e18fec90f5709062"
          git checkout HEAD -- public/TRPG/player-simulation-report.json tools/trpg-sim/reports/player-latest.md || true
          rm -f public/TRPG/player-simulation-v4-report.json \
            tools/trpg-sim/reports/player-latest.json \
            tools/trpg-sim/reports/player-v4-latest.json \
            tools/trpg-sim/reports/player-v4-latest.md
          rm -rf .github/t09-assets .github/workflows/trpg-t09-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "TRPG: T09ドワーフ洞窟崩落事故を実装"
          test "$(git show HEAD:src/server/trpg/content/authored/missions/t09-dwarf-mine-collapse.js | sha256sum | cut -d' ' -f1)" = "f2d2253c9484bdc15f43623626bc3cc97197c938b14119a5e18fec90f5709062"
          git push origin HEAD:agent/trpg-human-authored-choices
