name: now-coding-save-flow-once

on:
  push:
    branches:
      - fix/now-coding-board-spawn-mobile-input
    paths:
      - ".github/workflows/now-coding-save-flow-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/now-coding-board-spawn-mobile-input
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply save flow
        run: python tools/now-coding/patch-save-flow.py
      - name: Syntax check
        run: node --check public/now-coding/app-v3.js
      - name: Engine and client contract tests
        run: node --test tools/now-coding/engine.test.mjs tools/now-coding/client-contract.test.mjs
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/now-coding/app-v3.js public/now-coding/index.html public/now-coding/style-v7.css tools/now-coding/client-contract.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "feat(now-coding): add overwrite save and unsaved navigation guard"
          git push origin HEAD:fix/now-coding-board-spawn-mobile-input
