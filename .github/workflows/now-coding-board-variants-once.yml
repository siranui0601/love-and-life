name: now-coding-board-variants-once

on:
  push:
    branches:
      - fix/now-coding-territory-blocking-glow
    paths:
      - ".github/workflows/now-coding-board-variants-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/now-coding-territory-blocking-glow
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repair compact function separators
        run: python tools/now-coding/fix-board-patcher.py
      - name: Apply board variant patch
        run: python tools/now-coding/patch-board-variants.py
      - name: Syntax check
        run: |
          node --check public/now-coding/boards.js
          node --check public/now-coding/engine.js
          node --check public/now-coding/modes.js
          node --check public/now-coding/app-v3.js
          node --check public/now-coding/tutorials.js
          node --check src/server/now-coding/online.js
      - name: Engine VM and client contract tests
        run: node --test tools/now-coding/engine.test.mjs tools/now-coding/client-contract.test.mjs
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/now-coding/boards.js public/now-coding/engine.js public/now-coding/modes.js public/now-coding/app-v3.js public/now-coding/index.html public/now-coding/style-v7.css src/server/now-coding/online.js tools/now-coding/engine.test.mjs tools/now-coding/client-contract.test.mjs .github/workflows/now-coding.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat(now-coding): add selectable board variants"
          git push origin HEAD:fix/now-coding-territory-blocking-glow
