name: Fix Ten Freely tutorial markup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feature/ten-freely-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Fix and verify tutorial markup
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('public/10を自由に/index.html')
          text = path.read_text()
          text = text.replace('</p>>', '</p>')
          path.write_text(text)
          assert '</p>>' not in text
          PY
          rm .github/workflows/ten-freely-html-fix.yml
      - name: Commit markup fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ten-freely): clean tutorial intro markup'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
