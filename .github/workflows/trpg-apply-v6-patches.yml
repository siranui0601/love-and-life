name: Apply TRPG v6 staged patches

on:
  push:
    branches:
      - chatgpt/trpg-experiential-simulation-v6
    paths:
      - ".github/workflows/trpg-apply-v6-patches.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/trpg-experiential-simulation-v6
          fetch-depth: 1
      - name: Apply staged patches once
        shell: bash
        run: |
          set -euo pipefail
          for patch_file in \
            tools/trpg-v6-1.patch \
            tools/trpg-v6-2-1.patch \
            tools/trpg-v6-2-2.patch \
            tools/trpg-v6-2-3.patch \
            tools/trpg-v6-3-1.patch
          do
            patch -p1 < "$patch_file"
          done
          base64 --decode tools/trpg-v6-3-2.patch.b64 > /tmp/trpg-v6-3-2.patch
          patch -p1 < /tmp/trpg-v6-3-2.patch

          rm -f \
            tools/trpg-v6-1.patch \
            tools/trpg-v6-2-1.patch \
            tools/trpg-v6-2-2.patch \
            tools/trpg-v6-2-3.patch \
            tools/trpg-v6-3-1.patch \
            tools/trpg-v6-3-2.patch.b64 \
            .github/workflows/trpg-apply-v6-patches.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(trpg): apply experiential simulation v6 implementation"
          git push origin HEAD:chatgpt/trpg-experiential-simulation-v6
