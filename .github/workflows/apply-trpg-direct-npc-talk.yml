name: Apply TRPG direct NPC talk

on:
  push:
    branches:
      - chatgpt/trpg-authored-content-refactor
    paths:
      - ".github/workflows/apply-trpg-direct-npc-talk.yml"
      - "tools/trpg-refactor/apply-direct-npc-talk.mjs"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/trpg-authored-content-refactor
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Integrate direct portrait conversation
        run: node tools/trpg-refactor/apply-direct-npc-talk.mjs
      - run: npm ci
      - name: Run complete TRPG regression suite
        run: npm run trpg:test
      - name: Commit integrated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(trpg): talk to visible NPCs from portraits"
          git push origin HEAD:chatgpt/trpg-authored-content-refactor
