name: fix-now-coding-patcher

on:
  push:
    branches:
      - fix/now-coding-tutorial-recovery-copy

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/now-coding-tutorial-recovery-copy
      - name: Relax false duplicate guard
        run: |
          sed -i '/if (next.includes(before)) throw new Error(`duplicate_anchor:${label}`);/d' tools/now-coding/apply-tutorial-copy-fix.mjs
          rm .github/workflows/fix-now-coding-patcher.yml
      - name: Commit guard fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: fix one-shot patch guard"
          git push origin HEAD:fix/now-coding-tutorial-recovery-copy
