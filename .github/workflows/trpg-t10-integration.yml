name: Temporary T10 integration and validation
on:
  pull_request:
    paths:
      - ".github/workflows/trpg-t10-integration.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/trpg-human-authored-choices
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconstruct verified T10 sources and patch
        shell: bash
        run: |
          mkdir -p src/server/trpg/content/authored/missions /tmp/trpg-t10
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          assets = [
              (
                  '.github/t10-assets/pack.00.b64',
                  '6b36704718c83b438cf7837d5e2e6823eb8149c8071105756e40abb22950f715',
                  '699e1db524dd89302adae265e13313296d7b702c8487252ef12dfd3fdc34da72',
                  'src/server/trpg/content/authored/missions/t10-capital-orphanage-eviction.js',
              ),
              (
                  '.github/t10-assets/patch.00.b64',
                  '44fa7c04459075315f5f1724acdf793ecfe6a58ce6e1914ffc074d67e83d9000',
                  '0422b4efa50782ea20030b80bee0f7639b2bdf8b8c7a05d0435127a50c395423',
                  '/tmp/trpg-t10/patch_t10.py',
              ),
          ]
          for source, encoded_sha, decoded_sha, target in assets:
              encoded = Path(source).read_text().strip()
              assert hashlib.sha256(encoded.encode('ascii')).hexdigest() == encoded_sha
              data = gzip.decompress(base64.b64decode(encoded, validate=True))
              assert hashlib.sha256(data).hexdigest() == decoded_sha
              Path(target).write_bytes(data)
          pack = Path('src/server/trpg/content/authored/missions/t10-capital-orphanage-eviction.js').read_text('utf-8')
          assert '王都孤児院の立ち退き' in pack
          assert 'T10_CAPITAL_ORPHANAGE_EVICTION_PACK' in pack
          PY
          python /tmp/trpg-t10/patch_t10.py
      - run: npm ci
      - name: Focused T10 contracts
        shell: bash
        run: |
          test "$(sha256sum src/server/trpg/content/authored/missions/t10-capital-orphanage-eviction.js | cut -d' ' -f1)" = "699e1db524dd89302adae265e13313296d7b702c8487252ef12dfd3fdc34da72"
          grep -F 'title: "王都孤児院の立ち退き"' src/server/trpg/content/authored/missions/t10-capital-orphanage-eviction.js
          grep -F '失敗すると、安い装備と薬を売る大型店がDay70に開業する。' src/server/trpg/content/authored/missions/t10-capital-orphanage-eviction.js
          node --check src/server/trpg/content/authored/missions/t10-capital-orphanage-eviction.js
          node --check src/server/trpg/content/authored-mission-flow-registry.js
          node --check src/server/trpg/content/authored-scene-registry.js
          node --test tools/trpg-sim/test/mission-step-timeline.test.mjs
          node --test tools/trpg-sim/test/authored-mission-aftermath.test.mjs
          node --test tools/trpg-sim/test/authored-mission-aftermath-isolation.test.mjs
          git diff --check
      - name: Full TRPG regression
        run: npm run trpg:test
      - name: Strict integrated player and GOAP journeys
        env:
          TRPG_PLAYER_V4_SEEDS: 2
          TRPG_GOAP_V4_SEEDS: 2
        run: node tools/trpg-sim/cli-player-v4.mjs --strict
      - name: Publish clean implementation
        shell: bash
        run: |
          test "$(sha256sum src/server/trpg/content/authored/missions/t10-capital-orphanage-eviction.js | cut -d' ' -f1)" = "699e1db524dd89302adae265e13313296d7b702c8487252ef12dfd3fdc34da72"
          git checkout HEAD -- public/TRPG/player-simulation-report.json tools/trpg-sim/reports/player-latest.md || true
          rm -f public/TRPG/player-simulation-v4-report.json \
            tools/trpg-sim/reports/player-latest.json \
            tools/trpg-sim/reports/player-v4-latest.json \
            tools/trpg-sim/reports/player-v4-latest.md
          rm -rf .github/t10-assets .github/workflows/trpg-t10-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "TRPG: T10王都孤児院の立ち退きを実装"
          test "$(git show HEAD:src/server/trpg/content/authored/missions/t10-capital-orphanage-eviction.js | sha256sum | cut -d' ' -f1)" = "699e1db524dd89302adae265e13313296d7b702c8487252ef12dfd3fdc34da72"
          git push origin HEAD:agent/trpg-human-authored-choices
