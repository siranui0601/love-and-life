name: TRPG Checkpoint F register diagnostic

on:
  push:
    branches:
      - claude/trpg-virtue-route-main-143ar9
    paths:
      - .github/workflows/trpg-f-register-diagnostic.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/trpg-virtue-route-main-143ar9
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply publication policy
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          engine_path = Path('tools/trpg-sim/lib/npc-life-engine.mjs')
          engine = engine_path.read_text()
          old_guard = 'if (!pool || !belief || belief.kind === "interest" || belief.secret) return;'
          new_guard = 'if (!pool || !belief || belief.kind === "interest" || belief.secret || belief.publicationMode === "conversation-only") return;'
          if engine.count(old_guard) != 2:
              raise SystemExit('publication guard mismatch')
          engine = engine.replace(old_guard, new_guard)

          old_learn = "learnedAt: Number(context.contactAt ?? time.absoluteHour),\n        propagationAt: Number(context.contactAt ?? time.absoluteHour) + 4,"
          new_learn = "learnedAt: Number(context.contactAt ?? time.absoluteHour),\n        propagationAt: Number(context.contactAt ?? time.absoluteHour) + Math.max(4, Number(sourceBelief.relayDelayHours ?? 4)),"
          if engine.count(old_learn) != 1:
              raise SystemExit('recipient propagation mismatch')
          engine = engine.replace(old_learn, new_learn, 1)

          old_event = "propagationAt: Number(context.contactAt ?? time.absoluteHour) + 4,\n        location: context.location"
          new_event = "propagationAt: Number(context.contactAt ?? time.absoluteHour) + Math.max(4, Number(sourceBelief.relayDelayHours ?? 4)),\n        location: context.location"
          if engine.count(old_event) != 1:
              raise SystemExit('event propagation mismatch')
          engine = engine.replace(old_event, new_event, 1)

          old_call = "Number(context.contactAt ?? time.absoluteHour) + 4, recipientId,"
          new_call = "Number(context.contactAt ?? time.absoluteHour) + Math.max(4, Number(sourceBelief.relayDelayHours ?? 4)), recipientId,"
          if engine.count(old_call) != 1:
              raise SystemExit('publish call mismatch')
          engine = engine.replace(old_call, new_call, 1)
          engine_path.write_text(engine)

          authored_path = Path('src/server/trpg/content/authored-register-butterfly.js')
          authored = authored_path.read_text()
          if authored.count('importance: 0.72,') != 2:
              raise SystemExit('importance mismatch')
          authored = authored.replace('importance: 0.72,', 'importance: 0.82,')
          marker = '    secret: false,\n    learnedAt,\n    propagationAt: learnedAt + (1 / 60),\n    sourceType: "inn-register-corroboration",'
          replacement = '    secret: false,\n    publicationMode: "conversation-only",\n    relayDelayHours: 48,\n    learnedAt,\n    propagationAt: learnedAt + (1 / 60),\n    sourceType: "inn-register-corroboration",'
          if authored.count(marker) != 1:
              raise SystemExit('authored publication marker mismatch')
          authored = authored.replace(marker, replacement, 1)
          authored_path.write_text(authored)
          PY
      - name: Syntax check
        run: |
          node --check tools/trpg-sim/lib/npc-life-engine.mjs
          node --check src/server/trpg/content/authored-register-butterfly.js
      - name: Focused tests
        run: node --test tools/trpg-sim/test/checkpoint-f-register-direct-share.test.mjs tools/trpg-sim/test/living-world.test.mjs tools/trpg-sim/test/integration.test.mjs tools/trpg-sim/test/world.test.mjs
      - name: Commit verified source patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/trpg-f-register-diagnostic.yml
          git add tools/trpg-sim/lib/npc-life-engine.mjs src/server/trpg/content/authored-register-butterfly.js
          git diff --cached --check
          git commit -m "fix(trpg): separate conversation from rumor publication"
          git push origin HEAD:claude/trpg-virtue-route-main-143ar9
