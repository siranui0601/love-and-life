name: now-coding-editor-test-ux-apply
on:
  push:
    branches:
      - feat/now-coding-editor-test-ux
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Harden one-shot patch for current tutorial layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/now-coding/apply-editor-test-ux.mjs')
          s=p.read_text()
          old='''function replaceOnce(source,from,to,label){
            const count=source.split(from).length-1;
            assert.equal(count,1,`${label}: expected one match, got ${count}`);
            return source.replace(from,to);
          }'''
          new='''function replaceOnce(source,from,to,label){
            const count=source.split(from).length-1;
            if(count===1)return source.replace(from,to);
            if(label.startsWith("tutorial play")){
              const start=source.indexOf("const targets={");
              const end=start>=0?source.indexOf("\\n  };",start):-1;
              assert.ok(start>=0&&end>start,`${label}: tutorial targets block missing`);
              const block=source.slice(start,end);
              if(!block.includes("#runTestButton"))return source;
              return source.slice(0,start)+block.replaceAll("#runTestButton","#testPlayPauseButton")+source.slice(end);
            }
            assert.equal(count,1,`${label}: expected one match, got ${count}`);
            return source.replace(from,to);
          }'''
          assert old in s, 'replaceOnce helper not found'
          p.write_text(s.replace(old,new,1))
          PY
      - name: Apply Now Coding editor/test UX changes
        run: node tools/now-coding/apply-editor-test-ux.mjs
      - name: Syntax check
        run: node --check public/now-coding/app-v3.js
      - name: Focused Now Coding tests
        run: |
          node --test tools/now-coding/engine.test.mjs
          node --test tools/now-coding/client-contract.test.mjs
      - name: Commit implementation and remove one-shot helpers
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm tools/now-coding/apply-editor-test-ux.mjs .github/workflows/now-coding-editor-test-ux-apply.yml
          git add public/now-coding/app-v3.js public/now-coding/index.html public/now-coding/style-v7.css tools/now-coding/client-contract.test.mjs
          git commit -m "feat: improve Now Coding editor and test UX"
          git push origin HEAD:feat/now-coding-editor-test-ux
