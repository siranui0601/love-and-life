name: Temporary T08 regression failure extraction
on:
  pull_request:
    paths:
      - ".github/workflows/trpg-t08-regression-debug.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/trpg-human-authored-choices
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconstruct T08 patch
        shell: bash
        run: |
          mkdir -p src/server/trpg/content/authored/missions /tmp/trpg-t08
          cat .github/t08-assets/pack.*.b64 | base64 -d | gzip -d > src/server/trpg/content/authored/missions/t08-forest-sealing-order.js
          cat .github/t08-assets/patch.01.b64 | base64 -d | gzip -d > /tmp/trpg-t08/patch_t08.py
          python /tmp/trpg-t08/patch_t08.py
      - run: npm ci
      - name: Extract failed TAP blocks
        shell: bash
        run: |
          set +e
          npm run trpg:test > /tmp/trpg-test.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "No failure reproduced" > .github/t08-assets/failure-exact.log
          else
            python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/trpg-test.log').read_text(errors='replace').splitlines()
          hits = [i for i, line in enumerate(lines) if line.startswith('not ok ') or '# Subtest:' in line and i + 1 < len(lines) and lines[i + 1].startswith('not ok ')]
          blocks = []
          used = set()
          for hit in hits:
              start = max(0, hit - 12)
              end = min(len(lines), hit + 90)
              for i in range(start, end):
                  if i not in used:
                      blocks.append(f'{i + 1}: {lines[i]}')
                      used.add(i)
          if not blocks:
              blocks = [f'{i + 1}: {line}' for i, line in enumerate(lines) if 'AssertionError' in line or 'ERR_ASSERTION' in line]
          Path('.github/t08-assets/failure-exact.log').write_text('\n'.join(blocks) + '\n')
          PY
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/t08-assets/failure-exact.log
          git commit -m "chore: record exact T08 regression failure"
          git push origin HEAD:agent/trpg-human-authored-choices
          cat .github/t08-assets/failure-exact.log
          exit "$status"
