name: TRPG Day1 to Day100 single player journey

on:
  push:
    branches:
      - chatgpt/trpg-authored-content-refactor
    paths:
      - ".github/workflows/trpg-day100-player.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  day100-player:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TRPG_DAY100_LIVE_MAX: 48
      TRPG_DAY100_MAX_ACTIONS: 4200
      TRPG_DAY100_SEED: trpg-day100-player-v1
      TRPG_NARRATIVE_REQUEST_TIMEOUT_MS: 25000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/trpg-authored-content-refactor
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply staged Day100 runner correction
        shell: bash
        run: |
          set -euo pipefail
          script="tools/trpg-refactor/apply-day100-rejection-ledger-v1.mjs"
          if [ -f "$script" ]; then
            python - <<'PY'
          from pathlib import Path
          path = Path("tools/trpg-refactor/apply-day100-rejection-ledger-v1.mjs")
          source = path.read_text(encoding="utf-8")
          source = source.replace("}\n `,\n    `function actionText", "}\n`,\n    `function actionText", 1)
          path.write_text(source, encoding="utf-8")
          PY
            node "$script"
          else
            echo "Day100 rejection ledger is already integrated."
          fi
          git diff --check
      - run: npm ci
      - name: Run complete TRPG regression suite
        run: npm run trpg:test
      - name: Run one player-authority Day1 to Day100 journey
        shell: bash
        run: |
          mkdir -p tools/trpg-sim/reports
          set +e
          TRPG_NARRATIVE_RUN_ID=day100-player-pr-v4 npm run trpg:day100-player -- --strict \
            > tools/trpg-sim/reports/day100-player-console.log 2>&1
          status=$?
          cat tools/trpg-sim/reports/day100-player-console.log
          echo "$status" > tools/trpg-sim/reports/day100-player.status
          exit 0
      - name: Upload full private diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trpg-day100-player
          path: |
            tools/trpg-sim/reports/day100-player-*
          if-no-files-found: error
          retention-days: 14
      - name: Commit verified runner correction and compact summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/trpg-sim/reports/day100-player-latest.json
          cp tools/trpg-sim/reports/day100-player-latest.json tools/trpg-sim/reports/day100-player-pr-summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            tools/trpg-refactor/apply-day100-rejection-ledger-v1.mjs \
            tools/trpg-sim/lib/day100-player-policy.mjs \
            tools/trpg-sim/lib/day100-player-runner.mjs \
            tools/trpg-sim/test/day100-rejection-ledger.test.mjs \
            tools/trpg-sim/reports/day100-player-pr-summary.json
          if git diff --cached --quiet; then
            echo "Day100 source and summary are unchanged."
          else
            git commit -m "test(trpg): continue rejection-aware Day100 coverage"
            git push origin HEAD:chatgpt/trpg-authored-content-refactor
          fi
      - name: Enforce journey quality gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat tools/trpg-sim/reports/day100-player.status)" = "0"
