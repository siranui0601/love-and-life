name: now-coding-territory-blocking-glow-once

on:
  push:
    branches:
      - fix/now-coding-territory-blocking-glow
    paths:
      - ".github/workflows/now-coding-territory-blocking-glow-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/now-coding-territory-blocking-glow
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply territory blocking and condition glow
        run: |
          python - <<'PY'
          from pathlib import Path

          def swap(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'missing {label}')
              p.write_text(s.replace(old, new, 1))

          swap(
              'public/now-coding/engine.js',
              'export const NOW_CODING_RULE_VERSION = "territory-v3";',
              'export const NOW_CODING_RULE_VERSION = "territory-v4";',
              'territory rule version',
          )

          swap(
              'public/now-coding/engine.js',
              '''function hasLegalTerritoryMove(state, agent) {\n  if (!agent.alive) return false;\n  const ownIndex = state.agents.indexOf(agent);\n  return DIRECTIONS.some((vector) => {\n    const x = agent.x + vector.x;\n    const y = agent.y + vector.y;\n    if (x < 0 || y < 0 || x >= state.size || y >= state.size) return false;\n    if (headAt(state, x, y, agent.id)) return false;\n    const owner = state.board[y][x];\n    return owner < 0 || owner === ownIndex;\n  });\n}''',
              '''function hasLegalTerritoryMove(state, agent) {\n  if (!agent.alive) return false;\n  return DIRECTIONS.some((vector) => {\n    const x = agent.x + vector.x;\n    const y = agent.y + vector.y;\n    if (x < 0 || y < 0 || x >= state.size || y >= state.size) return false;\n    if (headAt(state, x, y, agent.id)) return false;\n    // In territory mode every claimed cell is a wall, including your own trail.\n    return state.board[y][x] < 0;\n  });\n}''',
              'territory legal move rule',
          )

          swap(
              'public/now-coding/engine.js',
              '''    const owner = state.board[target.y][target.x];\n    const ownIndex = state.agents.indexOf(agent);\n    if (owner >= 0 && owner !== ownIndex) {\n      agent.lastAction = "blocked";\n      continue;\n    }''',
              '''    const owner = state.board[target.y][target.x];\n    // Once a cell is colored it becomes a wall for everyone, even its owner.\n    if (owner >= 0) {\n      agent.lastAction = "blocked";\n      continue;\n    }''',
              'territory movement wall rule',
          )

          swap(
              'public/now-coding/engine.js',
              '''  if (safeLevel === "medium") {\n    return forever([cellIf("front", "unclaimed", [action("move")], [\n      cellIf("front", "own", [action("move")], [action(preferredTurn)]),\n    ])]);\n  }\n  return forever([cellIf("front", "unclaimed", [action("move")], [\n    cellIf("left", "unclaimed", [action("turnLeft")], [\n      cellIf("right", "unclaimed", [action("turnRight")], [\n        cellIf("front", "own", [action("move")], [\n          cellIf("left", "own", [action("turnLeft")], [\n            cellIf("right", "own", [action("turnRight")], [\n              { type: "if", condition: { type: "random", chance: 0.5 }, then: [action(preferredTurn)], else: [action(otherTurn)] },\n            ]),\n          ]),\n        ]),\n      ]),\n    ]),\n  ])]);''',
              '''  if (safeLevel === "medium") {\n    return forever([cellIf("front", "unclaimed", [action("move")], [action(preferredTurn)])]);\n  }\n  return forever([cellIf("front", "unclaimed", [action("move")], [\n    cellIf("left", "unclaimed", [action("turnLeft")], [\n      cellIf("right", "unclaimed", [action("turnRight")], [\n        { type: "if", condition: { type: "random", chance: 0.5 }, then: [action(preferredTurn)], else: [action(otherTurn)] },\n      ]),\n    ]),\n  ])]);''',
              'territory npc own-trail logic',
          )

          swap(
              'public/now-coding/app-v3.js',
              'territory: ["陣取り", "無色のマスを自分の色にします。敵が取った色は壁になり、上書きできません。最後に最も多く取った駒が勝ちます。"],',
              'territory: ["陣取り", "無色のマスを自分の色にします。一度色が付いたマスは、自分・敵を問わず壁になり通れません。最後に最も多く取った駒が勝ちます。"],',
              'territory mode description',
          )

          swap(
              'public/now-coding/tutorials.js',
              'summary: "無色を取り、敵色を壁として避けながら面積を競います。",',
              'summary: "空白を取り、一度色が付いたマスを壁として避けながら面積を競います。",',
              'territory tutorial summary',
          )
          swap(
              'public/now-coding/tutorials.js',
              '{ title: "敵の色は通れない", text: "陣取りでは敵がすでに取ったマスを上書きできません。敵色へ『進む』を実行すると、その場に留まりtickだけを使います。『＜（前）＝（敵の色）＞』を事前に判定すると効率よく避けられます。", focus: \'[data-expression-preset="compare"]\' },',
              '{ title: "色の付いたマスは通れない", text: "陣取りでは、自分・敵を問わず一度色が付いたマスは壁になります。そこへ『進む』を実行してもその場に留まりtickだけを使います。つまり、一度通った道へ引き返すこともできません。『＜（前）＝（空白）＞』を確認してから進むのが基本です。", focus: \'[data-expression-preset="compare"]\' },',
              'territory tutorial wall rule',
          )

          style = Path('public/now-coding/style-v6.css')
          css = style.read_text()
          marker = '/* stronger condition insertion neon */'
          if marker not in css:
              css += '''\n\n/* stronger condition insertion neon */\n.reporter-boolean{filter:drop-shadow(0 0 3px rgba(101,227,163,.5))}\n.reporter-boolean.expression-preset-active{outline:0!important;box-shadow:none!important;background:rgba(47,143,96,.36)!important;filter:brightness(1.28) drop-shadow(0 0 4px var(--type-condition)) drop-shadow(0 0 10px var(--type-condition)) drop-shadow(0 0 20px rgba(101,227,163,.82));animation:conditionNeonPulse .82s ease-in-out infinite}\n.reporter-boolean.expression-preset-active select{border-color:var(--type-condition)!important;box-shadow:0 0 0 1px rgba(101,227,163,.45),0 0 14px rgba(101,227,163,.72)!important}\n.expression-target[data-expected="boolean"].socket-accepting{box-shadow:none!important;filter:brightness(1.3) drop-shadow(0 0 4px var(--type-condition)) drop-shadow(0 0 11px var(--type-condition)) drop-shadow(0 0 21px rgba(101,227,163,.8));animation:conditionTargetPulse .82s ease-in-out infinite}\n@keyframes conditionNeonPulse{50%{filter:brightness(1.5) drop-shadow(0 0 6px var(--type-condition)) drop-shadow(0 0 15px var(--type-condition)) drop-shadow(0 0 27px rgba(101,227,163,.9))}}\n@keyframes conditionTargetPulse{50%{filter:brightness(1.52) drop-shadow(0 0 6px var(--type-condition)) drop-shadow(0 0 15px var(--type-condition)) drop-shadow(0 0 28px rgba(101,227,163,.92))}}\n@media(prefers-reduced-motion:reduce){.reporter-boolean.expression-preset-active,.expression-target[data-expected="boolean"].socket-accepting{animation:none}}\n'''
              style.write_text(css)

          test_path = Path('tools/now-coding/engine.test.mjs')
          tests = test_path.read_text()
          marker = 'test("territory treats every claimed cell as a wall, including its own trail"'
          if marker not in tests:
              anchor = '''test("enemy territory blocks movement and still consumes the tick", () => {\n  const state = stateWithPrograms([move], [right], [{ x: 5, y: 5, dir: 1 }, { x: 6, y: 5, dir: 2 }]);\n  const beforeX = state.agents[0].x;\n  stepTerritory(state);\n  assert.equal(state.tick, 1);\n  assert.equal(state.agents[0].x, beforeX);\n  assert.equal(state.agents[0].lastAction, "blocked");\n});\n'''
              addition = anchor + '''\n\ntest("territory treats every claimed cell as a wall, including its own trail", () => {\n  const state = stateWithPrograms([move, right, right, move], [right], [{ x: 5, y: 5, dir: 1 }, { x: 12, y: 12, dir: 2 }]);\n  const agent = state.agents[0];\n  assert.equal(state.ruleVersion, "territory-v4");\n\n  stepTerritory(state); // move to 6,5 and color it\n  assert.equal(agent.x, 6);\n  assert.equal(agent.y, 5);\n  assert.equal(agent.claimed, 2);\n\n  stepTerritory(state); // right\n  stepTerritory(state); // right again: now facing the spawn cell\n  assert.equal(agent.dir, 3);\n\n  stepTerritory(state); // own spawn cell is already colored, so it is a wall\n  assert.equal(agent.x, 6);\n  assert.equal(agent.y, 5);\n  assert.equal(agent.lastAction, "blocked");\n  assert.equal(agent.claimed, 2);\n});\n'''
              if anchor not in tests:
                  raise SystemExit('missing enemy territory test anchor')
              test_path.write_text(tests.replace(anchor, addition, 1))

          contract_path = Path('tools/now-coding/client-contract.test.mjs')
          contracts = contract_path.read_text()
          marker = 'test("condition insertion and territory wall rules stay visually and textually aligned"'
          if marker not in contracts:
              contracts += '''\n\ntest("condition insertion and territory wall rules stay visually and textually aligned", () => {\n  assert.match(css, /reporter-boolean\\.expression-preset-active/);\n  assert.match(css, /conditionNeonPulse/);\n  assert.match(css, /expression-target\\[data-expected="boolean"\\]\\.socket-accepting/);\n  assert.match(css, /conditionTargetPulse/);\n  assert.match(app, /一度色が付いたマスは、自分・敵を問わず壁/);\n  assert.match(tutorials, /自分・敵を問わず一度色が付いたマスは壁/);\n});\n'''
              contract_path.write_text(contracts)
          PY
      - name: Validate
        run: |
          node --check public/now-coding/vm.js
          node --check public/now-coding/engine.js
          node --check public/now-coding/modes.js
          node --check public/now-coding/app.js
          node --check public/now-coding/app-v3.js
          node --check public/now-coding/tutorials.js
          node --test tools/now-coding/engine.test.mjs tools/now-coding/client-contract.test.mjs
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/now-coding/engine.js public/now-coding/app-v3.js public/now-coding/tutorials.js public/now-coding/style-v6.css tools/now-coding/engine.test.mjs tools/now-coding/client-contract.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix(now-coding): block claimed territory and highlight conditions"
          git push origin HEAD:fix/now-coding-territory-blocking-glow
