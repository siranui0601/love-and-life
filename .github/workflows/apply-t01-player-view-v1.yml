name: Apply TRPG T01 player-view fixes v1

on:
  push:
    branches:
      - chatgpt/trpg-authored-content-refactor

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/trpg-authored-content-refactor
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply T01 player-view integration when still staged
        shell: bash
        run: |
          set +e
          if [ -f tools/trpg-refactor/apply-t01-player-view-v1.mjs ]; then
            node tools/trpg-refactor/apply-t01-player-view-v1.mjs > tools/trpg-t01-player-view-integration.log 2>&1
            status=$?
          else
            printf '%s\n' 'T01 player-view integration already applied.' > tools/trpg-t01-player-view-integration.log
            status=0
          fi
          cat tools/trpg-t01-player-view-integration.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/trpg-t01-player-view-integration.log
            git commit -m "test(trpg): record T01 player-view integration failure"
            git push origin HEAD:chatgpt/trpg-authored-content-refactor
            exit "$status"
          fi
      - run: npm ci
      - name: Run complete TRPG regression suite
        shell: bash
        run: |
          set +e
          npm run trpg:test > tools/trpg-t01-player-view-regression.log 2>&1
          status=$?
          cat tools/trpg-t01-player-view-regression.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/trpg-t01-player-view-regression.log
            git commit -m "test(trpg): record T01 player-view regression failure"
            git push origin HEAD:chatgpt/trpg-authored-content-refactor
            exit "$status"
          fi
      - name: Commit integrated source
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/trpg-t01-player-view-integration.log tools/trpg-t01-player-view-regression.log
          rm -f .github/workflows/apply-t01-player-view-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(trpg): keep T01 rescue focused and age-consistent"
          git push origin HEAD:chatgpt/trpg-authored-content-refactor
