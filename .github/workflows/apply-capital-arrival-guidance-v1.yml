name: Apply TRPG capital arrival guidance v1

on:
  push:
    branches:
      - chatgpt/trpg-authored-content-refactor
    paths:
      - ".github/workflows/apply-capital-arrival-guidance-v1.yml"
      - "tools/trpg-refactor/apply-capital-arrival-guidance-v1.mjs"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/trpg-authored-content-refactor
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply capital arrival guidance
        run: node tools/trpg-refactor/apply-capital-arrival-guidance-v1.mjs
      - run: npm ci
      - name: Run complete TRPG regression suite
        shell: bash
        run: |
          set +e
          npm run trpg:test > tools/trpg-capital-guidance-regression.log 2>&1
          status=$?
          cat tools/trpg-capital-guidance-regression.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/trpg-capital-guidance-regression.log
            git commit -m "test(trpg): record capital guidance regression failure"
            git push origin HEAD:chatgpt/trpg-authored-content-refactor
            exit "$status"
          fi
      - name: Commit verified modular guidance
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/trpg-capital-guidance-regression.log
          rm -f .github/workflows/apply-capital-arrival-guidance-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(trpg): guide first-time capital visitors to the weapon shop"
          git push origin HEAD:chatgpt/trpg-authored-content-refactor
