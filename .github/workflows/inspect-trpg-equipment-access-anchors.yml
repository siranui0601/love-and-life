name: Inspect TRPG equipment access anchors

on:
  push:
    branches:
      - chatgpt/trpg-authored-content-refactor
    paths:
      - ".github/workflows/inspect-trpg-equipment-access-anchors.yml"
      - "tools/trpg-refactor/inspect-equipment-access-anchors.mjs"

permissions:
  contents: write

concurrency:
  group: trpg-equipment-access-inspection
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/trpg-authored-content-refactor
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect exact integration anchors
        run: node tools/trpg-refactor/inspect-equipment-access-anchors.mjs
      - name: Commit diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/trpg-refactor/equipment-access-anchors.log
          git commit -m "build(trpg): record equipment access integration anchors"
          git push origin HEAD:chatgpt/trpg-authored-content-refactor
