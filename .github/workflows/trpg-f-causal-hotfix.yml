name: TRPG Checkpoint F causal hotfix

on:
  push:
    branches:
      - claude/trpg-virtue-route-main-143ar9
    paths:
      - .github/workflows/trpg-f-causal-hotfix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/trpg-virtue-route-main-143ar9
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply narrow causal interaction fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('tools/trpg-sim/lib/npc-life-engine.mjs')
          text = path.read_text()

          old_guard = "if (belief.kind === 'interest' || Number(belief.propagationAt ?? Infinity) > Number(time.absoluteHour)) continue;"
          new_guard = "const contactAt = Number(context.contactAt ?? time.absoluteHour);\n      if (belief.kind === 'interest' || Number(belief.propagationAt ?? Infinity) > contactAt) continue;"
          if text.count(old_guard) != 1:
              raise SystemExit(f'contact guard occurrence mismatch: {text.count(old_guard)}')
          text = text.replace(old_guard, new_guard, 1)

          old_work = "if (workRelated.has(recipientId)) return explicitReason || 'work-relationship';"
          new_work = """const workContext = policy.workRelevant === true
            || belief?.workRelevant === true
            || policy.context === 'work'
            || belief?.disclosureContext === 'work';
          if (workRelated.has(recipientId) && (explicitReason || workContext)) {
            return explicitReason || 'shared-work-context';
          }"""
          if text.count(old_work) != 1:
              raise SystemExit(f'work disclosure occurrence mismatch: {text.count(old_work)}')
          text = text.replace(old_work, new_work, 1)

          path.write_text(text)
          PY
      - name: Syntax check
        run: node --check tools/trpg-sim/lib/npc-life-engine.mjs
      - name: Focused causal world tests
        run: node --test tools/trpg-sim/test/living-world.test.mjs tools/trpg-sim/test/integration.test.mjs tools/trpg-sim/test/world.test.mjs
      - name: Commit verified runtime fix and remove runner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/trpg-f-causal-hotfix.yml
          git add tools/trpg-sim/lib/npc-life-engine.mjs
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(trpg): align interaction knowledge with contact time"
          git push origin HEAD:claude/trpg-virtue-route-main-143ar9
