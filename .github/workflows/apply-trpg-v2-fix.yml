name: Apply TRPG v2 balance fixes

on:
  push:
    branches:
      - agent/trpg-player-simulation-v2-20260717
    paths:
      - ".github/workflows/apply-trpg-v2-fix.yml"
      - "tools/trpg-sim/.v2-fix/**"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/trpg-player-simulation-v2-20260717
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python tools/trpg-sim/.v2-fix/apply.py
      - run: node --check tools/trpg-sim/lib/player-journey.mjs
      - run: npm ci
      - run: npm run trpg:test
      - name: Commit fixes
        run: |
          rm -rf tools/trpg-sim/.v2-fix
          rm -f .github/workflows/apply-trpg-v2-fix.yml
          rm -f tools/trpg-sim/reports/.gitkeep-v2
          rm -f tools/trpg-sim/reports/v2-output-note.txt
          rm -f tools/trpg-sim/reports/v2-output-manifest.json
          rm -f tools/trpg-sim/reports/v2-quality-targets.txt
          rm -f tools/trpg-sim/reports/v2-version.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "TRPG v2: fix action loops, movement diagnostics, event skill supply, and combat pacing" || exit 0
          git push origin HEAD:agent/trpg-player-simulation-v2-20260717
