name: Apply TRPG diverse movement choices

on:
  push:
    branches:
      - chatgpt/trpg-authored-content-refactor
    paths:
      - ".github/workflows/apply-trpg-diverse-movement-choices.yml"
      - "tools/trpg-refactor/apply-diverse-movement-choices.mjs"

permissions:
  contents: write

concurrency:
  group: trpg-diverse-movement-choices
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/trpg-authored-content-refactor
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Integrate movement choices and semantic diversification
        shell: bash
        run: |
          set +e
          mkdir -p tools/trpg-refactor
          node tools/trpg-refactor/apply-diverse-movement-choices.mjs > tools/trpg-refactor/movement-integration.log 2>&1
          status=$?
          cat tools/trpg-refactor/movement-integration.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/trpg-refactor/movement-integration.log
            git commit -m "test(trpg): record movement integration failure"
            git push origin HEAD:chatgpt/trpg-authored-content-refactor
            exit "$status"
          fi
      - run: npm ci
      - name: Run complete TRPG regression suite
        shell: bash
        run: |
          set +e
          npm run trpg:test > tools/trpg-movement-regression.log 2>&1
          status=$?
          cat tools/trpg-movement-regression.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/trpg-movement-regression.log
            git commit -m "test(trpg): record movement regression failure"
            git push origin HEAD:chatgpt/trpg-authored-content-refactor
            exit "$status"
          fi
      - name: Commit integrated source
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/trpg-movement-regression.log tools/trpg-refactor/movement-integration.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(trpg): offer diverse movement choices"
          git push origin HEAD:chatgpt/trpg-authored-content-refactor
