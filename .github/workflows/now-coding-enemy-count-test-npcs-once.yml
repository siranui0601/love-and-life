name: now-coding-enemy-count-test-npcs-once

on:
  push:
    branches:
      - feat/now-coding-timer-speech-text
    paths:
      - ".github/workflows/now-coding-enemy-count-test-npcs-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/now-coding-timer-speech-text
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply enemy-count multi-NPC patch
        run: python tools/now-coding/patch-enemy-count-test-npcs.py
      - name: Syntax check
        run: |
          node --check public/now-coding/app-v3.js
          node --check public/now-coding/vm.js
          node --check public/now-coding/tutorials.js
      - name: Focused tests
        run: node --test tools/now-coding/engine.test.mjs tools/now-coding/client-contract.test.mjs
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/now-coding/app-v3.js public/now-coding/index.html public/now-coding/vm.js public/now-coding/tutorials.js tools/now-coding/engine.test.mjs tools/now-coding/client-contract.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "feat(now-coding): add enemy count and multi-NPC test bench"
          git push origin HEAD:feat/now-coding-timer-speech-text
