name: now-coding-patch-online-once

on:
  push:
    branches:
      - feat/now-coding-vm-editor-v2
    paths:
      - tools/now-coding/patch-online-series-client.mjs
      - .github/workflows/now-coding-patch-online-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/now-coding-vm-editor-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repair known v3 summary typo
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'public/now-coding/app-v3.js';
          let src = fs.readFileSync(file, 'utf8');
          const bad = 'modes.length>1?`${modes.length}ゲーム総合戦":"単一ゲーム"';
          const good = 'modes.length>1?`${modes.length}ゲーム総合戦`:"単一ゲーム"';
          if (!src.includes(bad)) throw new Error('known summary typo anchor not found');
          src = src.replace(bad, good);
          fs.writeFileSync(file, src);
          NODE
      - name: Apply online series patch
        run: node tools/now-coding/patch-online-series-client.mjs
      - name: Validate syntax
        run: node --check public/now-coding/app-v3.js
      - name: Commit patched client
        run: |
          if git diff --quiet -- public/now-coding/app-v3.js; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/now-coding/app-v3.js
          git commit -m "feat(now-coding): complete online multi-round client"
          git push origin HEAD:feat/now-coding-vm-editor-v2
