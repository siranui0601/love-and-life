<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111c24">
<meta name="description" content="TRPG（仮）の11地域を3Dで俯瞰できる世界地図。">
<meta name="robots" content="noindex,nofollow">
<title>世界の地図 | TRPG（仮）</title>
<style>
:root{color-scheme:dark;--gold:#d6bc84;--ink:#e6e3d7;--panel:#182730;--line:#64726d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;background:#0c161d;color:var(--ink)}
body{display:flex;flex-direction:column;height:100dvh}
header{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:15px clamp(15px,3vw,40px);background:#101e26;z-index:1;border-bottom:1px solid #43565b}
header a{font-size:12px;text-decoration:none;color:var(--gold)}
h1{font:normal clamp(22px,3vw,34px)/1.2 "Yu Mincho","Hiragino Mincho ProN",serif;letter-spacing:.15em;margin:4px 0}
.kicker{font-size:10px;letter-spacing:.2em;color:#b5aa8d}
.viewport{position:relative;flex:1;min-height:300px;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;background:#19313d}
.legend{position:absolute;right:clamp(10px,2vw,30px);bottom:18px;max-width:240px;border:1px solid #887a5b;background:#15242be8;padding:16px 17px;pointer-events:none;backdrop-filter:blur(4px)}
.legend h2{margin:0 0 9px;font:normal 19px "Yu Mincho",serif;color:#e6d2a3}
.legend p{font-size:12px;line-height:1.75;margin:5px 0;color:#d6d5c8}
.status{position:absolute;top:16px;left:16px;background:#15252ae9;padding:9px 12px;border:1px solid #60736d;color:#e0dfce;font-size:12px;max-width:min(460px,calc(100% - 32px))}
.status[hidden]{display:none}
footer{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:10px clamp(15px,3vw,40px);border-top:1px solid #43565b;background:#101e26;color:#b1bdb6;font-size:11px}
button{font:inherit;color:#e5d1a1;border:1px solid #a28d60;background:transparent;padding:8px 14px;cursor:pointer}
button:hover{background:#35433c}
@media(max-width:660px){header{padding:12px 15px}.legend{left:10px;right:auto;bottom:10px;padding:10px 12px;max-width:215px}.legend p{font-size:10px}.viewport{min-height:300px}footer{font-size:10px;padding:8px 12px}}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/babylonjs@9.25.0/babylon.js"></script>
<script type="module" src="/atlas-review/main.js"></script>
</head>
<body>
<header><div><span class="kicker">TRPG（仮） / GEOGRAPHIC ATLAS</span><h1>世界の地図</h1></div><a href="/">← 不知火遊技場</a></header>
<main class="viewport">
 <canvas id="atlas" tabindex="0" aria-label="回転・拡大できる3D世界地図。マウスでドラッグして回転します。"></canvas>
 <div id="status" class="status" role="status">11の土地を描画しています…</div>
 <aside class="legend" aria-label="地図の説明"><h2>世界の俯瞰</h2><p>主要地域 11 / 接続ルート 15</p><p>ドラッグ：回転・傾き<br>ホイール：拡大縮小<br>右ドラッグ：視点の移動</p><p>街道は往来の目安。草原や森のすべてが道で区切られているわけではありません。</p></aside>
</main>
<footer><span>地理の3D縮尺模型。ゲーム内の自由歩行・NPC生活の実装とは別です。</span><button id="reset" type="button">視点をリセット</button></footer>
</body>
</html>
