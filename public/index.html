
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>不知火遊技場</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ★ 新規追加: ゲーム選択画面 -->
  <!-- ゲーム選択画面（初期表示） -->
  <center>
<section id="gameMenu">
  <h1 class="menu-title">Game Collection</h1>
  <div class="game-grid">
    <div class="game-card" data-game="love-life">
      <div class="game-icon">❤️</div>
      <h2>AI×恋愛</h2>
      <p>30日間の恋愛シミュレーション</p>
    </div>
    
    <div class="game-card coming-soon" data-game="game2">
      <div class="game-icon">🎮</div>
      <h2>Coming Soon</h2>
      <p>新しいゲームを準備中...</p>
    </div>
    
    <div class="game-card coming-soon" data-game="game3">
      <div class="game-icon">🎯</div>
      <h2>Coming Soon</h2>
      <p>新しいゲームを準備中...</p>
    </div>
  </div>


 <!-- ▼ ここから追加：ログインエリア ▼ -->
  <div class="auth-area">
    <div id="loginStatus">ログインしていません</div>
    <div id="googleSignInBtn"></div>
    <button id="logoutBtn" class="logout-btn" style="display:none;">
      ログアウト
    </button>
  </div>
  <!-- ▲ ここまで追加 ▲ -->
</section>

    <!-- ユーザーネーム設定モーダル -->
<div id="usernameModal" class="simple-modal" style="display:none;">
  <div class="simple-modal-inner">
    <h2>ユーザーネーム設定</h2>
    <p>このゲーム内で表示する名前を決めてください。</p>
    <input id="usernameInput" type="text" maxlength="20" placeholder="例）そら" />
    <div class="simple-modal-buttons">
      <button id="usernameSaveBtn">OK</button>
    </div>
  </div>
</div>

  </center>

<!-- 既存のタイトル画面（初期状態で非表示） -->
<section id="titleScreen" style="display: none;">
  <h1>恋愛人生ゲーム</h1>
  <button id="btnStart">Game Start</button>
</section>

  <section id="setupWrapper">
    <div class="ctrlBtns">
      <button id="btnAdd">＋ プレイヤー追加</button>
      <button id="btnRemove">－ プレイヤー削除</button>
    </div>
    <div id="playerList"></div>
    <button id="btnBegin" class="startBtn">夏休み開始！</button>
  </section>

  <canvas id="threeCanvas"></canvas>

  <div id="modal" class="modal">
    <div class="modal-content"></div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="script.js"></script>


  <!-- Backボタン（ゲーム中表示） -->
<button id="backBtn" class="back-btn">←</button>

<!-- 戻る確認モーダル -->
<div id="backModal" class="modal">
  <div class="modal-content">
    <p>タイトル画面に戻りますか？</p>
    <div class="modal-buttons">
      <button id="confirmBack">戻る</button>
      <button id="cancelBack">戻らない</button>
    </div>
  </div>
</div>

  
</body>
</html>
