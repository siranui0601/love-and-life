
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>不知火遊技場</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ★ 新規追加: ゲーム選択画面 -->
  <!-- ゲーム選択画面（初期表示） -->
  <center>
<section id="gameMenu">
  <h1 class="menu-title">Game Collection</h1>
  <div class="game-grid">
    <div class="game-card" data-game="love-life">
      <div class="game-icon">❤️</div>
      <h2>AI×恋愛</h2>
      <p>30日間の恋愛シミュレーション</p>
    </div>
    
    <div class="game-card" data-game="judgement-ai" id="cardJudgementAI">
      <div class="game-icon">⚖️</div>
      <h2>断罪AI</h2>
      <p>AIのふりをして生き残れ</p>
    </div>

    
    <div class="game-card coming-soon" data-game="game3">
      <div class="game-icon">🎯</div>
      <h2>Coming Soon</h2>
      <p>新しいゲームを準備中...</p>
    </div>
  </div>


 <!-- ▼ ここから追加：ログインエリア ▼ -->
  <div class="auth-area">
    <div id="loginStatus">ログインしていません</div>
    <div id="googleSignInBtn"></div>
    <button id="logoutBtn" class="logout-btn" style="display:none;">
      ログアウト
    </button>
  </div>
  <!-- ▲ ここまで追加 ▲ -->
</section>






    

    <section id="judgementAI" style="display:none;">
  <h1 class="menu-title">断罪AI</h1>

  <div class="judgement-actions">
    <button id="btnRandomMatch">ランダム対戦</button>
    <button id="btnRoomMatch">ルーム対戦</button>
    <button id="btnJudgementRules">ルール説明</button>
  </div>

  <div id="roomMatchPanel" style="display:none;" class="room-panel">
    <div class="room-buttons">
      <button id="btnRoomCreate">作成</button>
      <button id="btnRoomJoin">入室</button>
    </div>

    <div id="roomCreatePanel" style="display:none;" class="room-subpanel">
      <label class="checkbox-line">
        <input type="checkbox" id="chkAllowRandom" />
        ランダム入室を許可する
      </label>
      <button id="btnRoomCreateConfirm">決定</button>
      <p id="createdRoomInfo" class="muted"></p>
    </div>

    <div id="roomJoinPanel" style="display:none;" class="room-subpanel">
      <input id="roomIdInput" maxlength="4" inputmode="numeric" placeholder="4桁のルームID" />
      <button id="btnRoomJoinConfirm">入室</button>
      <p id="joinRoomInfo" class="muted"></p>
    </div>
  </div>

  <div id="waitingRoom" style="display:none;" class="waiting-room">
    <h2>待機部屋</h2>
    <p>ルームID: <span id="waitingRoomId"></span></p>

    <div class="settings-row">
      <label>参加人数（最大）</label>
      <input id="maxPlayersInput" type="number" min="2" max="8" value="4" />
    </div>
    <div class="settings-row">
      <label>AIの数</label>
      <input id="aiCountInput" type="number" min="1" max="10" value="3" />
    </div>

    <div>
      <h3>参加者</h3>
      <ul id="waitingMembers"></ul>
    </div>

    <button id="btnStartJudgementGame" disabled>ゲーム開始</button>
  </div>

  <button id="btnBackToMenu" class="tiny-back">メニューに戻る</button>
</section>


    

    <!-- ユーザーネーム設定モーダル -->
<div id="usernameModal" class="simple-modal" style="display:none;">
  <div class="simple-modal-inner">
    <h2>ユーザーネーム設定</h2>
    <p>このゲーム内で表示する名前を決めてください。</p>
    <input id="usernameInput" type="text" maxlength="20" placeholder="例）そら" />
    <div class="simple-modal-buttons">
      <button id="usernameSaveBtn">OK</button>
    </div>
  </div>
</div>

  </center>

<!-- 既存のタイトル画面（初期状態で非表示） -->
<section id="titleScreen" style="display: none;">
  <h1>恋愛人生ゲーム</h1>
  <button id="btnStart">Game Start</button>
</section>

  <section id="setupWrapper">
    <div class="ctrlBtns">
      <button id="btnAdd">＋ プレイヤー追加</button>
      <button id="btnRemove">－ プレイヤー削除</button>
    </div>
    <div id="playerList"></div>
    <button id="btnBegin" class="startBtn">夏休み開始！</button>
  </section>

  <canvas id="threeCanvas"></canvas>

  <div id="modal" class="modal">
    <div class="modal-content"></div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="script.js"></script>


  <!-- Backボタン（ゲーム中表示） -->
<button id="backBtn" class="back-btn">←</button>

<!-- 戻る確認モーダル -->
<div id="backModal" class="modal">
  <div class="modal-content">
    <p>タイトル画面に戻りますか？</p>
    <div class="modal-buttons">
      <button id="confirmBack">戻る</button>
      <button id="cancelBack">戻らない</button>
    </div>
  </div>
</div>

  
</body>
</html>
