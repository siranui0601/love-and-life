<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>恋愛人生ゲーム - Game Menu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ★ ゲーム選択画面（ログインボタン追加） -->
  <section id="gameMenu">
    <h1 class="menu-title">Game Collection</h1>
    
    <!-- ログイン状態表示 -->
    <div id="loginStatus" style="margin-bottom: 30px;">
      <button id="btnLogin" class="login-btn">
        <img src="https://developers.google.com/identity/images/g-logo.png" 
             alt="Google" style="width:20px; margin-right:8px;">
        Googleでログイン
      </button>
      <div id="userInfo" style="display:none;">
        <p>ようこそ、<span id="userName"></span>さん</p>
        <button id="btnLogout" class="logout-btn">ログアウト</button>
      </div>
    </div>

    <div class="game-grid">
      <div class="game-card" data-game="love-life">
        <div class="game-icon">❤️</div>
        <h2>AI×恋愛</h2>
        <p>30日間の恋愛シミュレーション</p>
      </div>
      
      <div class="game-card coming-soon" data-game="game2">
        <div class="game-icon">🎮</div>
        <h2>Coming Soon</h2>
        <p>新しいゲームを準備中...</p>
      </div>
      
      <div class="game-card coming-soon" data-game="game3">
        <div class="game-icon">🎯</div>
        <h2>Coming Soon</h2>
        <p>新しいゲームを準備中...</p>
      </div>
    </div>
  </section>

  <!-- 既存のタイトル画面（初期状態で非表示） -->
  <section id="titleScreen" style="display: none;">
    <h1>恋愛人生ゲーム</h1>
    <button id="btnStart">Game Start</button>
  </section>

  <section id="setupWrapper">
    <div class="ctrlBtns">
      <button id="btnAdd">＋ プレイヤー追加</button>
      <button id="btnRemove">－ プレイヤー削除</button>
    </div>
    <div id="playerList"></div>
    <button id="btnBegin" class="startBtn">夏休み開始！</button>
  </section>

  <canvas id="threeCanvas"></canvas>

  <div id="modal" class="modal">
    <div class="modal-content"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
