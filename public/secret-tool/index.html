<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ひみつ道具バトル</title>
  <link rel="stylesheet" href="/secret-tool/secret-tool.css" />
</head>
<body>
  <main class="page">
    <section id="homePanel" class="panel">
      <h1>ひみつ道具バトル</h1>

      <p id="message" class="message"></p>

      <div class="main-actions">
        <button id="createRoomBtn" class="cute-btn" type="button">ルーム作成</button>
        <button id="joinRoomBtn" class="cute-btn" type="button">ルーム入室</button>
      </div>

      <button id="backToTitleBtn" class="cute-btn ghost" type="button">タイトルに戻る</button>
    </section>

    <section id="waitingRoom" class="panel waiting hidden">
      <h2>待機部屋</h2>
      <p>ルームID: <span id="roomIdText">-</span></p>
      <h3>参加者</h3>
      <ul id="memberList"></ul>
      <div class="waiting-actions">
        <button id="startGameBtn" class="cute-btn" type="button" disabled>ゲーム開始</button>
        <button id="deleteRoomBtn" class="cute-btn danger hidden" type="button">ルーム削除</button>
        <button id="leaveRoomBtn" class="cute-btn ghost hidden" type="button">ルーム退室</button>
      </div>
    </section>

    <section id="waitingNote" class="note-box">
      待機部屋は、ルーム作成またはルーム入室後に表示されます。
    </section>

    <section id="battlePanel" class="panel battle hidden">
      <div id="battleScene" class="battle-scene" aria-label="対戦3Dビュー"></div>
      <p id="battlePhase" class="battle-phase"></p>

      <div id="deckAnimation" class="deck-animation">四次元ポケット</div>

      <ul id="tableSeats" class="table-seats"></ul>

      <section id="mulliganPanel" class="mulligan-panel hidden">
        <h3>初期手札（5枚）</h3>
        <p id="mulliganCounter">0/3 枚選択中</p>
        <div id="handList" class="hand-list"></div>
        <button id="finishMulliganBtn" class="cute-btn" type="button">この内容でマリガン完了</button>
      </section>
    </section>
  </main>

  <div id="actionModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-body">
      <p id="actionModalText"></p>
      <div class="modal-actions">
        <button id="actionYesBtn" class="cute-btn" type="button">はい</button>
        <button id="actionNoBtn" class="cute-btn ghost" type="button">いいえ</button>
      </div>
    </div>
  </div>

  <div id="infoModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-body">
      <p id="infoModalText"></p>
      <div class="modal-actions">
        <button id="infoModalCloseBtn" class="cute-btn" type="button">閉じる</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/secret-tool/secret-tool.js"></script>
</body>
</html>
