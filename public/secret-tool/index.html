<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ひみつ道具バトル</title>
  <link rel="stylesheet" href="./secret-tool.css" />
</head>
<body>
  <main class="page">
    <section class="panel">
      <h1>ひみつ道具バトル</h1>
      <div class="main-actions">
        <button id="createRoomBtn" class="cute-btn">ルーム作成</button>
        <button id="joinRoomBtn" class="cute-btn">ルーム入室</button>
      </div>
      <button id="backToTitleBtn" class="cute-btn ghost">タイトルに戻る</button>
      <p id="message" class="message"></p>
    </section>

    <section id="waitingRoom" class="panel waiting hidden">
      <h2>待機部屋</h2>
      <p>ルームID: <span id="roomIdText">-</span></p>
      <h3>参加者</h3>
      <ul id="memberList"></ul>
    </section>
  </main>

  <div id="confirmModal" class="modal hidden">
    <div class="modal-body">
      <p>本当に戻りますか？</p>
      <div class="modal-actions">
        <button id="confirmYesBtn" class="cute-btn">はい</button>
        <button id="confirmNoBtn" class="cute-btn ghost">いいえ</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="./secret-tool.js"></script>
</body>
</html>
