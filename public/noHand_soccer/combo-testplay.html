<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>noHand soccer live combo lab</title>
  <link rel="stylesheet" href="./testplay.css">
</head>
<body>
  <main class="shell live-lab">
    <section class="stage-panel">
      <header class="topbar">
        <div>
          <p class="eyebrow">NOHAND SOCCER / LIVE ABILITY LAB</p>
          <h1>3絵文字 合成装置 実機研究室</h1>
        </div>
        <div class="controls">
          <label class="mode-label" for="launchMode">入射テスト</label>
          <select id="launchMode" class="mode-select">
            <option value="topDrop">真上から落下</option>
            <option value="diagonalDrop">斜め上から落下</option>
            <option value="leftShot">左から打ち出し</option>
            <option value="wallBank">壁バンク入射</option>
            <option value="rain3">3球連続落下</option>
            <option value="paintFollow">後続球で軌跡検証</option>
          </select>
          <button id="launchButton">落下開始</button>
          <button id="retryButton" class="secondary">リセット</button>
        </div>
      </header>

      <canvas id="fieldCanvas" width="960" height="540" aria-label="combo ability runtime lab field"></canvas>
      <p class="hint">装置をドラッグ配置。黄色の点線が入射予測、青いリングが装置接触域。上から落ちるボールが実際に装置へ触れ、compilerで選ばれたactionsだけをruntimeで発動します。</p>
    </section>

    <aside class="side-panel">
      <section class="card slots-card">
        <label class="search-label">素材絵文字 / slot-order-sensitive</label>
        <div class="slot-grid">
          <div><b>主役</b><select id="emoji1" size="5"></select></div>
          <div><b>変質</b><select id="emoji2" size="5"></select></div>
          <div><b>出口</b><select id="emoji3" size="5"></select></div>
        </div>
      </section>

      <section class="card combo-card">
        <h2 id="comboTitle">Combo</h2>
        <p id="comboSummary" class="summary"></p>
      </section>

      <section class="card"><h2>Compiler actions</h2><div id="actionList" class="ability-list"></div></section>
      <section class="card"><h2>Runtime abilities</h2><div id="abilityList" class="ability-list"></div></section>
      <section class="card debug-card"><h2>Live state</h2><pre id="debugOverlay"></pre></section>
    </aside>
  </main>
  <script type="module" src="./combo-testplay.js"></script>
</body>
</html>
