<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=/noHand_soccer_stage1/">
  <title>サッカーは、素手以外セーフ</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #03110b;
      color: #f7fff8;
    }
    body {
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 15% 0%, rgba(101, 255, 176, 0.25), transparent 32%),
        radial-gradient(circle at 86% 8%, rgba(232, 255, 102, 0.16), transparent 25%),
        linear-gradient(145deg, #071b11 0%, #020806 64%, #000 100%);
    }
    main {
      width: min(92vw, 520px);
      border: 1px solid rgba(225, 255, 236, 0.18);
      border-radius: 28px;
      padding: 28px;
      background: rgba(7, 28, 20, 0.78);
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255,255,255,0.12);
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: clamp(1.4rem, 7vw, 2.3rem); }
    p { color: #b8d6c7; line-height: 1.7; }
    a {
      display: inline-block;
      margin-top: 12px;
      border-radius: 999px;
      padding: 12px 18px;
      background: linear-gradient(135deg, #f6ff7a 0%, #7cf1a7 58%, #52d9ff 100%);
      color: #102016;
      font-weight: 900;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>⚽ サッカーは、素手以外セーフ</h1>
    <p>ゲーム本体へ移動しています。自動で移動しない場合は下のボタンを押してください。</p>
    <a href="/noHand_soccer_stage1/">ゲームを開く</a>
  </main>
  <script>
    window.location.replace('/noHand_soccer_stage1/');
  </script>
</body>
</html>
