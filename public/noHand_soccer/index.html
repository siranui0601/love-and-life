<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>サッカーは、素手以外セーフ</title><link rel="stylesheet" href="/noHand_soccer/style.css"><script src="/socket.io/socket.io.js"></script><script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script></head><body>
<header class="app-header"><div><p class="eyebrow">素手で触らなければ、何をしてもセーフ</p><h1>⚽ サッカーは、素手以外セーフ</h1></div><div class="scoreboard"><span>発想ポイント</span><b id="points">0</b><small id="versionBadge"></small></div></header>
<main class="app-main">
<section id="shop" class="panel"><div class="section-title"><h2>🛒 絵文字ショップ</h2><button id="receiveInitial" class="coach hidden">初期セットを受け取る</button></div><div id="shopTabs" class="category-tabs"></div><div class="shop-tools"><input id="shopSearch" placeholder="カテゴリ内検索"><select id="shopFilter"><option value="all">すべて</option><option value="unowned">未所持</option><option value="owned">所持済み</option></select><select id="shopSort"><option value="priceAsc">価格が安い順</option><option value="priceDesc">価格が高い順</option><option value="name">名前順</option></select></div><div id="shopGrid" class="shop-grid"></div><aside id="cart" class="cart"></aside></section>
<section id="gen" class="panel hidden"><h2>🧪 ギミック生成ラボ</h2><p class="hint">所持絵文字を1〜3個。重複OK、順番違いは別ギミック。生成は30P（チュートリアル初回無料）。</p><div id="ownedEmoji" class="chip-grid"></div><div id="seq" class="sequence-box"></div><button id="generateBtn" class="primary">30Pで生成</button><div id="generated" class="generated-card"></div></section>
<section id="match" class="panel hidden"><div class="hud"><b id="cost">0/30</b><b id="timer">0.00</b><button id="playBtn">キック！</button><button id="pauseBtn">⏸</button><button id="retryBtn">リトライ</button><button id="undoPlace">1つ戻す</button><button id="clearPlace">配置全消し</button><button id="rankBtn">ランキング</button></div><div id="matchWrap"><canvas id="field" width="900" height="1400"></canvas><div id="log"></div></div><div id="gimmickTray" class="gimmick-tray"></div></section>
<section id="book" class="panel hidden"><h2>📚 ギミック図鑑</h2><button id="bookRankBtn">ランキングを開く</button><div id="bookList" class="book-list"></div></section>
<section id="ranking" class="panel hidden"><h2>🏆 ランキング</h2><select id="rankType"><option value="time">クリア時間</option><option value="cost">最小コスト</option></select><button id="closeRank">閉じる</button><div id="rankList"></div></section>
<section id="debug" class="panel hidden"><h2>🛠 デバッグ</h2><pre id="debugText"></pre><div class="debug-actions"><button id="togglePhysics">物理停止/再開</button><button id="stepFrame">1フレーム送り</button><button id="forceGoal">強制ゴール</button><button id="forceOwn">強制オウンゴール</button><button id="addPoints">ポイント+500</button><button id="allEmoji">全絵文字購入</button><button id="resetTut">チュートリアルリセット</button><button id="debugClear">配置全消し</button><button id="hitToggle">当たり判定</button></div></section>
</main><nav class="bottom-tabs"><button data-tab="shop">🛒<span>ショップ</span></button><button data-tab="gen">🧪<span>生成</span></button><button data-tab="match">⚽<span>試合</span></button><button data-tab="book">📚<span>図鑑</span></button></nav>
<div id="tutorialSpot" class="tutorial-spot hidden"></div><div id="resultLayer" class="result-layer hidden"></div><div id="dragGhost" class="drag-ghost hidden"></div><div id="toast" class="toast hidden"></div><div id="modal" class="modal hidden"><div class="modal-card"><b class="modal-role">監督指示</b><p id="modalText"></p><div id="modalActions"><button id="modalOk" class="primary">OK</button></div></div></div>
<script type="module" src="/noHand_soccer/main.js"></script></body></html>
