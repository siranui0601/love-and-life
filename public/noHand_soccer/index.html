<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>サッカーは、素手以外セーフ</title><link rel="stylesheet" href="/noHand_soccer/style.css"><script src="/socket.io/socket.io.js"></script><script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script></head><body><header><h1>⚽ サッカーは、素手以外セーフ</h1><div><b id="points">0</b>P <span id="versionBadge"></span></div></header><main><section id="title" class="panel"><h2>ハンド以外ぜんぶセーフ。</h2><p>絵文字ギミックを貼り付けて物理演算でゴールをねじ込め！</p><button id="startBtn">キックオフ</button></section><section id="shop" class="panel hidden"><h2>🛒 ショップ</h2><div id="shopTabs"></div><div id="shopGrid"></div><aside id="cart"></aside></section><section id="gen" class="panel hidden"><h2>🧪 生成</h2><p>所持絵文字を1〜3個選択（同じ絵文字を何度でもOK・順番違いは別物）</p><div id="ownedEmoji"></div><div id="seq"></div><button id="generateBtn">30Pで生成</button><div id="generated"></div></section><section id="match" class="panel hidden"><div class="hud"><b id="cost">0/30</b><b id="timer">0.00</b><button id="playBtn">▶ 再生</button><button id="pauseBtn">⏸</button><button id="retryBtn">↻</button><button id="cameraBtn">カメラ</button><button id="rankBtn">ランキング</button></div><div id="matchWrap"><canvas id="field" width="900" height="1400"></canvas><div id="log"></div></div><div id="gimmickTray"></div></section><section id="book" class="panel hidden"><h2>📚 図鑑</h2><button id="bookRankBtn">ランキング</button><div id="bookList"></div></section><section id="ranking" class="panel hidden"><h2>🏆 ランキング</h2><select id="rankType"><option value="time">クリア時間</option><option value="cost">最小コスト</option></select><button id="closeRank">閉じる</button><div id="rankList"></div></section><section id="debug" class="panel hidden"><h2>デバッグ</h2><pre id="debugText"></pre><button id="forceGoal">強制ゴール</button><button id="forceOwn">強制オウンゴール</button><button id="addPoints">ポイント+500</button><button id="allEmoji">全絵文字購入</button><button id="resetTut">チュートリアルリセット</bu
