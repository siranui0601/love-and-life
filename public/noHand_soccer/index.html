<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>サッカーはハンド以外セーフ？</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./ux-overrides.css" />
</head>
<body>
  <main class="app" id="app">
    <header class="topbar">
      <div class="brand"><span>⚽</span><b>ハンド以外セーフ？</b></div>
      <div class="mini-score"><span id="roundLabel">R1</span><span id="goalLabel">0/1</span></div>
    </header>

    <section class="coach" id="coachBar">
      <b id="coachTitle">ボールを黄色いゴールへ入れよう</b>
      <p id="coachText">まずは下のキックオフを押す。ボールがどう動くか見ればOK。</p>
    </section>

    <section class="screen screen-venue is-active" id="venueScreen" aria-label="会場">
      <div class="field-card">
        <div class="canvas-shell" id="canvasShell">
          <canvas id="gameCanvas" width="900" height="1180"></canvas>
          <div class="field-help" id="fieldHelp" hidden></div>
        </div>
        <div class="venue-actions">
          <button class="primary-btn" id="kickBtn" type="button">キックオフ</button>
          <button class="ghost-btn" id="centerBtn" type="button">全体を見る</button>
        </div>
      </div>

      <div class="dock" id="gimmickDock" hidden>
        <div class="dock-head"><b>ギミック</b><span>カードをコートへドラッグ</span></div>
        <div class="dock-list" id="dockList"></div>
      </div>
    </section>

    <section class="screen screen-generate" id="generateScreen" aria-label="生成">
      <div class="generate-card">
        <div class="step-badge" id="generateStepBadge">STEP 1</div>
        <h1>絵文字を3つ選ぶ</h1>
        <p id="generateHint">素材絵文字を3つタップ。選んだ3つから、ボールを助けるギミックを作る。</p>
        <div class="selected-row" id="selectedRow"></div>
        <button class="primary-btn full" id="generateBtn" type="button">ギミック生成</button>
      </div>
      <div class="emoji-card-panel">
        <div class="panel-title"><b>素材絵文字</b><span id="emojiCountLabel">0個</span></div>
        <div class="emoji-grid" id="emojiGrid"></div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" id="bottomNav" hidden>
    <button type="button" class="tab-btn is-active" data-tab="venue">🏟️<span>会場</span></button>
    <button type="button" class="tab-btn is-locked" data-tab="generate">🧪<span>生成</span></button>
  </nav>

  <div class="generate-wait" id="generateWaitOverlay" hidden>
    <div class="generate-wait-card">
      <div class="construction-loop" aria-hidden="true"><span>🔨</span><span>⚙️</span><span>✨</span></div>
      <b>作成中…</b>
      <p>絵文字からギミックをトンカン工事中。</p>
    </div>
  </div>

  <div class="modal is-open" id="modal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <p class="modal-kicker" id="modalKicker">KICK OFF</p>
      <h2 id="modalTitle">今宵はサッカー！</h2>
      <p id="modalText">ボールを黄色いゴールへ入れるゲームです。まずは会場を見て、下のキックオフを押そう⚽️</p>
      <button class="primary-btn full" id="modalPrimary" type="button">会場を見る</button>
      <button class="text-btn" id="modalSecondary" type="button" hidden>閉じる</button>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="./generation-wait.js"></script>
  <script src="./anti-trap-fetch.js"></script>
  <script src="./app-runtime-boot.js"></script>
</body>
</html>
