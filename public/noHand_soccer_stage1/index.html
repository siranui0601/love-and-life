<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>サッカーは、素手以外セーフ - Stage 3 Drag Attach</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./stage2.css">
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
</head>
<body>
  <header class="stage-header">
    <div>
      <p class="eyebrow">STAGE 3 / 固定ギミック・ドラッグ装着</p>
      <h1>⚽ サッカーは、素手以外セーフ</h1>
    </div>
    <div class="status-card" aria-label="試合状態">
      <span id="matchState">準備中</span>
      <strong id="timer">0.00s</strong>
    </div>
  </header>

  <main class="stage-layout">
    <section class="field-panel" aria-label="試合場">
      <div class="field-frame" id="fieldFrame">
        <canvas id="fieldCanvas" width="900" height="1400"></canvas>
        <div id="resultOverlay" class="result-overlay hidden"></div>
      </div>
    </section>

    <aside class="control-panel">
      <section class="control-card kick-card">
        <h2>キック設定</h2>
        <label>
          角度 <output id="angleValue">0°</output>
          <input id="angleInput" type="range" min="-35" max="35" value="0">
        </label>
        <label>
          威力 <output id="powerValue">0.021</output>
          <input id="powerInput" type="range" min="10" max="34" value="21">
        </label>
        <div class="button-grid">
          <button id="kickBtn" class="primary">キック！</button>
          <button id="pauseBtn">一時停止</button>
          <button id="retryBtn">リトライ</button>
          <button id="speedBtn">等速</button>
        </div>
      </section>

      <section class="gimmick-card" aria-label="固定ギミック">
        <div class="gimmick-header">
          <div>
            <h2>固定ギミック</h2>
            <p>カードをコートへドラッグ、またはカード選択後に対象をタップして装着。配置した数だけコストを消費します。</p>
          </div>
          <div class="cost-meter" aria-label="コスト">
            <span>コスト</span>
            <strong><b id="costUsed">0</b>/<b id="costLimit">30</b></strong>
          </div>
        </div>
        <div id="gimmickList" class="gimmick-list"></div>
        <div id="placementList" class="placement-list" aria-label="配置済みギミック"></div>
        <div class="gimmick-actions">
          <button id="presetBtn" type="button">おすすめ配置</button>
          <button id="clearGimmicksBtn" type="button">全撤去</button>
        </div>
      </section>

      <section class="coach-card">
        <h2>監督メモ</h2>
        <p>第3段階では、AI生成前の固定ギミックを実際の対象へ装着するUIを検証します。対応しない対象へは配置できません。</p>
        <p>相手選手は速く、ボールに触れると自陣ゴールへ強く蹴ります。待機時間を減らし、細工の必要性が分かるバランスにしています。</p>
      </section>

      <section class="control-card">
        <h2>確認用デバッグ</h2>
        <div class="button-grid compact">
          <button id="hitboxBtn">当たり判定</button>
          <button id="forceGoalBtn">強制ゴール</button>
          <button id="forceOwnGoalBtn">強制失点</button>
          <button id="stepBtn">1フレーム</button>
        </div>
        <pre id="debugText" class="debug-text"></pre>
      </section>

      <section class="log-card">
        <h2>発動ログ</h2>
        <div id="logList" class="log-list"></div>
      </section>
    </aside>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
