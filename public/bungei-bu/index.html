<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>時々文芸部！</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="screen">
    <header class="hero">
      <h1 class="title">時々文芸部！</h1>
      <p class="subtitle">最後の文芸部活動で、彼女を作ることを目指します。</p>
    </header>

    <section class="details">
      <p>
        文章を打つことで時間が進み、キャラがリアクションを返します。
        120分が経過すると部活動は終わり、学校を出て夏休みに入ります。
      </p>
    </section>

    <section class="actions">
      <button type="button" class="action primary">スタート</button>
      <button type="button" class="action ghost">続きから</button>
    </section>

    <p class="note">Googleログインは不要ですが、GoogleスプレッドシートとGeminiを活用します。</p>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
