<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>時々文芸部！</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="hero">
      <button class="game-card" id="gameTap" type="button" aria-label="ゲームをタップ">
        <span class="game-card__label">時々文芸部！</span>
        <span class="game-card__subtitle">ゲームをタップしてはじめよう</span>
      </button>

      <p class="game-lead">
        文章を打つことで時間が進み、キャラがリアクションを返します。<br />
        120分が経過すると部活動は終わり、学校を出て夏休みに入ります。<br />
        最後の文芸部活動で、彼女を作ることを目指しましょう。
      </p>

      <div class="actions" aria-label="メニュー">
        <button class="action-button" type="button">スタート</button>
        <button class="action-button action-button--secondary" type="button">続きから</button>
      </div>
    </main>

    <script src="./main.js"></script>
  </body>
</html>
