<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>時々文芸部！</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="scene" id="scene">
      <div class="scene__hud">
        <div class="timer">残り:120分</div>
      </div>

      <div class="scene__content">
        <div class="character-stage">
          <img class="character-image" id="characterImage" alt="" />
        </div>
      </div>

      <button class="choice-card" id="choiceCard" type="button" hidden>
        じゃあさ、片付けでもしながら夏っぽいの詠まない？
      </button>

      <div class="dialogue-box" id="dialogueBox" aria-live="polite">
        <span class="dialogue-name" id="dialogueName"></span>
        <p class="dialogue-text" id="dialogueText"></p>
        <span class="dialogue-hint">タップで次へ</span>
      </div>

      <div class="start-overlay" id="startOverlay" role="dialog" aria-modal="true">
        <div class="start-card">
          <h1>時々文芸部！</h1>
          <p>
            最後の文芸部がはじまるよ。<br />
            スタートを押すとイントロが流れます。
          </p>
          <button class="action-button" id="startButton" type="button">スタート</button>
        </div>
      </div>

      <div class="modal" id="modal" role="dialog" aria-modal="true" hidden>
        <div class="modal__content">
          <p class="modal__text" id="modalText"></p>
          <span class="modal__note" id="modalNote"></span>
        </div>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
