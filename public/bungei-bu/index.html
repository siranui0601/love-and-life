<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>時々文芸部！</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./enhancements.css" />
  </head>
  <body>
    <main
      class="scene"
      id="scene"
      data-initial-bg="https://pbs.twimg.com/media/G_ckRdSboAAoOnb.jpg"
    >
      <div class="hud">
        <span class="hud__timer">残り:120文字</span>
      </div>

      <div class="player-line-header is-hidden" id="playerLineHeader">あなたの台詞</div>

      <section class="intro-screen" id="introScreen">
        <div class="intro-card">
          <span class="intro-card__label">時々文芸部！</span>
          <p class="intro-card__lead">
            夏休み前、最後の放課後。<br />
            部室で集まるのも、今日が最後の文芸部です。
          </p>
          <div class="actions" aria-label="メニュー">
            <button class="action-button" id="startButton" type="button">スタート</button>
            <button
              class="action-button action-button--secondary"
              id="continueButton"
              type="button"
            >
              続きから
            </button>
            <button
              class="action-button action-button--secondary"
              id="creditButton"
              type="button"
            >
              クレジット
            </button>
            <button
              class="action-button action-button--secondary"
              id="titleReturnButton"
              type="button"
            >
              タイトル画面に戻る
            </button>
          </div>
        </div>
      </section>

      <section class="play-area is-hidden" id="playArea" aria-live="polite" hidden>
        <div class="character-stage">
          <img
            class="character-stage__image"
            id="characterImage"
            src=""
            alt="キャラクターの立ち絵"
          />
        </div>
        <div class="choice-card-list is-hidden" id="choiceCardList" hidden></div>
        <div class="dialogue-box" id="dialogueBox">
          <span class="dialogue-name" id="dialogueName"></span>
          <p class="dialogue-line" id="dialogueLine"></p>
          <span class="dialogue-hint">タップで次のセリフへ</span>
        </div>
      </section>

      <section class="result-screen is-hidden" id="resultScreen" hidden>
        <div class="result-card">
          <span class="result-card__label">リザルト</span>
          <div class="result-slots" id="resultSlots" aria-label="付き合えた人">
            <div class="slot">
              <img src="" alt="" />
            </div>
            <div class="slot">
              <img src="" alt="" />
            </div>
            <div class="slot">
              <img src="" alt="" />
            </div>
          </div>
          <div class="result-rating">
            <span class="result-rating__label">評価！</span>
            <div class="result-rating__rank" id="resultRank">A</div>
            <p class="result-rating__comment" id="resultComment"></p>
          </div>
          <div class="result-actions">
            <button class="action-button" id="retryButton" type="button">もう一度</button>
            <button
              class="action-button action-button--secondary"
              id="resultCreditButton"
              type="button"
            >
              クレジット
            </button>
            <button class="action-button action-button--secondary" id="toTopButton" type="button">
              トップページに戻る
            </button>
          </div>
        </div>
      </section>

      <div class="input-panel is-hidden" id="inputPanel" hidden>
        <label class="input-panel__label" for="playerInput">台詞入力</label>
        <textarea
          class="input-panel__textarea"
          id="playerInput"
          rows="3"
          placeholder="台詞を入力してください"
        ></textarea>
        <div class="input-panel__actions">
          <button
            class="input-back-button is-hidden"
            id="inputBackButton"
            type="button"
            hidden
          >
            戻る
          </button>
          <button class="send-button" id="sendButton" type="button" disabled>
            送信
          </button>
        </div>
      </div>
    </main>

    <audio id="dailyBgm" preload="auto" loop src="/api/bungei/bgm/daily"></audio>

    <div class="curtain" id="curtain" aria-hidden="true">
      <div class="curtain__bow"></div>
    </div>

    <div class="modal is-hidden" id="modal" role="dialog" aria-modal="true">
      <div class="modal__content">
        <p class="modal__text" id="modalText"></p>
        <span class="modal__footnote" id="modalFootnote"></span>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
    <script type="module" src="./tree.js"></script>
    <script type="module" src="./enhancements.js"></script>
  </body>
</html>
