<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>TRPG(仮題) | 不知火遊技場</title>
  <link rel="stylesheet" href="/TRPG/style.css" />
</head>
<body>
  <main class="shell">
    <a class="back-link" href="/" aria-label="不知火遊技場へ戻る">← 不知火遊技場</a>

    <section class="hero" aria-labelledby="title">
      <p class="eyebrow">100日間、世界は待ってくれない。</p>
      <h1 id="title">TRPG<span>（仮題）</span></h1>
      <p class="lead">
        AIが描写を担い、サーバーが世界状態と戦闘結果を管理する、
        時間進行型の異世界ゲームブックです。
      </p>
      <div class="status-chip">開発中 / スキルJSON β版 接続済み</div>
    </section>

    <section class="panel" aria-labelledby="data-title">
      <div class="panel-heading">
        <div>
          <p class="panel-kicker">Runtime data</p>
          <h2 id="data-title">スキルデータ</h2>
        </div>
        <a class="json-link" href="/TRPG/data/skills.beta.json">JSONを直接開く</a>
      </div>

      <p id="loadStatus" class="load-status" aria-live="polite">スキルJSONを読み込んでいます…</p>

      <div class="metrics" aria-label="スキルデータ概要">
        <div class="metric"><strong id="totalSkills">—</strong><span>全登録</span></div>
        <div class="metric"><strong id="enabledSkills">—</strong><span>使用候補</span></div>
        <div class="metric"><strong id="runtimeReady">—</strong><span>共通命令対応</span></div>
        <div class="metric"><strong id="customHandlers">—</strong><span>個別処理待ち</span></div>
      </div>

      <div class="search-box">
        <label for="skillSearch">スキル名・IDを試しに検索</label>
        <input id="skillSearch" type="search" placeholder="例：アンコール / SKL-0001" autocomplete="off" />
      </div>
      <div id="skillPreview" class="skill-preview" hidden></div>
    </section>

    <section class="panel compact" aria-labelledby="next-title">
      <p class="panel-kicker">Next milestone</p>
      <h2 id="next-title">次の開発工程</h2>
      <p>地域別モンスター、モンスタースキル、装備性能を接続し、高度な戦闘シミュレーションへ進みます。</p>
    </section>
  </main>

  <script type="module" src="/TRPG/app.js"></script>
</body>
</html>
